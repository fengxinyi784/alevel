<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>热门院校 - A-Level Guide</title>
    <meta name="description" content="精选英国16所热门大学，覆盖G5、罗素集团及红砖大学，助你规划申请梯度。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        duo: {
                            green: '#58CC02', blue: '#1CB0F6', yellow: '#FFC800',
                            orange: '#FF9600', red: '#FF4B4B', purple: '#CE82FF',
                            pink: '#FF86D0', cyan: '#14D4F4',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <link rel="stylesheet" href="ai-assistant.css">

    <style>
        :root {
            --duo-green: #58CC02;
            --duo-green-dark: #58A700;
            --duo-blue: #1CB0F6;
            --duo-blue-dark: #1899D6;
            --duo-yellow: #FFC800;
            --text-main: #3C3C3C;
            --text-sub: #777777;
            --text-faint: #AFAFAF;
            --border-soft: #E5E5E5;
            --bg-page: #F7F7F7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            font-weight: 500;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        ::selection {
            background: rgba(88, 204, 2, 0.25);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #EDEDED;
        }

        ::-webkit-scrollbar-thumb {
            background: #CFCFCF;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #B0B0B0;
        }

        /* ========== 背景 ========== */
        #glow-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFFFA 40%, #FFFFFF 70%, #F5FBFF 100%);
            background-size: 300% 300%;
            animation: pageGradient 24s ease-in-out infinite;
        }

        @keyframes pageGradient {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            will-change: transform;
        }

        .glow-orb--1 {
            width: 600px;
            height: 600px;
            top: -180px;
            left: -180px;
            background: radial-gradient(circle, rgba(88, 204, 2, 0.5) 0%, rgba(88, 204, 2, 0.15) 45%, transparent 72%);
            animation: flow1 28s ease-in-out infinite;
        }

        .glow-orb--2 {
            width: 560px;
            height: 560px;
            bottom: -200px;
            right: -160px;
            background: radial-gradient(circle, rgba(28, 176, 246, 0.5) 0%, rgba(28, 176, 246, 0.15) 45%, transparent 72%);
            animation: flow2 32s ease-in-out infinite;
            animation-delay: -8s;
        }

        .glow-orb--3 {
            width: 480px;
            height: 480px;
            top: 40%;
            right: -100px;
            background: radial-gradient(circle, rgba(206, 130, 255, 0.45) 0%, rgba(206, 130, 255, 0.12) 45%, transparent 72%);
            animation: flow3 34s ease-in-out infinite;
            animation-delay: -14s;
        }

        .glow-orb--4 {
            width: 460px;
            height: 460px;
            bottom: 10%;
            left: -100px;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.45) 0%, rgba(255, 200, 0, 0.12) 45%, transparent 72%);
            animation: flow4 30s ease-in-out infinite;
            animation-delay: -6s;
        }

        @keyframes flow1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(20vw, 15vh) scale(1.1);
            }

            50% {
                transform: translate(35vw, 38vh) scale(0.95);
            }

            75% {
                transform: translate(10vw, 50vh) scale(1.05);
            }
        }

        @keyframes flow2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            20% {
                transform: translate(-22vw, -12vh) scale(1.1);
            }

            50% {
                transform: translate(-42vw, -35vh) scale(0.92);
            }

            75% {
                transform: translate(-15vw, -48vh) scale(1.06);
            }
        }

        @keyframes flow3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(-18vw, 22vh) scale(1.12);
            }

            66% {
                transform: translate(-26vw, 48vh) scale(0.94);
            }
        }

        @keyframes flow4 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(18vw, -14vh) scale(1.08);
            }

            55% {
                transform: translate(32vw, 6vh) scale(0.94);
            }
        }

        #particles-layer {
            display: none !important;
        }

        /* ========== 导航栏 ========== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            border-bottom: 2px solid var(--border-soft) !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
        }

        .nav-glass .text-white {
            color: var(--text-main) !important;
            text-shadow: none !important;
        }

        .nav-glass .nav-link {
            color: var(--text-sub) !important;
            font-weight: 700 !important;
        }

        .nav-glass .nav-link:hover {
            color: var(--duo-green) !important;
        }

        .nav-glass .nav-link.active {
            color: var(--duo-green) !important;
        }

        .nav-glass #mobile-menu-btn {
            border-color: var(--border-soft) !important;
        }

        .nav-glass #mobile-menu-btn svg {
            color: var(--text-main) !important;
        }

        #mobile-menu {
            background: #fff !important;
            border-top: 2px solid var(--border-soft);
        }

        #mobile-menu a {
            color: var(--text-main) !important;
            font-weight: 700 !important;
        }

        #mobile-menu a:hover,
        #mobile-menu a.nav-active {
            background: #F0F9E8 !important;
            color: var(--duo-green) !important;
        }

        /* ========== 主区 ========== */
        main {
            position: relative;
            z-index: 1;
            padding: 32px 24px 64px;
        }

        .page-head {
            text-align: center;
            padding: 16px 16px 24px;
        }

        .page-head h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .page-head h1 .hl {
            color: var(--duo-green);
        }

        .page-head p {
            margin-top: 10px;
            font-size: 1rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* ========== 按钮 ========== */
        .btn-duo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 22px;
            border: none;
            border-radius: 14px;
            background: var(--duo-green);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--duo-green-dark);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
            user-select: none;
            white-space: nowrap;
        }

        .btn-duo:hover {
            filter: brightness(1.06);
        }

        .btn-duo:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        .btn-duo:focus-visible {
            outline: 3px solid rgba(88, 204, 2, 0.4);
            outline-offset: 2px;
        }

        .btn-duo.ghost {
            background: #fff;
            color: var(--text-sub);
            box-shadow: 0 4px 0 var(--border-soft);
            border: 2px solid var(--border-soft);
        }

        .btn-duo.ghost:hover {
            color: var(--text-main);
        }

        .btn-duo.ghost:active {
            box-shadow: 0 0 0 var(--border-soft);
        }

        /* ========== 筛选栏 ========== */
        #filterBar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        /* ========== 网格 ========== */
        #uniGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 修复：#uniGrid 的 display:grid 优先级高于 .hidden，需要 ID + class 组合选择器覆盖 */
        #uniGrid.hidden {
            display: none !important;
        }

        /* ========== 大学卡片 ========== */
        .uni-card {
            position: relative;
            height: 500px;
            perspective: 1400px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            outline: none;
        }

        .uni-card:focus-visible {
            outline: 3px solid rgba(88, 204, 2, 0.5);
            outline-offset: 3px;
            border-radius: 22px;
        }

        .uni-card.hidden-card {
            display: none;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .uni-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            background: #fff;
            border: 2px solid var(--border-soft);
            border-bottom: 5px solid var(--c-dark);
            display: flex;
            flex-direction: column;
        }

        .uni-card:hover .card-front {
            border-color: var(--c);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.1);
        }

        /* ---- 顶部彩色 hero 区（带悬停图片） ---- */
        .card-hero {
            position: relative;
            padding: 22px 20px 18px;
            background: linear-gradient(135deg, var(--c) 0%, var(--c-dark) 100%);
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
            isolation: isolate;
            min-height: 130px;
        }

        /* 图片层：默认隐藏，hover 淡入 + 缩放 */
        /* 关键：--uni-img 默认 none，只有 hover 时才由 JS 注入，避免一次性下载所有图片 */
        .card-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--uni-img, none);
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1.08);
            transition: opacity 0.45s ease, transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -2;
            pointer-events: none;
        }

        /* 暗色遮罩 */
        .card-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.55) 100%);
            opacity: 0;
            transition: opacity 0.45s ease;
            z-index: -1;
            pointer-events: none;
        }

        .uni-card:hover .card-hero::before,
        .uni-card.is-img-loaded:hover .card-hero::before {
            opacity: 1;
            transform: scale(1);
        }

        .uni-card:hover .card-hero::after {
            opacity: 1;
        }

        .card-hero .uni-emoji {
            font-size: 42px;
            line-height: 1;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .uni-card:hover .card-hero .uni-emoji {
            transform: scale(1.15) rotate(-6deg);
        }

        .card-hero .uni-abbr {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.02em;
            position: relative;
            z-index: 1;
            font-family: Georgia, serif;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        /* 收藏按钮 */
        .fav-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 10;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #CFCFCF;
            transition: transform 0.15s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .fav-btn svg {
            width: 18px;
            height: 18px;
        }

        .fav-btn:hover {
            border-color: var(--duo-yellow);
            color: var(--duo-yellow);
            transform: scale(1.1);
        }

        .fav-btn:active {
            transform: scale(0.92);
        }

        .fav-btn:focus-visible {
            outline: 3px solid rgba(255, 200, 0, 0.5);
            outline-offset: 2px;
        }

        .fav-btn.active {
            background: var(--duo-yellow);
            border-color: var(--duo-yellow);
            color: #fff;
            animation: fav-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fav-pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.28);
            }

            100% {
                transform: scale(1);
            }
        }

        /* ---- 正面主体 ---- */
        .card-body {
            padding: 18px 20px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .card-body .uni-name {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .card-body .uni-en {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-faint);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: -8px;
        }

        .card-body .uni-rank {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--c) 14%, #fff);
            border: 2px solid color-mix(in srgb, var(--c) 24%, #fff);
            color: var(--c-dark);
            font-size: 12px;
            font-weight: 800;
            align-self: flex-start;
        }

        .card-body .card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-body .card-info .ci-label {
            font-size: 10px;
            font-weight: 900;
            color: var(--c);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .card-body .card-info p {
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--text-sub);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ---- 底部 ---- */
        .card-footer {
            padding: 12px 16px 14px;
            border-top: 2px dashed var(--border-soft);
            background: #FAFAFA;
            flex-shrink: 0;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .card-tags span {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            color: var(--c-dark);
            background: color-mix(in srgb, var(--c) 14%, #fff);
            border: 1.5px solid color-mix(in srgb, var(--c) 26%, #fff);
        }

        .card-stats {
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }

        .stat-pill {
            flex: 1;
            min-width: 0;
            padding: 6px 4px;
            border-radius: 10px;
            background: #fff;
            border: 2px solid var(--border-soft);
            text-align: center;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease;
        }

        .uni-card:hover .stat-pill {
            transform: translateY(-3px);
            border-color: color-mix(in srgb, var(--c) 40%, #fff);
        }

        .uni-card:hover .stat-pill:nth-child(2) {
            transition-delay: 0.04s;
        }

        .uni-card:hover .stat-pill:nth-child(3) {
            transition-delay: 0.08s;
        }

        .uni-card:hover .stat-pill:nth-child(4) {
            transition-delay: 0.12s;
        }

        .stat-pill b {
            display: block;
            font-size: 13px;
            font-weight: 900;
            color: var(--c);
            line-height: 1.1;
        }

        .stat-pill small {
            display: block;
            font-size: 9px;
            font-weight: 800;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 2px;
        }

        /* ---- 背面 ---- */
        .card-back {
            transform: rotateY(180deg);
            background: #FFFBF0;
            border-color: #F2E8CC;
            border-bottom-color: #E8D9A8;
            padding: 22px 20px 20px;
        }

        .card-back .back-header {
            text-align: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 2px dashed #E8D9A8;
        }

        .card-back .back-header h3 {
            font-family: Georgia, serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: #3D2E10;
        }

        .card-back .back-header .back-en {
            font-size: 0.7rem;
            font-weight: 700;
            color: #A38A4C;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 3px;
            display: block;
        }

        .card-back .back-body {
            flex: 1;
            overflow-y: auto;
            font-size: 0.84rem;
            line-height: 1.6;
            color: #4A3D1F;
            scrollbar-width: thin;
            scrollbar-color: #E8D9A8 transparent;
        }

        .card-back .back-body::-webkit-scrollbar {
            width: 4px;
        }

        .card-back .back-body::-webkit-scrollbar-thumb {
            background: #E8D9A8;
            border-radius: 2px;
        }

        .card-back .back-section {
            margin-bottom: 12px;
        }

        .card-back .back-section .bs-label {
            display: block;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #A38A4C;
            margin-bottom: 5px;
        }

        .card-back .back-section p {
            font-size: 0.84rem;
            line-height: 1.6;
            color: #4A3D1F;
        }

        /* 聊天气泡 */
        .chat-message {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 12px 0;
            width: 100%;
        }

        .chat-left {
            justify-content: flex-start;
        }

        .chat-right {
            justify-content: flex-end;
        }

        .chat-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #F2E8CC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
            user-select: none;
            border: 2px solid #E8D9A8;
        }

        .chat-left .chat-avatar {
            order: 1;
        }

        .chat-right .chat-avatar {
            order: 2;
        }

        .chat-bubble {
            background: #fff;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            color: #4A3D1F;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            position: relative;
            max-width: 78%;
            line-height: 1.55;
            word-wrap: break-word;
            border: 1.5px solid #F2E8CC;
        }

        .chat-left .chat-bubble {
            order: 2;
        }

        .chat-right .chat-bubble {
            order: 1;
        }

        .chat-left .chat-bubble::after {
            content: '';
            position: absolute;
            left: -7px;
            top: 13px;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 8px solid #fff;
        }

        .chat-right .chat-bubble::after {
            content: '';
            position: absolute;
            right: -7px;
            top: 13px;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid #fff;
        }

        /* ========== 空状态 ========== */
        #empty-favorites {
            text-align: center;
            padding: 60px 24px;
            border: 3px dashed var(--border-soft);
            border-radius: 20px;
            background: #fff;
            max-width: 520px;
            margin: 28px auto 0;
        }

        /* 修复：#empty-favorites 是 ID 选择器，用 ID + class 组合覆盖 .hidden */
        #empty-favorites.hidden {
            display: none !important;
        }

        #empty-favorites .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 14px;
        }

        #empty-favorites p {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        /* ========== 页脚 ========== */
        footer {
            position: relative;
            z-index: 1;
            padding: 30px 16px;
            text-align: center;
            border-top: 2px solid var(--border-soft);
            background: #fff;
            color: var(--text-faint);
            font-size: 13px;

                requirements: 'A-Level：A*AA - BBB',
                tags: ['russell'],
                labels: ['药学第一', '三校区'],
                intro: '罗素创始成员，三校区布局，商学院全英唯一三校区三重认证。',
                tuition: '£20,000 - £36,000/年',
                comments: [
                    '诺丁汉的校园很漂亮，尤其是夏天的湖边。药学和商科资源都很强，老师很愿意帮助学生。',
                    '三校区的设置很特别，有机会去宁波或马来西亚交流。就业支持很到位。'
                ],
                stats: [
                    { v: '93%', l: '就业率' }, { v: 'AACSB', l: '商学院' },
                    { v: 'EQUIS', l: '认证' }, { v: 'AMBA', l: '三重认证' }
                ]
            },
            {
                key: 'Sheffield', zh: '谢菲尔德大学', en: 'University of Sheffield',
                abbr: 'She', emoji: '⚒️', color: '#F97316', dark: '#EA580C',
                image: 'images/She.png',
                rank: 'QS世界第92',
                strengths: '工程学、材料科学、建筑学、新闻学',
                requirements: 'A-Level：AAA - ABB',
                tags: ['russell', 'brick'],
                labels: ['工程强校', '红砖大学'],
                intro: '红砖大学，罗素集团成员，欧洲顶尖工程研究中心。',
                tuition: '£24,000 - £28,000/年',
                comments: [
                    '谢菲尔德的学生满意度不是吹的，学生会真的很给力。城市生活成本低，对钱包很友好。',
                    '工程专业的实验条件很棒，尤其是钻石大楼。不过冬天有点冷，需要适应。'
                ],
                stats: [
                    { v: '92%', l: '就业率' }, { v: '38%', l: '国际生' },
                    { v: '£27k', l: '起薪' }, { v: '第1', l: 'NSS满意度' }
                ]
            },
            {
                key: 'StAndrews', zh: '圣安德鲁斯大学', en: 'University of St Andrews',
                abbr: 'StA', emoji: '🏴', color: '#0EA5E9', dark: '#0284C7',
                image: 'images/StA.png',
                rank: 'QS世界第113 · 英国本土前4',
                strengths: '国际关系、哲学、古典学、英国文学、历史',
                requirements: 'A-Level：A*AA - ABB',
                tags: ['scotland'],
                labels: ['第三古老', '小班精英', '王室之选'],
                intro: '1413 年建校，英语世界第三古老，小班精英教育，王室之选。',
                tuition: '£31,000 - £39,000/年',
                comments: [
                    '圣安是小班教学，教授都能叫出你的名字。虽然小镇生活单调，但很适合静心做学问。',
                    '学校很有王室气质，传统活动很多。国际关系专业确实强，学术讨论很深入。'
                ],
                stats: [
                    { v: '14%', l: '录取率' }, { v: '82.8%', l: '就业率' },
                    { v: '4.18', l: '满意度' }, { v: '92%', l: 'NSS满意度' }
                ]
            },
            {
                key: 'Glasgow', zh: '格拉斯哥大学', en: 'University of Glasgow',
                abbr: 'Gla', emoji: '🦄', color: '#0891B2', dark: '#0E7490',
                image: 'images/Gla.png',
                rank: 'QS世界第79',
                strengths: '医学、商科、工程、计算机科学、数据科学',
                requirements: 'A-Level：AAA - ABB',
                tags: ['russell', 'scotland'],
                labels: ['第四古老', '苏格兰名校'],
                intro: '英语世界第四古老大学，罗素集团成员，7 位诺奖得主。',
                tuition: '£24,000 - £29,000/年',
                comments: [
                    '格拉斯哥的学术底蕴很深厚，老师水平很高。城市文化丰富，音乐和艺术活动很多。',
                    '学校建筑很有特色，像霍格沃茨。医学和工程专业很强，但学习压力也不小。'
                ],
                stats: [
                    { v: '15%', l: '录取率' }, { v: '78.3%', l: '就业率' },
                    { v: '3.85', l: '满意度' }, { v: '69%', l: '整体录取' }
                ]
            }
        ];

        const uniGrid = document.getElementById('uniGrid');
        const emptyFav = document.getElementById('empty-favorites');

        const FAV_SVG = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg>`;

        function buildCard(u) {
            const tags = u.labels.map(t => `<span>${t}</span>`).join('');
            const stats = u.stats.map(s => `<div class="stat-pill"><b>${s.v}</b><small>${s.l}</small></div>`).join('');
            const comments = u.comments.map((c, i) => `
                <div class="chat-message ${i % 2 === 0 ? 'chat-left' : 'chat-right'}">
                    <div class="chat-avatar">${i % 2 === 0 ? '🙋‍♀️' : '🙋‍♂️'}</div>
                    <div class="chat-bubble">${c}</div>
                </div>
            `).join('');

            // 关键：把图片路径存到 data-uni-img，而不是直接注入 CSS 变量
            // 这样只有在 mouseenter / 进入视口时才真正加载图片
            return `
            <div class="uni-card"
                 data-tags="${u.tags.join(' ')}"
                 data-uni-key="${u.key}"
                 data-uni-img="${u.image}"
                 tabindex="0"
                 role="button"
                 aria-expanded="false"
                 aria-label="${u.zh}，按 Enter 查看详情"
                 style="--c: ${u.color}; --c-dark: ${u.dark};">
                <div class="card-inner">
                    <div class="card-front">
                        <button class="fav-btn" data-uni-key="${u.key}" aria-label="收藏 ${u.zh}" title="收藏院校">${FAV_SVG}</button>
                        <div class="card-hero">
                            <div class="uni-emoji">${u.emoji}</div>
                            <div class="uni-abbr">${u.abbr}</div>
                        </div>
                        <div class="card-body">
                            <h2 class="uni-name">${u.zh}</h2>
                            <div class="uni-en">${u.en}</div>
                            <div class="uni-rank">🏆 ${u.rank}</div>
                            <div class="card-info">
                                <span class="ci-label">优势专业</span>
                                <p>${u.strengths}</p>
                            </div>
                            <div class="card-info">
                                <span class="ci-label">录取要求</span>
                                <p>${u.requirements}</p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="card-tags">${tags}</div>
                            <div class="card-stats">${stats}</div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="back-header">
                            <h3>${u.zh}</h3>
                            <span class="back-en">${u.en}</span>
                        </div>
                        <div class="back-body">
                            <div class="back-section">
                                <span class="bs-label">学校简介</span>
                                <p>${u.intro}</p>
                            </div>
                            <div class="back-section">
                                <span class="bs-label">学费参考</span>
                                <p>${u.tuition}</p>
                            </div>
                            <div class="back-section">
                                <span class="bs-label">学生评论</span>
                                ${comments}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        uniGrid.innerHTML = UNIVERSITIES.map(buildCard).join('');

        // ========== 图片懒加载 ==========
        // 只有当卡片首次进入视口时，才注入 --uni-img，触发图片下载
        // 避免首屏一次性下载 16 张 PNG
        (function initLazyImages() {
            const cards = document.querySelectorAll('.uni-card');
            if (!cards.length) return;

            const loadImage = (card) => {
                const hero = card.querySelector('.card-hero');
                if (!hero || hero.style.getPropertyValue('--uni-img')) return;
                const img = card.getAttribute('data-uni-img');
                if (img) hero.style.setProperty('--uni-img', `url('${img}')`);
                card.classList.add('is-img-loaded');
            };

            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            loadImage(entry.target);
                            obs.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '200px 0px' });

                cards.forEach(c => io.observe(c));
            } else {
                cards.forEach(loadImage);
            }

            // 桌面端鼠标进入卡片时立即加载（保证 hover 有图）
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => loadImage(card), { once: true });
            });
        })();

        // ========== 卡片翻转（鼠标 + 键盘） ==========
        function toggleFlip(card) {
            if (card.classList.contains('hidden-card')) return;
            card.classList.toggle('flipped');
            card.setAttribute('aria-expanded', card.classList.contains('flipped') ? 'true' : 'false');
        }

        // 鼠标点击（星星由全局委托处理，不会走到这里）
        uniGrid.addEventListener('click', (e) => {
            // 若点击位置在星星上，跳过
            if (e.target.closest('.fav-btn')) return;
            const card = e.target.closest('.uni-card');
            if (!card) return;
            toggleFlip(card);
        });

        // 键盘 Enter / Space 翻转
        uniGrid.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.uni-card');
            if (!card) return;
            // 如果焦点在星星按钮上，Enter 会触发星星点击，不处理
            if (e.target.closest('.fav-btn')) return;
            e.preventDefault();
            toggleFlip(card);
        });

        // ========== 筛选逻辑 ==========
        const filterBtns = document.querySelectorAll('#filterBar .filter-btn');
        let currentFilterMode = 'all';
        let currentCategory = 'all';

        function applyCategoryFilter(type) {
            document.querySelectorAll('.uni-card').forEach(card => {
                const tags = (card.getAttribute('data-tags') || '').split(/\s+/);
                if (type === 'all' || tags.includes(type)) {
                    card.classList.remove('hidden-card');
                } else {
                    card.classList.add('hidden-card');
                }
            });
            emptyFav.classList.add('hidden');
            uniGrid.classList.remove('hidden');
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function () {
                filterBtns.forEach(b => {
                    b.classList.remove('active');
                    b.classList.add('ghost');
                    b.setAttribute('aria-pressed', 'false');
                });
                this.classList.add('active');
                this.classList.remove('ghost');
                this.setAttribute('aria-pressed', 'true');

                if (this.id === 'view-fav-uni-btn') {
                    currentFilterMode = 'favorites';
                    if (typeof window.applyFavoritesFilter === 'function') {
                        window.applyFavoritesFilter();
                    }
                } else {
                    currentFilterMode = 'category';
                    currentCategory = this.getAttribute('data-filter');
                    applyCategoryFilter(currentCategory);
                }
            });
        });

        // ========== 收藏逻辑 ==========
        // ⭐ 复用全局客户端（由 supabase-config.js 创建）

        let currentUser = null;
        const favoriteKeys = new Set();
        let supabaseClient = null;

        function updateFavButtons() {
            document.querySelectorAll('.fav-btn').forEach(btn => {
                const key = btn.getAttribute('data-uni-key');
                const isFav = favoriteKeys.has(key);
                btn.classList.toggle('active', isFav);
                btn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
            });
        }

        async function toggleFavorite(key) {
            if (!currentUser) {
                // duoRequireLogin 可能是由 nav.js 动态定义的，需先检查
                if (typeof window.duoRequireLogin === 'function') {
                    try {
                        const go = await window.duoRequireLogin('university');
                        if (go) window.location.href = 'login.html';
                    } catch (_) {
                        window.location.href = 'login.html';
                    }
                } else {
                    window.location.href = 'login.html';
                }
                return;
            }

            const wasFav = favoriteKeys.has(key);

            // 乐观更新
            if (wasFav) favoriteKeys.delete(key);
            else favoriteKeys.add(key);
            updateFavButtons();
            if (currentFilterMode === 'favorites' && typeof window.applyFavoritesFilter === 'function') {
                window.applyFavoritesFilter();
            }

            try {
                if (wasFav) {
                    await supabaseClient
                        .from('university_favorites')
                        .delete()
                        .eq('user_id', currentUser.id)
                        .eq('university_key', key);
                } else {
                    await supabaseClient
                        .from('university_favorites')
                        .insert([{ user_id: currentUser.id, university_key: key }]);
                }
            } catch (err) {
                // 失败回滚
                console.warn('收藏操作失败，已回滚：', err);
                if (wasFav) favoriteKeys.add(key);
                else favoriteKeys.delete(key);
                updateFavButtons();
                if (currentFilterMode === 'favorites' && typeof window.applyFavoritesFilter === 'function') {
                    window.applyFavoritesFilter();
                }
            }
        }

        // ⭐ 星星点击：使用事件委托（挂到 uniGrid 上）
        uniGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('.fav-btn');
            if (!btn) return;
            e.stopPropagation();
            toggleFavorite(btn.getAttribute('data-uni-key'));
        });

        window.applyFavoritesFilter = function () {
            let visibleCount = 0;
            document.querySelectorAll('.uni-card').forEach(card => {
                const key = card.getAttribute('data-uni-key');
                if (favoriteKeys.has(key)) {
                    card.classList.remove('hidden-card');
                    visibleCount++;
                } else {
                    card.classList.add('hidden-card');
                }
            });
            if (visibleCount === 0) {
                uniGrid.classList.add('hidden');
                emptyFav.classList.remove('hidden');
            } else {
                uniGrid.classList.remove('hidden');
                emptyFav.classList.add('hidden');
            }
        };

        (async function initSupabase() {
            // ⭐ 直接复用全局客户端
            supabaseClient = window.supabaseClient;
            if (!supabaseClient) {
                console.warn('Supabase 客户端未初始化，请检查 supabase-config.js');
                return;
            }
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                currentUser = user;
                if (user) {
                    const { data } = await supabaseClient
                        .from('university_favorites')
                        .select('university_key')
                        .eq('user_id', user.id);
                    if (data) data.forEach(item => favoriteKeys.add(item.university_key));
                }
                updateFavButtons();
            } catch (err) {
                console.warn('获取用户信息失败：', err);
            }
        })();

        // ========== 从 bfcache 返回时温和重新同步（不再整页 reload） ==========
        window.addEventListener('pageshow', async (event) => {
            if (!event.persisted) return;
            if (!supabaseClient) return;
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                currentUser = user;
                favoriteKeys.clear();
                if (user) {
                    const { data } = await supabaseClient
                        .from('university_favorites')
                        .select('university_key')
                        .eq('user_id', user.id);
                    if (data) data.forEach(item => favoriteKeys.add(item.university_key));
                }
                updateFavButtons();
                if (currentFilterMode === 'favorites' && typeof window.applyFavoritesFilter === 'function') {
                    window.applyFavoritesFilter();
                }
            } catch (_) { /* 忽略 */ }
        });

        // 让浏览器自己管理滚动位置（不再强制回到顶部）
    </script>

    <script src="nav.js"></script>
    <script src="ai-assistant.js"></script>
</body>
