<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>橘猫 · 蹭蹭</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #F7F7F7;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
    }

    .char-wrap {
        width: 220px;
        height: 220px;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                    filter 0.4s ease;
        animation: breathe 3.6s ease-in-out infinite;
        filter: drop-shadow(0 16px 24px var(--shadow-color));
        transform-origin: center bottom;

        /* ---- 默认（橘猫）配色变量 ---- */
        --fur:          #F4A261;
        --fur-stroke:   #D07B3F;
        --stripe:       #D07B3F;
        --ear-inner:    #FFB6A3;
        --nose:         #FF8FA8;
        --pupil:        #2A1F1A;
        --mouth:        #7A4B2A;
        --whisker:      #7A4B2A;
        --blush:        #FF8FA8;
        --patch-1:      transparent;
        --patch-2:      transparent;
        --patch-ear-l:  transparent;
        --patch-ear-r:  transparent;
        --shadow-color: rgba(208, 123, 63, 0.25);
    }

    /* ========== 三花猫配色 ========== */
    .char-wrap.palette-tri {
        --fur:          #FFF8EC;
        --fur-stroke:   #A07860;
        --stripe:       #A07860;
        --ear-inner:    #FFC0C8;
        --nose:         #FF9FB0;
        --pupil:        #2A1F1A;
        --mouth:        #7A4B2A;
        --whisker:      #7A4B2A;
        --blush:        #FFC0C8;
        --patch-1:      #F4A261;
        --patch-2:      #3D2B1F;
        --patch-ear-l:  #3D2B1F;
        --patch-ear-r:  #F4A261;
        --shadow-color: rgba(160, 120, 96, 0.25);
    }

    /* ========== 白猫配色 ========== */
    .char-wrap.palette-white {
        --fur:          #FFFFFF;
        --fur-stroke:   #C0C0C0;
        --stripe:       #C0C0C0;
        --ear-inner:    #FFD5DB;
        --nose:         #FFB0B8;
        --pupil:        #2A1F1A;
        --mouth:        #A0A0A0;
        --whisker:      #A0A0A0;
        --blush:        #FFE0E8;
        --patch-1:      transparent;
        --patch-2:      transparent;
        --patch-ear-l:  transparent;
        --patch-ear-r:  transparent;
        --shadow-color: rgba(160, 160, 160, 0.28);
    }

    /* ========== 狸花猫配色 ========== */
    .char-wrap.palette-tabby {
        --fur:          #C0A882;   /* 暖棕底 */
        --fur-stroke:   #6B5540;
        --stripe:       #4A3A2A;   /* 深棕条纹 */
        --ear-inner:    #E5B8A8;
        --nose:         #D89090;
        --pupil:        #2A1F1A;
        --mouth:        #5A3A2A;
        --whisker:      #5A3A2A;
        --blush:        #E0A898;
        --patch-1:      transparent;
        --patch-2:      transparent;
        --patch-ear-l:  transparent;
        --patch-ear-r:  transparent;
        --shadow-color: rgba(120, 90, 60, 0.28);
    }

    /* 白猫隐藏额头虎斑纹 */
    .char-wrap.palette-white .stripes { opacity: 0; }

    @keyframes breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50%      { transform: translateY(-5px) scale(1.015); }
    }

    .char-wrap:hover { animation-play-state: paused; }

    /* ========== 蹭蹭动作 ========== */
    @keyframes nuzzle {
        0%   { transform: rotate(0deg)    translateY(0)    scale(1); }
        12%  { transform: rotate(11deg)   translateY(-3px) scale(1.02); }
        22%  { transform: rotate(13deg)   translateY(0)    scale(1); }
        30%  { transform: rotate(10deg)   translateY(-2px) scale(1); }
        38%  { transform: rotate(13deg)   translateY(0)    scale(1); }
        50%  { transform: rotate(0deg)    translateY(0)    scale(1); }
        62%  { transform: rotate(-11deg)  translateY(-3px) scale(1.02); }
        72%  { transform: rotate(-13deg)  translateY(0)    scale(1); }
        80%  { transform: rotate(-10deg)  translateY(-2px) scale(1); }
        88%  { transform: rotate(-13deg)  translateY(0)    scale(1); }
        100% { transform: rotate(0deg)    translateY(0)    scale(1); }
    }

    .char-wrap.nuzzling {
        animation: nuzzle 1.3s cubic-bezier(0.42, 0, 0.58, 1);
        transform-origin: 50% 60%;
    }

    .char-svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ========== 配色切换过渡 ========== */
    .char-svg path,
    .char-svg ellipse,
    .char-svg circle {
        transition: fill 0.35s ease, stroke 0.35s ease;
    }
    .char-svg .eye-hitarea { transition: fill 0.2s ease; }
    .char-svg .pupil,
    .char-svg .ear-respond-left,
    .char-svg .ear-respond-right,
    .char-svg .tail-respond,
    .char-svg .whisker-respond-left,
    .char-svg .whisker-respond-right {
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                    fill 0.35s ease, stroke 0.35s ease;
    }

    /* 眨眼 */
    .eye {
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 4.8s ease-in-out infinite;
    }
    .eye-right { animation-delay: 0.06s; }
    @keyframes blink {
        0%, 91%, 100% { transform: scaleY(1); }
        93.5%, 96%    { transform: scaleY(0.08); }
    }

    .eye-wrap {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.16s cubic-bezier(0.45, 0, 0.55, 1);
    }
    .eye-wrap.wink-closed { transform: scaleY(0.08); }

    /* 打哈欠 */
    .char-wrap.yawning .eye,
    .char-wrap.yawning .eye.wink-closed {
        animation: none !important;
        transform: scaleY(0.12) !important;
        transition: transform 0.3s ease;
    }
    .char-wrap.yawning .char-svg { transform: translateY(-3px); }

    .smile-mouth { opacity: 1; transition: opacity 0.15s ease; }
    .yawn-mouth {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        transform: scaleY(0.08);
        opacity: 0;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                    opacity 0.2s ease;
    }
    .char-wrap.yawning .smile-mouth { opacity: 0; }
    .char-wrap.yawning .yawn-mouth  { transform: scaleY(1); opacity: 1; }

    .eye-hitarea {
        fill: transparent;
        pointer-events: all;
        cursor: pointer;
        transition: fill 0.2s ease;
    }
    .eye-hitarea:hover { fill: rgba(255, 200, 0, 0.08); }

    /* 耳朵 */
    .ear-left {
        transform-box: fill-box;
        transform-origin: 70% 100%;
        animation: earTwitchL 5.5s ease-in-out infinite;
    }
    .ear-right {
        transform-box: fill-box;
        transform-origin: 30% 100%;
        animation: earTwitchR 5.5s ease-in-out infinite;
        animation-delay: 0.3s;
    }
    @keyframes earTwitchL {
        0%, 82%, 100% { transform: rotate(0deg); }
        86%           { transform: rotate(-6deg); }
        90%           { transform: rotate(0deg); }
    }
    @keyframes earTwitchR {
        0%, 82%, 100% { transform: rotate(0deg); }
        86%           { transform: rotate(6deg); }
        90%           { transform: rotate(0deg); }
    }

    /* 尾巴 */
    .tail {
        transform-box: fill-box;
        transform-origin: 0% 100%;
        animation: tailSwing 4.2s ease-in-out infinite;
    }
    @keyframes tailSwing {
        0%, 100% { transform: rotate(-8deg); }
        50%      { transform: rotate(8deg); }
    }

    .pupil,
    .ear-respond-left,
    .ear-respond-right,
    .tail-respond,
    .whisker-respond-left,
    .whisker-respond-right {
        transform-box: fill-box;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pupil                { transform-origin: center; }
    .ear-respond-left     { transform-origin: 70% 100%; }
    .ear-respond-right    { transform-origin: 30% 100%; }
    .tail-respond         { transform-origin: 0% 100%; }
    .whisker-respond-left { transform-origin: 100% 50%; }
    .whisker-respond-right{ transform-origin: 0% 50%; }

    /* 条纹 / 斑块 / 狸花纹 —— 默认隐藏，狸花配色时显示 */
    .stripes     { transition: opacity 0.35s ease; }
    .patches     { transition: opacity 0.35s ease; }
    .tabby-marks { opacity: 0; transition: opacity 0.35s ease; }

    .char-wrap.palette-tabby .tabby-marks { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
        .char-wrap, .eye, .ear-left, .ear-right, .tail { animation: none !important; }
        .pupil, .ear-respond-left, .ear-respond-right,
        .tail-respond, .whisker-respond-left, .whisker-respond-right {
            transition: none !important;
        }
    }
</style>
</head>
<body>

<div class="char-wrap" id="charWrap">
    <svg class="char-svg" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">

        <defs>
            <clipPath id="headClip">
                <ellipse cx="60" cy="90" rx="32" ry="31"/>
            </clipPath>
        </defs>

        <!-- 尾巴 -->
        <g class="tail-respond">
            <g class="tail">
                <path d="M 78 132 Q 102 138 108 118 Q 111 108 104 104"
                      fill="none" style="stroke: var(--fur-stroke);" stroke-width="7" stroke-linecap="round"/>
                <path d="M 78 132 Q 102 138 108 118 Q 111 108 104 104"
                      fill="none" style="stroke: var(--fur);" stroke-width="4.5" stroke-linecap="round"/>
                <!-- 狸花尾巴环纹（仅狸花猫显示） -->
                <g class="tabby-marks" style="stroke: var(--stripe);" stroke-width="1.8" stroke-linecap="round" fill="none">
                    <path d="M 89 129.5 Q 90 133 89 136.5"/>
                    <path d="M 96.5 128 Q 98 131.5 98.5 135"/>
                    <path d="M 102 122 Q 104 124.5 105.5 127"/>
                </g>
            </g>
        </g>

        <!-- 身体 -->
        <ellipse cx="60" cy="130" rx="30" ry="18"
                 style="fill: var(--fur); stroke: var(--fur-stroke);" stroke-width="1.5"/>

        <!-- 左耳 -->
        <g class="ear-respond-left">
            <g class="ear-left">
                <path d="M 38 72 Q 30 58 36 50 Q 42 44 48 52 Q 52 58 56 64 Z"
                      style="fill: var(--fur); stroke: var(--fur-stroke);" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M 38 72 Q 30 58 36 50 Q 42 44 48 52 Q 52 58 56 64 Z"
                      style="fill: var(--patch-ear-l);" opacity="0.85"/>
                <path d="M 40 70 Q 34 58 38 53 Q 42 49 46 55 Q 48 58 50 62 Z"
                      style="fill: var(--ear-inner);" opacity="0.7"/>
            </g>
        </g>

        <!-- 右耳 -->
        <g class="ear-respond-right">
            <g class="ear-right">
                <path d="M 82 72 Q 90 58 84 50 Q 78 44 72 52 Q 68 58 64 64 Z"
                      style="fill: var(--fur); stroke: var(--fur-stroke);" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M 82 72 Q 90 58 84 50 Q 78 44 72 52 Q 68 58 64 64 Z"
                      style="fill: var(--patch-ear-r);" opacity="0.85"/>
                <path d="M 80 70 Q 86 58 82 53 Q 78 49 74 55 Q 72 58 70 62 Z"
                      style="fill: var(--ear-inner);" opacity="0.7"/>
            </g>
        </g>

        <!-- 头部 -->
        <ellipse cx="60" cy="90" rx="33" ry="32"
                 style="fill: var(--fur); stroke: var(--fur-stroke);" stroke-width="1.5"/>

        <!-- 三花斑块 -->
        <g class="patches" clip-path="url(#headClip)">
            <path d="M 68 60
                     Q 76 58 82 64
                     Q 88 70 86 78
                     Q 84 84 78 84
                     Q 72 83 68 78
                     Q 64 72 66 66
                     Z"
                  style="fill: var(--patch-1);"/>
            <path d="M 36 58
                     Q 30 62 28 72
                     Q 26 82 30 88
                     Q 34 94 40 92
                     Q 46 90 46 84
                     Q 46 78 42 72
                     Q 38 66 36 58
                     Z"
                  style="fill: var(--patch-2);"/>
        </g>

        <!-- 狸花猫专属纹路（眼尾纹 + 脸颊纹） -->
        <g class="tabby-marks" style="stroke: var(--stripe);" stroke-width="1.6"
           stroke-linecap="round" fill="none" opacity="0">
            <!-- 左眼尾向外延伸 -->
            <path d="M 38 86 L 32 88"/>
            <path d="M 38 90 L 32 92"/>
            <!-- 右眼尾向外延伸 -->
            <path d="M 82 86 L 88 88"/>
            <path d="M 82 90 L 88 92"/>
        </g>

        <!-- 额头虎斑纹（橘猫 / 三花 / 狸花共用） -->
        <g class="stripes">
            <path d="M 52 62 Q 56 54 60 60 Q 64 52 68 62"
                  fill="none" style="stroke: var(--stripe);" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g class="stripes" style="stroke: var(--stripe);" stroke-width="2" stroke-linecap="round" opacity="0.75">
            <path d="M 54 68 L 54 76"/>
            <path d="M 60 66 L 60 74"/>
            <path d="M 66 68 L 66 76"/>
        </g>

        <!-- 狸花猫加强版 M 纹（两侧斜线，增强狸花感） -->
        <g class="tabby-marks" style="stroke: var(--stripe);" stroke-width="1.8"
           stroke-linecap="round" fill="none" opacity="0">
            <path d="M 48 57 L 52 68"/>
            <path d="M 72 57 L 68 68"/>
        </g>

        <!-- 腮红 -->
        <ellipse cx="34" cy="100" rx="7" ry="3.5" style="fill: var(--blush);" opacity="0.55"/>
        <ellipse cx="86" cy="100" rx="7" ry="3.5" style="fill: var(--blush);" opacity="0.55"/>

        <!-- 左眼 -->
        <g class="eye-wrap" data-eye="left">
            <g class="eye eye-left">
                <ellipse cx="46" cy="90" rx="8" ry="10"
                         fill="#FFFFFF" style="stroke: var(--fur-stroke);" stroke-width="1.2"/>
                <circle class="pupil" cx="46" cy="92" r="5" style="fill: var(--pupil);"/>
                <circle cx="48" cy="89" r="1.8" fill="#FFFFFF"/>
            </g>
        </g>

        <!-- 右眼 -->
        <g class="eye-wrap" data-eye="right">
            <g class="eye eye-right">
                <ellipse cx="74" cy="90" rx="8" ry="10"
                         fill="#FFFFFF" style="stroke: var(--fur-stroke);" stroke-width="1.2"/>
                <circle class="pupil" cx="74" cy="92" r="5" style="fill: var(--pupil);"/>
                <circle cx="76" cy="89" r="1.8" fill="#FFFFFF"/>
            </g>
        </g>

        <!-- 鼻子 -->
        <path d="M 60 102 L 56 106 L 64 106 Z"
              style="fill: var(--nose); stroke: var(--fur-stroke);" stroke-width="0.8" stroke-linejoin="round"/>

        <!-- 微笑嘴 -->
        <g class="smile-mouth">
            <path d="M 60 106 Q 60 111 55 112"
                  fill="none" style="stroke: var(--mouth);" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M 60 106 Q 60 111 65 112"
                  fill="none" style="stroke: var(--mouth);" stroke-width="1.6" stroke-linecap="round"/>
        </g>

        <!-- 哈欠嘴 -->
        <g class="yawn-mouth">
            <ellipse cx="60" cy="113" rx="7" ry="9" fill="#5A1F1F"/>
            <ellipse cx="60" cy="107" rx="6" ry="2.5" fill="#3A1010" opacity="0.7"/>
            <ellipse cx="60" cy="117" rx="4.5" ry="4" style="fill: var(--nose);"/>
            <path d="M 53 106 Q 60 108 67 106"
                  fill="none" style="stroke: var(--mouth);" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- 胡须 -->
        <g class="whisker-respond-left">
            <g style="stroke: var(--whisker);" stroke-width="1.1" stroke-linecap="round" opacity="0.65">
                <path d="M 28 98 L 12 94"/>
                <path d="M 28 102 L 12 102"/>
                <path d="M 28 106 L 12 110"/>
            </g>
        </g>
        <g class="whisker-respond-right">
            <g style="stroke: var(--whisker);" stroke-width="1.1" stroke-linecap="round" opacity="0.65">
                <path d="M 92 98 L 108 94"/>
                <path d="M 92 102 L 108 102"/>
                <path d="M 92 106 L 108 110"/>
            </g>
        </g>

        <!-- 眼睛点击热区 -->
        <circle class="eye-hitarea" data-eye="left"  cx="46" cy="90" r="16"/>
        <circle class="eye-hitarea" data-eye="right" cx="74" cy="90" r="16"/>
    </svg>
</div>

<script>
    (function () {
        const wrap = document.getElementById('charWrap');
        const svg = wrap.querySelector('.char-svg');

        const pupils = wrap.querySelectorAll('.pupil');
        const earL = wrap.querySelector('.ear-respond-left');
        const earR = wrap.querySelector('.ear-respond-right');
        const tail = wrap.querySelector('.tail-respond');
        const whiskL = wrap.querySelector('.whisker-respond-left');
        const whiskR = wrap.querySelector('.whisker-respond-right');

        /* ========== 鼠标跟随 ========== */
        function onMove(e) {
            const rect = svg.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            let mx = (e.clientX - cx) / (rect.width * 0.5);
            let my = (e.clientY - cy) / (rect.height * 0.5);
            mx = Math.max(-1, Math.min(1, mx));
            my = Math.max(-1, Math.min(1, my));

            pupils.forEach(p => {
                p.style.transform = `translate(${mx * 2.2}px, ${my * 2.2}px)`;
            });

            if (earL) earL.style.transform = `rotate(${mx * 8}deg)`;
            if (earR) earR.style.transform = `rotate(${mx * 8}deg)`;
            if (tail) tail.style.transform = `rotate(${mx * 12}deg)`;
            if (whiskL) whiskL.style.transform = `rotate(${mx * 5}deg)`;
            if (whiskR) whiskR.style.transform = `rotate(${-mx * 5}deg)`;
        }

        function onLeave() {
            pupils.forEach(p => p.style.transform = '');
            if (earL) earL.style.transform = '';
            if (earR) earR.style.transform = '';
            if (tail) tail.style.transform = '';
            if (whiskL) whiskL.style.transform = '';
            if (whiskR) whiskR.style.transform = '';
        }

        /* ========== 眼睛悬停闭眼 ========== */
        wrap.querySelectorAll('.eye-hitarea').forEach(hit => {
            const side = hit.getAttribute('data-eye');
            const eyeWrap = wrap.querySelector(`.eye-wrap[data-eye="${side}"]`);
            if (!eyeWrap) return;
            hit.addEventListener('mouseenter', () => eyeWrap.classList.add('wink-closed'));
            hit.addEventListener('mouseleave', () => eyeWrap.classList.remove('wink-closed'));
        });

        /* ========== 打哈欠 ========== */
        let yawnTimer = null;

        function triggerYawn() {
            if (wrap.classList.contains('yawning')) {
                scheduleYawn(3000);
                return;
            }
            wrap.classList.add('yawning');
            setTimeout(() => {
                wrap.classList.remove('yawning');
                scheduleYawn();
            }, 1700);
        }

        function scheduleYawn(customDelay) {
            const delay = customDelay || (8000 + Math.random() * 6000);
            yawnTimer = setTimeout(triggerYawn, delay);
        }

        setTimeout(triggerYawn, 4000);

        wrap.addEventListener('mouseenter', () => {
            if (yawnTimer && !wrap.classList.contains('yawning')) {
                clearTimeout(yawnTimer);
                yawnTimer = null;
            }
        });
        wrap.addEventListener('mouseleave', () => {
            if (!yawnTimer && !wrap.classList.contains('yawning')) {
                scheduleYawn();
            }
        });

        if (window.matchMedia('(hover: hover)').matches) {
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseleave', onLeave);
        }

        /* ========== 点击：蹭蹭 + 切换配色 ========== */
        const PALETTES = ['palette-orange', 'palette-tri', 'palette-white', 'palette-tabby'];
        let paletteIdx = 0;
        wrap.classList.add(PALETTES[paletteIdx]);

        let nuzzleTimeout = null;
        wrap.addEventListener('click', () => {
            if (!wrap.classList.contains('nuzzling')) {
                wrap.classList.add('nuzzling');
                nuzzleTimeout = setTimeout(() => {
                    wrap.classList.remove('nuzzling');
                    nuzzleTimeout = null;
                }, 1300);
            }

            wrap.classList.remove(PALETTES[paletteIdx]);
            paletteIdx = (paletteIdx + 1) % PALETTES.length;
            wrap.classList.add(PALETTES[paletteIdx]);
        });
    })();
</script>
</body>
</html>
