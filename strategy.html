<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F7F7F7">
    <title>交流社区 - A-Level Guide</title>
    <meta name="description" content="A-Level交流社区经验分享与交流社区。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        duo: {
                            green: '#58CC02', blue: '#1CB0F6', yellow: '#FFC800',
                            orange: '#FF9600', red: '#FF4B4B', purple: '#CE82FF',
                            pink: '#FF86D0', cyan: '#14D4F4',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <link rel="stylesheet" href="ai-assistant.css">

    <style>
        :root {
            --duo-green: #58CC02;
            --duo-green-dark: #58A700;
            --duo-green-soft: #F0F9E8;
            --duo-blue: #1CB0F6;
            --duo-yellow: #FFC800;
            --duo-red: #FF4B4B;
            --duo-red-dark: #C73636;

            --text-main: #3C3C3C;
            --text-sub: #777777;
            --text-faint: #AFAFAF;
            --border-soft: #E5E5E5;
            --border-soft-2: #EFEFEF;
            --bg-page: #F7F7F7;
            --bg-card: #FFFFFF;

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            font-weight: 500;
        }

        ::selection {
            background: rgba(88, 204, 2, 0.25);
        }

        /* ========== 强制覆盖 Tailwind 深色类名 ========== */
        .text-white {
            color: var(--text-main) !important;
        }

        .text-gray-300 {
            color: #555555 !important;
        }

        .text-gray-400 {
            color: var(--text-sub) !important;
        }

        .text-gray-500 {
            color: #909090 !important;
        }

        .text-gray-600 {
            color: var(--text-faint) !important;
        }

        .text-gold {
            color: var(--duo-green) !important;
        }

        .text-gold-light {
            color: #7CDD3E !important;
        }

        .bg-gray-800 {
            background: #F0F0F0 !important;
        }

        .bg-gray-700 {
            background: #E5E5E5 !important;
        }

        .bg-gray-900 {
            background: #FFFFFF !important;
        }

        .bg-gold {
            background: var(--duo-green) !important;
        }

        .hover\:bg-gray-700:hover {
            background: #E5E5E5 !important;
        }

        .hover\:bg-gray-600:hover {
            background: #D5D5D5 !important;
        }

        .hover\:bg-gold-light:hover {
            background: #7CDD3E !important;
        }

        .hover\:text-gold:hover {
            color: var(--duo-green) !important;
        }

        .hover\:text-white:hover {
            color: var(--text-main) !important;
        }

        .hover\:text-red-300:hover {
            color: #E03B3B !important;
        }

        .border-white\/5 {
            border-color: var(--border-soft-2) !important;
        }

        .border-white\/10 {
            border-color: var(--border-soft) !important;
        }

        .border-gold\/40 {
            border-color: rgba(88, 204, 2, 0.4) !important;
        }

        .border-gold\/20 {
            border-color: rgba(88, 204, 2, 0.2) !important;
        }

        .bg-black\/95 {
            background: rgba(255, 255, 255, 0.96) !important;
        }

        .bg-white\/5 {
            background: #FAFAFA !important;
        }

        .bg-white\/10 {
            background: #F0F0F0 !important;
        }

        /* Duolingo 绿色按钮里的白字 —— 保留白色 */
        .bg-gold .text-white,
        .btn-gold .text-white,
        button.bg-gold {
            color: #fff !important;
        }

        /* ========== 背景 ========== */
        #glow-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFFFA 40%, #FFFFFF 70%, #F5FBFF 100%);
            background-size: 300% 300%;
            animation: pageGradient 24s ease-in-out infinite;
        }

        @keyframes pageGradient {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            will-change: transform;
        }

        .glow-orb--1 {
            width: 600px;
            height: 600px;
            top: -180px;
            left: -180px;
            background: radial-gradient(circle, rgba(88, 204, 2, 0.5) 0%, rgba(88, 204, 2, 0.15) 45%, transparent 72%);
            animation: flow1 28s ease-in-out infinite;
        }

        .glow-orb--2 {
            width: 560px;
            height: 560px;
            bottom: -200px;
            right: -160px;
            background: radial-gradient(circle, rgba(28, 176, 246, 0.5) 0%, rgba(28, 176, 246, 0.15) 45%, transparent 72%);
            animation: flow2 32s ease-in-out infinite;
            animation-delay: -8s;
        }

        .glow-orb--3 {
            width: 480px;
            height: 480px;
            top: 40%;
            right: -100px;
            background: radial-gradient(circle, rgba(206, 130, 255, 0.45) 0%, rgba(206, 130, 255, 0.12) 45%, transparent 72%);
            animation: flow3 34s ease-in-out infinite;
            animation-delay: -14s;
        }

        .glow-orb--4 {
            width: 460px;
            height: 460px;
            bottom: 10%;
            left: -100px;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.45) 0%, rgba(255, 200, 0, 0.12) 45%, transparent 72%);
            animation: flow4 30s ease-in-out infinite;
            animation-delay: -6s;
        }

        .glow-orb--5 {
            width: 400px;
            height: 400px;
            top: 20%;
            left: 40%;
            background: radial-gradient(circle, rgba(255, 134, 208, 0.4) 0%, rgba(255, 134, 208, 0.1) 45%, transparent 72%);
            animation: flow1 26s ease-in-out infinite;
            animation-delay: -3s;
        }

        .glow-orb--6 {
            width: 420px;
            height: 420px;
            bottom: 20%;
            right: 30%;
            background: radial-gradient(circle, rgba(20, 212, 244, 0.4) 0%, rgba(20, 212, 244, 0.1) 45%, transparent 72%);
            animation: flow2 30s ease-in-out infinite;
            animation-delay: -18s;
        }

        @keyframes flow1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(20vw, 15vh) scale(1.1);
            }

            50% {
                transform: translate(35vw, 38vh) scale(0.95);
            }

            75% {
                transform: translate(10vw, 50vh) scale(1.05);
            }
        }

        @keyframes flow2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            20% {
                transform: translate(-22vw, -12vh) scale(1.1);
            }

            50% {
                transform: translate(-42vw, -35vh) scale(0.92);
            }

            75% {
                transform: translate(-15vw, -48vh) scale(1.06);
            }
        }

        @keyframes flow3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(-18vw, 22vh) scale(1.12);
            }

            66% {
                transform: translate(-26vw, 48vh) scale(0.94);
            }
        }

        @keyframes flow4 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(18vw, -14vh) scale(1.08);
            }

            55% {
                transform: translate(32vw, 6vh) scale(0.94);
            }
        }

        #particles-layer {
            display: none !important;
        }

        /* ========== 导航栏 ========== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            border-bottom: 2px solid var(--border-soft) !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
        }

        .nav-glass .text-white {
            color: var(--text-main) !important;
            text-shadow: none !important;
        }

        .nav-glass .nav-link {
            color: var(--text-sub) !important;
            font-weight: 700 !important;
        }

        .nav-glass .nav-link:hover {
            color: var(--duo-green) !important;
        }

        .nav-glass .nav-link.active {
            color: var(--duo-green) !important;
        }

        .nav-glass #mobile-menu-btn {
            border-color: var(--border-soft) !important;
        }

        .nav-glass #mobile-menu-btn svg {
            color: var(--text-main) !important;
        }

        #mobile-menu {
            background: #fff !important;
            border-top: 2px solid var(--border-soft);
        }

        #mobile-menu a {
            color: var(--text-main) !important;
            font-weight: 700 !important;
        }

        #mobile-menu a:hover,
        #mobile-menu a.nav-active {
            background: var(--duo-green-soft) !important;
            color: var(--duo-green) !important;
        }

        /* ========== 内容宽度 ========== */
        .content-max-width {
            max-width: 860px;
            margin: 0 auto;
        }

        main {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 64px - 82px);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 767px) {
            main {
                min-height: calc(100vh - 56px - 82px);
            }
        }

        #community-app {
            flex: 1 1 auto;
        }

        @media (max-width: 767px) {
            #community-app {
                padding-bottom: 72px;
            }
        }

        /* ========== 文本截断 ========== */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ========== 通知徽章 ========== */
        .notification-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            background: var(--duo-red);
            color: #fff !important;
            font-size: 11px;
            font-weight: 800;
            padding: 0 6px;
            margin-left: 6px;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(255, 75, 75, 0.35);
        }

        /* ========== 贴纸卡片 ========== */
        .community-card {
            background: var(--bg-card);
            border: 2px solid var(--border-soft);
            border-bottom-width: 4px;
            border-radius: var(--radius-md);
            transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .community-card:hover {
            border-color: rgba(88, 204, 2, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }

        /* ========== 输入框 ========== */
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: var(--text-faint);
            font-size: 0.87rem;
            font-weight: 500;
        }

        .input-field:focus {
            border-color: var(--duo-green);
            box-shadow: 0 0 0 4px rgba(88, 204, 2, 0.12);
        }

        /* ========== 按钮 ========== */
        .btn-gold {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--duo-green);
            color: #fff;
            font-weight: 800;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.65rem 1.25rem;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.85rem;
            box-shadow: 0 4px 0 var(--duo-green-dark);
        }

        .btn-gold:hover {
            filter: brightness(1.06);
        }

        .btn-gold:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #fff;
            color: var(--text-sub);
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 0.65rem 1.25rem;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, color 0.2s ease;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 4px 0 var(--border-soft);
        }

        .btn-ghost:hover {
            color: var(--text-main);
        }

        .btn-ghost:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--border-soft);
        }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--duo-red);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.65rem 1.25rem;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 4px 0 var(--duo-red-dark);
        }

        .btn-danger:hover {
            filter: brightness(1.06);
        }

        .btn-danger:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-red-dark);
        }

        /* ========== 侧边栏导航项 ========== */
        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.65rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            white-space: nowrap;
        }

        .sidebar-nav-item:hover {
            background: #F0F9E8;
            color: var(--duo-green);
        }

        .sidebar-nav-item.active {
            background: var(--duo-green-soft);
            color: var(--duo-green);
            border-left: 3px solid var(--duo-green);
            border-radius: var(--radius-sm) var(--radius-sm) var(--radius-sm) 0;
        }

        /* ========== 底部导航 ========== */
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 12px;
            color: var(--text-faint);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            flex: 1;
            position: relative;
            letter-spacing: 0.03em;
        }

        .bottom-nav-item:hover {
            color: var(--text-main);
        }

        .bottom-nav-item.active {
            color: var(--duo-green);
        }

        .bottom-nav-item .nav-icon {
            width: 22px;
            height: 22px;
            transition: transform 0.2s ease;
        }

        .bottom-nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        /* ========== 底部弹出面板 ========== */
        .bottom-sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .bottom-sheet-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #FFFFFF;
            border-top: 2px solid var(--border-soft);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            z-index: 90;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
            max-height: 70vh;
            overflow-y: auto;
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

        .bottom-sheet-handle {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            background: var(--border-soft);
            margin: 0 auto 1rem auto;
            cursor: grab;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-panel {
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            width: 100%;
            max-width: 480px;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
        }

        .modal-overlay.open .modal-panel {
            transform: translateY(0) scale(1);
        }

        /* ========== 骨架屏 ========== */
        .skeleton {
            background: linear-gradient(90deg, #F0F0F0 25%, #E5E5E5 50%, #F0F0F0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* ========== 头像 ========== */
        .avatar-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--duo-green), var(--duo-green-dark));
            color: #fff;
            font-weight: 700;
            overflow: hidden;
            flex-shrink: 0;
            border-radius: 50%;
            user-select: none;
            border: 2px solid #FFFFFF;
            box-shadow: 0 0 0 2px rgba(88, 204, 2, 0.15);
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #EDEDED;
        }

        ::-webkit-scrollbar-thumb {
            background: #CFCFCF;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #B0B0B0;
        }

        /* ========== 动画 ========== */
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        .animate-slide-up {
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 标签 ========== */
        .badge-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            background: var(--duo-green-soft);
            color: var(--duo-green);
            border: 2px solid rgba(88, 204, 2, 0.2);
        }

        /* ========== 加载动画 ========== */
        @keyframes spin-slow {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse-text {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 1rem;
        }

        .loading-spinner .spinner-ring {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(88, 204, 2, 0.2);
            border-top-color: var(--duo-green);
            border-radius: 50%;
            animation: spin-slow 1s linear infinite;
        }

        .loading-spinner .loading-text {
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        main {
            position: relative;
            z-index: 1;
        }

        /* ========== 页脚 ========== */
        footer {
            position: relative;
            z-index: 1;
            padding: 30px 16px;
            text-align: center;
            border-top: 2px solid var(--border-soft);
            background: #fff;
            color: var(--text-faint);
            font-size: 13px;
            font-weight: 600;
            margin-top: auto;
        }

        @media (prefers-reduced-motion: reduce) {

            .glow-orb,
            #glow-background {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <div id="glow-background" aria-hidden="true">

    <script>
        // ==================== Supabase（复用全局客户端） ====================
        const supabaseClient = window.supabaseClient;

        const communityApp = document.getElementById('community-app');
        let currentUser = null;
        let currentView = 'list';
        let currentPostId = null;
        let currentProfile = null;
        let bottomSheetOpen = false;
        let savedListScrollY = 0;   // 从列表进详情前记录滚动位置

        /* ============================================================
           ⭐ 安全：HTML 转义
           所有用户产生的内容（帖子标题/正文、用户名、评论、通知文字）
           都必须经过这里，防止 XSS 注入
           ============================================================ */
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /* ============================================================
           ⭐ 对 nav.js 提供的 duo* 函数做存在性保护
           避免它们未加载时直接抛 TypeError
           ============================================================ */
        async function requireLogin(type) {
            if (typeof window.duoRequireLogin === 'function') {
                try { return await window.duoRequireLogin(type); }
                catch (_) { return true; }
            }
            return true;
        }

        async function showConfirm(message, onConfirm) {
            if (typeof window.duoConfirm === 'function') {
                try {
                    const ok = await window.duoConfirm({
                        title: '确认操作', desc: message,
                        confirmText: '确认', cancelText: '取消',
                        danger: true, type: 'warn'
                    });
                    if (ok) onConfirm();
                    return;
                } catch (_) { /* 降级 */ }
            }
            if (window.confirm(message)) onConfirm();
        }

        function showError(message, title = '出错了') {
            if (typeof window.duoAlert === 'function') {
                try { window.duoAlert(message, { type: 'error', title }); return; } catch (_) { }
            }
            alert(message);
        }

        function showWarn(message, title = '提示') {
            if (typeof window.duoAlert === 'function') {
                try { window.duoAlert(message, { type: 'warn', title }); return; } catch (_) { }
            }
            alert(message);
        }

        function formatRelativeTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return '';
            const now = new Date();
            const diffMs = now - date;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);
            if (diffSec < 60) return '刚刚';
            if (diffMin < 60) return `${diffMin}分钟前`;
            if (diffHour < 24) return `${diffHour}小时前`;
            if (diffDay < 7) return `${diffDay}天前`;
            return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        /* ============ 弹窗 ============ */
        const confirmModalHTML = `
    <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-panel">
            <h3 class="text-lg font-bold text-white mb-3" id="confirm-message">确认操作</h3>
            <p class="text-sm text-gray-400 mb-5">此操作可能无法撤销。</p>
            <div class="flex justify-end gap-2">
                <button id="confirm-cancel-btn" class="btn-ghost text-sm">取消</button>
                <button id="confirm-ok-btn" class="btn-danger text-sm">确认</button>
            </div>
        </div>
    </div>`;
        document.body.insertAdjacentHTML('beforeend', confirmModalHTML);

        const editPostModalHTML = `
    <div id="edit-post-modal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-panel" style="max-width:560px;">

            <div class="flex justify-end gap-2 mt-4">

                <button id="edit-post-save" class="btn-gold text-sm">保存</button>

        const bottomSheetHTML = `
    <div id="bottom-sheet-overlay" class="bottom-sheet-overlay"></div>

        <button id="bottom-sheet-logout" class="w-full mt-4 py-3 rounded-lg text-sm font-bold text-red-400 bg-red-500/10 border border-red-500/30 hover:bg-red-500/20 transition">退出登录</button>
    </div>`;
        document.body.insertAdjacentHTML('beforeend', bottomSheetHTML);

        /* ============ 编辑弹窗（带 AbortController 防监听器泄漏） ============ */
        function showEditModal(title, content, onSave) {
            const modal = document.getElementById('edit-post-modal');
            document.getElementById('edit-post-title').value = title;
            document.getElementById('edit-post-content').value = content;
            modal.classList.add('open');

            const cancelBtn = document.getElementById('edit-post-cancel');
            const saveBtn = document.getElementById('edit-post-save');
            const controller = new AbortController();
            const { signal } = controller;

            const close = () => {
                modal.classList.remove('open');
                controller.abort();
            };

            cancelBtn.addEventListener('click', close, { signal });
            saveBtn.addEventListener('click', async () => {
                const success = await onSave();
                if (success) close();
            }, { signal });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) close();
            }, { signal });
        }

        function openBottomSheet(options, activeView) {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('bottom-sheet-overlay');
            const container = document.getElementById('bottom-sheet-options');
            container.innerHTML = options.map(opt => `
            <button class="sidebar-nav-item ${opt.view === activeView ? 'active' : ''}" data-view="${opt.view}">
                <span>${opt.icon}</span>
                <span>${escapeHtml(opt.label)}${opt.badge ? ` <span class="notification-badge">${escapeHtml(String(opt.badge))}</span>` : ''}</span>
            </button>
        `).join('');
            sheet.classList.add('open');
            overlay.classList.add('open');
            bottomSheetOpen = true;
            container.querySelectorAll('[data-view]').forEach(btn => {
                btn.addEventListener('click', () => {
                    closeBottomSheet();
                    const view = btn.getAttribute('data-view');
                    handleViewSwitch(view);
                });
            });
            document.getElementById('bottom-sheet-logout').addEventListener('click', async () => {
                closeBottomSheet();
                teardownDmRealtime();   // ⭐ 先断开订阅
                await supabaseClient.auth.signOut();
                currentUser = null;
                currentProfile = null;
                currentView = 'list';
                currentPostId = null;
                renderApp();
            });
        }

        function closeBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('bottom-sheet-overlay');
            sheet?.classList.remove('open');
            overlay?.classList.remove('open');
            bottomSheetOpen = false;
        }

        document.getElementById('bottom-sheet-overlay')?.addEventListener('click', closeBottomSheet);

        /* ============================================================
           ⭐ 修复：原来 case 'history' 被合并到 case 'dm'，
              导致点击「浏览记录」也跳转到 messages.html。
              现在拆分成独立分支。
           ============================================================ */
        function handleViewSwitch(view) {
            switch (view) {
                case 'posts':
                    currentView = 'list';
                    currentPostId = null;
                    renderContent();
                    break;
                case 'new-post':
                    currentView = 'list';
                    currentPostId = null;
                    showNewPostForm();
                    break;
                case 'my-comments':
                    currentView = 'my-comments';
                    renderMyComments();
                    break;
                case 'messages':
                    currentView = 'messages';
                    renderMessages();
                    break;
                case 'my-favorites':
                    currentView = 'my-favorites';
                    renderMyFavorites();
                    break;
                case 'my-likes':
                    currentView = 'my-likes';
                    renderMyLikes();
                    break;
                case 'dm':
                    // 「我的私信」→ 跳转到独立页面
                    window.location.href = 'messages.html';
                    return;
                case 'history':
                    // 「浏览记录」→ 在当前页面渲染历史
                    currentView = 'history';
                    renderHistory();
                    break;
            }
            updateActiveNavUI();
        }

        /* ⭐ 同步侧边栏 / 底栏的 active + aria-current */
        function updateActiveNavUI() {
            document.querySelectorAll('.sidebar-nav-item').forEach(el => {
                const active = el.getAttribute('data-view') === currentView;
                el.classList.toggle('active', active);
                el.setAttribute('aria-current', active ? 'page' : 'false');
            });
            document.querySelectorAll('.bottom-nav-item').forEach(el => {
                const isActive = el.getAttribute('data-view') === currentView ||
                    (currentView === 'detail' && el.getAttribute('data-view') === 'posts');
                el.classList.toggle('active', isActive);
                el.setAttribute('aria-current', isActive ? 'page' : 'false');
            });
        }

        async function checkUser() {
            const app = document.getElementById('community-app');
            if (app) app.innerHTML = `
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
                <span class="loading-text">正在加载</span>
            </div>`;
            const { data: { user } } = await supabaseClient.auth.getUser();
            currentUser = user;
            if (user) {
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                if (profile) {
                    currentProfile = profile;
                } else {
                    const { data: newProfile, error: insertError } = await supabaseClient.from('profiles').upsert([{
                        id: user.id, username: user.email.split('@')[0], avatar_emoji: '🙂'
                    }]).select().single();
                    if (insertError) { console.error('创建用户资料失败:', insertError); } else if (newProfile) { currentProfile = newProfile; }
                }
            }
            renderApp();
        }

        function renderApp() {
            if (!currentUser) { renderAuthView(); } else { renderLoggedInView(); }
        }

        async function loadUnreadNotificationCount() {
            if (!currentUser) return;

            // ① 系统通知未读数（原有逻辑）
            try {
                const { count } = await supabaseClient
                    .from('notifications')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', currentUser.id)
                    .eq('is_read', false);

                const sidebarBadge = document.getElementById('msg-badge-sidebar');
                const mobileBadge = document.getElementById('msg-badge-mobile');
                const countStr = count > 99 ? '99+' : count;
                [sidebarBadge, mobileBadge].forEach(badge => {
                    if (badge) {
                        if (count > 0) {
                            badge.textContent = countStr;
                            badge.style.display = 'inline-flex';
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                });
            } catch (e) { console.error('加载未读消息计数失败:', e); }

            // ② 私信未读数
            try {
                const { count: dmCount } = await supabaseClient
                    .from('direct_messages')
                    .select('*', { count: 'exact', head: true })
                    .eq('receiver_id', currentUser.id)
                    .is('read_at', null);

                const dmBadge = document.getElementById('dm-badge-sidebar');
                if (dmBadge) {
                    if (dmCount > 0) {
                        dmBadge.textContent = dmCount > 99 ? '99+' : dmCount;
                        dmBadge.style.display = 'inline-flex';
                    } else {
                        dmBadge.style.display = 'none';
                    }
                }
            } catch (e) { console.error('加载未读私信计数失败:', e); }
        }

        /* ============================================================
           ⭐ 私信实时订阅：有新私信或标记已读时，自动刷新角标
           ============================================================ */
        let dmRealtimeChannel = null;

        function setupDmRealtime() {
            if (!currentUser) return;

            // 防止重复订阅（切换账号或重复调用时）
            teardownDmRealtime();

            dmRealtimeChannel = supabaseClient
                .channel('community-dm-realtime')
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'direct_messages' },
                    (payload) => {
                        // 只关心别人发给我的新私信
                        if (payload.new && payload.new.receiver_id === currentUser.id) {
                            loadUnreadNotificationCount();
                        }
                    }
                )
                .on(
                    'postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'direct_messages' },
                    (payload) => {
                        // 对方（我自己）在 messages.html 里标记已读 → 角标应该减少
                        // 场景：当前页和 messages.html 同开，read_at 从 null 变成时间戳
                        const oldRow = payload.old || {};
                        const newRow = payload.new || {};
                        if (
                            newRow.receiver_id === currentUser.id &&
                            !oldRow.read_at && newRow.read_at
                        ) {
                            loadUnreadNotificationCount();
                        }
                    }
                )
                .subscribe((status) => {
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        console.warn('[DM Realtime] 连接异常：', status);
                    }
                });
        }

        function teardownDmRealtime() {
            if (dmRealtimeChannel) {
                supabaseClient.removeChannel(dmRealtimeChannel);
                dmRealtimeChannel = null;
            }
        }

                const lastView = sessionStorage.getItem(lastViewKey);
                const now = Date.now();
                if (!lastView || now - Number(lastView) > 5 * 60 * 1000) {
                    await supabaseClient.from('post_views').upsert([{
                        user_id: currentUser.id, post_id: postId, viewed_at: new Date().toISOString()
                    }], { onConflict: 'user_id, post_id' });
                    sessionStorage.setItem(lastViewKey, String(now));
                }

                commentsList.innerHTML = `<p class="text-gray-500 text-xs text-center py-6">暂无评论，来抢沙发！</p>`;
                return;
            }
            const commentIds = comments.map(c => c.id);
            const { data: likes } = await supabaseClient.from('comment_likes').select('*').in('comment_id', commentIds);
            const userIds = [...new Set(comments.map(c => c.user_id))];
            const { data: profiles, error: profileError } = await supabaseClient.from('profiles').select('id, username, avatar_emoji, avatar_url').in('id', userIds);
            if (profileError) console.error('获取评论用户信息失败:', profileError);

            const profileMap = {};
            profiles?.forEach(profile => { profileMap[profile.id] = profile; });
            const likeMap = {};
            const userLikeMap = {};
            likes?.forEach(like => {
                likeMap[like.comment_id] = (likeMap[like.comment_id] || 0) + 1;
                if (like.user_id === currentUser?.id) { userLikeMap[like.comment_id] = true; }
            });
            const rootComments = comments.filter(c => !c.parent_id);
            const repliesMap = {};
            comments.forEach(c => {
                if (c.parent_id) {
                    if (!repliesMap[c.parent_id]) repliesMap[c.parent_id] = [];
                    repliesMap[c.parent_id].push(c);
                }
            });
            const renderComment = (comment, isReply = false) => {
                const likeCount = likeMap[comment.id] || 0;
                const isLiked = !!userLikeMap[comment.id];
                const replies = repliesMap[comment.id] || [];
                const author = profileMap[comment.user_id] || {};
                const safeUsername = escapeHtml(author.username || '未知用户');
                const safeContent = escapeHtml(comment.content);
                return `
            <div class="py-3 ${isReply ? 'ml-7 pl-3 border-l-2 border-gold/20' : 'border-b border-white/5 last:border-b-0'}">

                            <span class="text-[10px] text-gray-600 flex-shrink-0">${formatRelativeTime(comment.created_at)}</span>
                        </div>
                        <p class="text-gray-300 text-sm mt-1.5 leading-relaxed">${safeContent}</p>
                        <div class="flex items-center gap-2 mt-2">
                            <button class="comment-like-btn text-[10px] px-2 py-0.5 rounded-full font-bold transition-all ${isLiked ? 'bg-gold text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}" data-comment-id="${comment.id}">👍 ${likeCount}</button>
                            ${currentUser ? `
                                <button class="comment-reply-btn text-[10px] px-2 py-0.5 rounded-full font-bold bg-gray-800 text-gray-400 hover:bg-gray-700 transition" data-comment-id="${comment.id}">回复</button>
                                ${comment.user_id === currentUser.id ? `
                                    <button class="comment-delete-btn text-[10px] px-2 py-0.5 rounded-full font-bold bg-red-500/10 text-red-400 hover:bg-red-500/20 transition" data-comment-id="${comment.id}">删除</button>
                                ` : ''}
                            ` : ''}
                        </div>
                        ${currentUser ? `
                            <div class="reply-input-container hidden mt-2" data-comment-id="${comment.id}">
                                <input type="text" id="reply-input-${comment.id}" class="input-field py-1.5 text-xs" placeholder="回复...">
                                <button class="submit-reply-btn mt-1.5 px-3 py-1.5 bg-gold text-white rounded-md text-[10px] font-bold hover:bg-gold-light transition" data-comment-id="${comment.id}">提交回复</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
                ${replies.map(r => renderComment(r, true)).join('')}
            </div>`;
            };
            commentsList.innerHTML = rootComments.map(c => renderComment(c, false)).join('');
            commentsList.querySelectorAll('.comment-author-avatar, .comment-author-name').forEach(el => {
                el.addEventListener('click', () => {

                    window.location.href = `profile.html?user_id=${userId}`;

                });

            commentsList.querySelectorAll('.comment-reply-btn').forEach(btn => {

                    const inputContainer = commentsList.querySelector(`.reply-input-container[data-comment-id="${commentId}"]`);
                    if (inputContainer) {
                        inputContainer.classList.toggle('hidden');
                        if (!inputContainer.classList.contains('hidden')) {
                            inputContainer.querySelector('input').focus();
                        }
                    }
                });
            });
            commentsList.querySelectorAll('.comment-delete-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const commentId = btn.getAttribute('data-comment-id');
                    showConfirm('确定要删除这条评论吗？', async () => {
                        const { error: delErr } = await supabaseClient.from('comments').delete().eq('id', commentId);
                        if (delErr) { showError('删除失败：' + delErr.message, '删除失败'); }

        async function addReply(parentCommentId, postId) {

            const { data: parentComment } = await supabaseClient.from('comments').select('user_id').eq('id', parentCommentId).single();

                }
                replyInput.value = '';
                loadComments(postId);
            }
        }

                });

            const { data: views, error } = await supabaseClient.from('post_views').select('*, posts(id, title, user_id)').eq('user_id', currentUser.id).order('viewed_at', { ascending: false });
            if (error) { list.innerHTML = `<p class="text-red-400 text-sm">加载失败：${escapeHtml(error.message)}</p>`; return; }
            if (!views || views.length === 0) {
                list.innerHTML = `<div class="text-center py-12"><div class="text-3xl mb-2">🕐</div><p class="text-gray-400 text-sm">暂无浏览记录</p></div>`;
                return;
            }
            const authorIds = [...new Set(views.map(v => v.posts?.user_id).filter(Boolean))];
            const { data: profiles } = await supabaseClient.from('profiles').select('id, username, avatar_emoji, avatar_url').in('id', authorIds);
            const profileMap = {};
            profiles?.forEach(profile => { profileMap[profile.id] = profile; });
            list.innerHTML = `<div class="space-y-2">${views.map(view => {
                const post = view.posts || {};
                const author = profileMap[post.user_id] || {};
                return `
            <div class="community-card p-3.5 cursor-pointer hover:border-gold/40 transition" data-post-id="${post.id || ''}">
                <p class="text-sm font-bold text-white truncate">${escapeHtml(post.title || '未知帖子')}</p>

                    <span class="text-xs text-gray-400 truncate">${escapeHtml(author.username || '未知用户')}</span>
                    <span class="text-[10px] text-gray-600 ml-auto flex-shrink-0">${formatRelativeTime(view.viewed_at)}</span>
                </div>
            </div>`;
            }).join('')}</div>`;
            list.querySelectorAll('[data-post-id]').forEach(el => {
                el.addEventListener('click', () => {
                    const postId = el.getAttribute('data-post-id');
                    if (postId) {
                        currentView = 'detail';
                        currentPostId = Number(postId);
                        renderContent();
                    }
                });
            });
        }

                        <label class="block text-xs text-gray-400 mb-1.5 font-bold">内容</label>

                        <button id="submit-post" class="btn-gold text-sm">发布帖子</button>
                    </div>
                </div>
            </div>
        </div>`;
            document.getElementById('cancel-post').addEventListener('click', () => {
                currentView = 'list';
                renderContent();
            });
            document.getElementById('submit-post').addEventListener('click', async () => {
                const title = document.getElementById('new-post-title').value.trim();
                const content = document.getElementById('new-post-content').value.trim();
                if (!title || !content) {
                    showWarn('标题和内容不能为空', '还差一点');
                    return;
                }
                const { error } = await supabaseClient.from('posts').insert([{ user_id: currentUser.id, title, content }]);
                if (error) {
                    showError('发布失败：' + error.message, '发布失败');

                    currentView = 'list';
                    renderContent();
                }
            });
        }

        async function toggleFollowFromList(userId, buttonElement) {
            if (!currentUser) {
                const go = await requireLogin('follow');
                if (go) window.location.href = 'login.html';
                return;
            }
            if (currentUser.id === userId) return;
            const { data: existing } = await supabaseClient.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_id', userId).maybeSingle();
            if (existing) {
                await supabaseClient.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', userId);
                buttonElement.textContent = '+ 关注';
                buttonElement.className = 'text-[11px] px-2.5 py-1 rounded-full font-bold bg-gold text-white hover:bg-gold-light transition';
            } else {
                await supabaseClient.from('follows').insert([{ follower_id: currentUser.id, following_id: userId }]);
                await supabaseClient.from('notifications').insert([{ user_id: userId, type: 'follow', actor_id: currentUser.id }]);
                buttonElement.textContent = '✓ 已关注';
                buttonElement.className = 'text-[11px] px-2.5 py-1 rounded-full font-bold bg-gray-700 text-gray-300 hover:bg-gray-600 transition';
            }
        }

        checkUser();
        // 页面关闭 / 刷新时断开 Realtime，防止连接残留
