<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F7F7F7">
    <title>热门科目 - A-Level Guide</title>
    <meta name="description" content="A-Level热门科目指南：数学、进阶数学、物理、化学、生物、经济、会计、商务、心理学、计算机科学的详细解析。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        duo: {
                            green: '#58CC02',
                            blue: '#1CB0F6',
                            yellow: '#FFC800',
                            orange: '#FF9600',
                            red: '#FF4B4B',
                            purple: '#CE82FF',
                            pink: '#FF86D0',
                            cyan: '#14D4F4',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <link rel="stylesheet" href="ai-assistant.css">

    <style>
        :root {
            --duo-green: #58CC02;
            --duo-green-dark: #58A700;
            --duo-blue: #1CB0F6;
            --duo-blue-dark: #1899D6;
            --duo-yellow: #FFC800;
            --duo-orange: #FF9600;
            --duo-red: #FF4B4B;
            --duo-purple: #CE82FF;
            --duo-pink: #FF86D0;
            --duo-cyan: #14D4F4;

            --text-main: #3C3C3C;
            --text-sub: #777777;
            --text-faint: #AFAFAF;
            --border-soft: #E5E5E5;
            --bg-page: #F7F7F7;
            --bg-card: #FFFFFF;
            --shadow-btn: 0 4px 0 var(--duo-green-dark);

            --radius-sm: 12px;
            --radius: 16px;
            --radius-lg: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
            font-weight: 500;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #EDEDED;
        }

        ::-webkit-scrollbar-thumb {
            background: #CFCFCF;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #B0B0B0;
        }

        ::selection {
            background: rgba(88, 204, 2, 0.25);
        }

        /* ========== 背景层 ========== */
        #glow-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
        }

        .glow-orb--1 {
            width: 760px;
            height: 760px;
            top: -280px;
            left: -260px;
            background: radial-gradient(circle, rgba(88, 204, 2, .30) 0%, rgba(88, 204, 2, 0) 68%);
        }

        .glow-orb--2 {
            width: 680px;
            height: 680px;
            top: 12%;
            right: -280px;
            background: radial-gradient(circle, rgba(28, 176, 246, .30) 0%, rgba(28, 176, 246, 0) 68%);
        }

        .glow-orb--3 {
            width: 560px;
            height: 560px;
            bottom: 8%;
            left: -60px;
            background: radial-gradient(circle, rgba(255, 200, 0, .28) 0%, rgba(255, 200, 0, 0) 68%);
        }

        .glow-orb--4 {
            width: 640px;
            height: 640px;
            bottom: -260px;
            right: 10%;
            background: radial-gradient(circle, rgba(206, 130, 255, .28) 0%, rgba(206, 130, 255, 0) 68%);
        }

        .glow-orb--5 {
            width: 520px;
            height: 520px;
            top: 45%;
            left: 40%;
            background: radial-gradient(circle, rgba(255, 134, 208, .20) 0%, rgba(255, 134, 208, 0) 68%);
        }

        .glow-orb--6 {
            width: 520px;
            height: 520px;
            top: 68%;
            right: 30%;
            background: radial-gradient(circle, rgba(20, 212, 244, .20) 0%, rgba(20, 212, 244, 0) 68%);
        }

        #particles-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 导航栏 ========== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.92) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 2px solid var(--border-soft) !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
        }

        .nav-glass .text-white {
            color: var(--text-main) !important;
            text-shadow: none !important;
        }

        .nav-glass .nav-link {
            color: var(--text-sub) !important;
            font-weight: 700 !important;
        }

        .nav-glass .nav-link:hover {
            color: var(--duo-green) !important;
        }

        .nav-glass .nav-link.active {
            color: var(--duo-green) !important;
        }

        .nav-glass #mobile-menu-btn {
            border-color: var(--border-soft) !important;
        }

        .nav-glass #mobile-menu-btn svg {
            color: var(--text-main) !important;
        }

        .nav-glass #mobile-menu a {
            color: var(--text-main) !important;
        }

        #mobile-menu {
            background: #fff;
            border-top: 2px solid var(--border-soft);
        }

        /* ========== 页面主区 ========== */
        main {
            position: relative;
            z-index: 1;
        }

        .page-head {
            text-align: center;
            padding: 36px 16px 8px;
        }

        .page-head h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .page-head h1 .hl {
            color: var(--duo-green);
        }

        .page-head p {
            margin-top: 10px;
            font-size: 1rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* ========== Duolingo 风格按钮 ========== */
        .btn-duo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius);
            background: var(--duo-green);
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--duo-green-dark);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
            user-select: none;
        }

        .btn-duo:hover {
            filter: brightness(1.06);
        }

        .btn-duo:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        .btn-duo.ghost {
            background: #fff;
            color: var(--text-sub);
            box-shadow: 0 4px 0 var(--border-soft);
            border: 2px solid var(--border-soft);
        }

        .btn-duo.ghost:hover {
            color: var(--text-main);
        }

        .btn-duo.ghost:active {
            box-shadow: 0 0 0 var(--border-soft);
        }

        /* ========== 视图切换 ========== */
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 0;
            flex-wrap: wrap;
        }

        /* ========== 轮播容器 ========== */
        .carousel-wrap {
            position: relative;
            width: 100%;
            height: 600px;
            perspective: 1600px;
            overflow: hidden;
            margin-top: -14px;
        }

        .carousel-stage {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }

        /* 左右方向提示箭头 */
        .edge-cue {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 150;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--border-soft);
            box-shadow: 0 4px 0 var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-faint);
            pointer-events: none;
            opacity: 0.85;
            transition: color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }

        .edge-cue--left {
            left: 20px;
        }

        .edge-cue--right {
            right: 20px;
        }

        .edge-cue svg {
            width: 22px;
            height: 22px;
        }

        .carousel-wrap.lean-left .edge-cue--left {
            color: var(--duo-blue);
            border-color: var(--duo-blue);
            transform: translateY(-50%) scale(1.12);
        }

        .carousel-wrap.lean-right .edge-cue--right {
            color: var(--duo-blue);
            border-color: var(--duo-blue);
            transform: translateY(-50%) scale(1.12);
        }

        /* ========== 贴纸卡片 ========== */
        .subject-card {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 380px;
            height: 470px;
            margin-left: -190px;
            margin-top: -235px;
            background: #fff;
            border: 2px solid var(--border-soft);
            border-bottom: 5px solid var(--card-accent-dark, var(--border-soft));
            border-radius: var(--radius-lg);
            padding: 24px 22px 20px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .carousel-stage.is-animating .subject-card {
            will-change: transform, opacity;
        }

        .subject-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(180deg, var(--card-accent) 0%, transparent 26%);
            opacity: 0.08;
            pointer-events: none;
        }

        .subject-card:hover,
        .subject-card.is-hover {
            border-color: var(--card-accent);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.10);
        }

        .card-topline {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: color-mix(in srgb, var(--card-accent) 16%, #fff);
            border: 2px solid color-mix(in srgb, var(--card-accent) 30%, #fff);
        }

        .subject-card:hover .card-icon,
        .subject-card.is-hover .card-icon {
            transform: scale(1.1) rotate(-6deg);
        }

        .fav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #CFCFCF;
            transition: transform 0.15s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }

        .fav-btn svg {
            width: 20px;
            height: 20px;
        }

        .fav-btn:hover,
        .fav-btn.is-hover {
            border-color: var(--duo-yellow);
            color: var(--duo-yellow);
            background: #FFFBEB;
            transform: scale(1.12);
            box-shadow: 0 4px 12px rgba(255, 200, 0, 0.3);
        }

        /* 已激活状态下 hover 时保持黄色实心背景 */
        .fav-btn.active:hover,
        .fav-btn.active.is-hover {
            background: var(--duo-yellow);
            border-color: var(--duo-yellow);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 200, 0, 0.45);
        }

        .fav-btn:active {
            transform: scale(0.92);
        }

        .fav-btn:focus-visible {
            outline: 3px solid rgba(88, 204, 2, 0.4);
            outline-offset: 2px;
        }

        /* 让星星始终可点 */
        .subject-card .fav-btn,
        .fav-card .fav-btn {
            pointer-events: auto !important;
            position: relative;
            z-index: 10;
        }

        .fav-btn.active {
            background: var(--duo-yellow);
            border-color: var(--duo-yellow);
            color: #fff;
            animation: fav-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fav-pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.28);
            }

            100% {
                transform: scale(1);
            }
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .card-en {
            margin-top: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-faint);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .card-tagline {
            margin-top: 14px;
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-sub);
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-stars {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
        }

        .card-stars .star {
            font-size: 20px;
            line-height: 1;
            color: #E5E5E5;
        }

        .card-stars .star.on {
            color: var(--duo-yellow);
            text-shadow: 0 2px 0 #E0B000;
        }

        .card-stars .label {
            margin-left: 6px;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-faint);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .card-tags span {
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            color: var(--card-accent-dark);
            background: color-mix(in srgb, var(--card-accent) 16%, #fff);
            border: 2px solid color-mix(in srgb, var(--card-accent) 26%, #fff);
        }

        .card-more {
            margin-top: auto;
            padding-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--card-accent);
            opacity: 0.85;
        }

        .card-more svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }

        .subject-card:hover .card-more svg,
        .subject-card.is-hover .card-more svg {
            transform: translateX(4px);
        }

        /* ========== 收藏网格 ========== */
        #favorite-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 28px;
        }

        /* ⭐ 修复：ID 选择器的 display:grid 会覆盖 Tailwind 的 .hidden，
              这里用 ID + class 的组合选择器（优先级更高）把它压下去 */
        #favorite-grid.hidden {
            display: none !important;
        }

        .fav-card {
            position: relative;
            background: #fff;
            border: 2px solid var(--border-soft);
            border-bottom: 5px solid var(--card-accent-dark, var(--border-soft));
            border-radius: var(--radius-lg);
            padding: 22px 20px 20px;
            transition: transform 0.12s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .fav-card:hover {
            transform: translateY(-3px);
            border-color: var(--card-accent);
        }

        .fav-card .fav-btn {
            position: absolute;
            top: 14px;
            right: 14px;
        }

        .fav-card .fav-card-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .fav-card h3 {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--text-main);
            padding-right: 48px;
        }

        .fav-card .fav-card-code {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-faint);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .fav-card p {
            margin-top: 10px;
            font-size: 0.86rem;
            line-height: 1.6;
            color: var(--text-sub);
        }

        #empty-favorites {
            text-align: center;
            padding: 60px 24px;
            border: 3px dashed var(--border-soft);
            border-radius: var(--radius-lg);
            background: #fff;
            max-width: 520px;
            margin: 28px auto 0;
        }

        #empty-favorites .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 14px;
        }

        #empty-favorites p {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        /* ========== 详情弹窗 ========== */
        .detail-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .detail-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-panel {
            width: 100%;
            max-width: 680px;
            max-height: 86vh;
            background: #fff;
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: translateY(24px) scale(0.97);
            transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
        }

        .detail-overlay.open .detail-panel {
            transform: translateY(0) scale(1);
        }

        .detail-header {
            padding: 26px 28px 22px;
            background: var(--card-accent, var(--duo-green));
            color: #fff;
            position: relative;
            flex-shrink: 0;
        }

        .detail-header .dh-icon {
            font-size: 34px;
            line-height: 1;
            margin-bottom: 10px;
        }

        .detail-header h2 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .detail-header .dh-sub {
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .detail-header .dh-stars {
            margin-top: 12px;
            display: flex;
            gap: 4px;
            font-size: 18px;
        }

        .detail-header .dh-stars .s {
            opacity: 0.35;
        }

        .detail-header .dh-stars .s.on {
            opacity: 1;
        }

        .detail-close {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .detail-close:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.08);
        }

        .detail-close:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.7);
            outline-offset: 2px;
        }

        .detail-body {
            padding: 24px 28px 30px;
            overflow-y: auto;
            flex: 1;
        }

        .detail-section {
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: var(--radius-sm);
            background: #FAFAFA;
            border-left: 4px solid var(--card-accent, var(--duo-green));
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section .ds-label {
            display: block;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--card-accent-dark, var(--duo-green));
            margin-bottom: 6px;
        }

        .detail-section p {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-main);
            font-weight: 500;
        }

        .detail-section strong {
            font-weight: 800;
            color: var(--text-main);
        }

        /* ========== 页脚 ========== */
        footer {
            position: relative;
            z-index: 1;
            margin-top: 60px;
            padding: 30px 16px;
            text-align: center;
            border-top: 2px solid var(--border-soft);
            background: #fff;
            color: var(--text-faint);
            font-size: 13px;
            font-weight: 600;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .view-toggle {
                margin: 16px 0 8px;
            }

            .carousel-wrap {
                height: auto;
                perspective: none;
                overflow: visible;
                padding: 8px 0;
                margin-top: 0;
            }

            .carousel-stage {
                position: static;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 18px;
            }

            .subject-card {
                position: relative !important;
                left: auto !important;
                top: auto !important;
                margin: 0 !important;
                width: 100% !important;
                height: auto !important;
                min-height: 0;
                transform: none !important;
                opacity: 1 !important;
                visibility: visible !important;
                pointer-events: auto !important;
                border-radius: var(--radius);
            }

            .edge-cue {
                display: none;
            }

            .card-tagline {
                -webkit-line-clamp: 4;
            }
        }

        @media (max-width: 480px) {
            .page-head {

        // ========== 详情弹窗 ==========

        // 弹窗打开前的焦点，以及 body overflow 原值
        let lastFocusedBeforeDetail = null;
        let bodyOverflowBeforeDetail = '';

        function openDetail(key) {
            const sub = SUBJECTS.find(s => s.key === key);

            overlayEl.classList.remove('open');

            if (lastFocusedBeforeDetail && typeof lastFocusedBeforeDetail.focus === 'function') {

        // Tab 键陷阱：焦点限制在弹窗内
        overlayEl.addEventListener('keydown', (e) => {
            if (e.key !== 'Tab') return;
            const focusables = panel.querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            );
            if (!focusables.length) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        });

        // ============================================================
        //  3D 轮播 —— 「鼠标位置即速度」的操纵杆模式
        //
        //  性能优化点：
        //   · pointermove 使用 requestAnimationFrame 节流
        //   · 收藏按钮命中判定改用 elementsFromPoint
        //   · 弹窗打开时自动暂停响应
        // ============================================================
        (function initCarousel() {
            const cards = Array.from(STAGE.querySelectorAll('.subject-card'));
            if (!cards.length) return;

            const total = cards.length;

            // ---- 手感参数（调参速查）----
            const SENSOR_WIDTH = 130;      // 左右两侧触发旋转的感应带宽度（px）
            const MAX_SPEED = 1.05;        // 边缘满速时的旋转速度（卡片/秒）
            const SPEED_SOFT = 7;          // 速度跟随灵敏度（越大越跟手）
            const SNAP_SOFT = 9;           // 松手后对齐灵敏度
            const VISIBLE_RANGE = 3.4;     // 可见卡片范围（以中心为基准的距离）

            // ---- 运行时状态 ----
            let centerIndex = 0;
            let speed = 0;
            let mouseRatio = 0;
            let mouseActive = false;
            let isOverFav = false;         // 鼠标是否悬停在星星上
            let rafId = null;
            let lastTime = 0;
            let spacing = 400;

            function computeSpacing() {
                spacing = Math.min(420, Math.max(280, WRAP.offsetWidth * 0.30));
            }

            function startLoop() {
                if (rafId !== null || isMobile()) return;
                lastTime = performance.now();
                STAGE.classList.add('is-animating');
                rafId = requestAnimationFrame(tick);
            }

            function stopLoop() {
                if (rafId !== null) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
                STAGE.classList.remove('is-animating');
            }

            function pauseMotion() {
                mouseActive = false;
                mouseRatio = 0;
                speed = 0;
                WRAP.classList.remove('lean-left', 'lean-right');
                stopLoop();
            }

            function render() {
                for (let i = 0; i < total; i++) {
                    const card = cards[i];

                    let off = i - centerIndex;
                    off -= Math.round(off / total) * total;

                    const abs = Math.abs(off);

                    if (abs > VISIBLE_RANGE) {
                        if (card._offstage !== true) {
                            card.style.opacity = '0';
                            card.style.visibility = 'hidden';
                            card.style.pointerEvents = 'none';
                            card._offstage = true;
                        }
                        continue;
                    }

                    if (card._offstage) {
                        card.style.visibility = 'visible';
                        card._offstage = false;
                    }

                    const t = abs / VISIBLE_RANGE;
                    const opacity = 1 - Math.pow(t, 2.4);
                    const scale = 1 - Math.min(0.40, abs * 0.115);
                    const rotateY = Math.max(-42, Math.min(42, -off * 14));
                    const tx = off * spacing;
                    const ty = abs * 12;

                    card.style.transform =
                        `translate3d(${tx}px, ${ty}px, 0) rotateY(${rotateY}deg) scale(${scale})`;
                    card.style.opacity = opacity;
                    card.style.zIndex = String(200 - Math.round(abs * 20));
                    card.style.pointerEvents = abs < 2.4 ? 'auto' : 'none';

                    const isCenter = abs < 0.5;
                    if (card._isCenter !== isCenter) {
                        card.classList.toggle('is-center', isCenter);
                        card._isCenter = isCenter;
                    }
                }
            }

            function tick(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;

                if (mouseActive) {
                    const absR = Math.abs(mouseRatio);
                    const targetSpeed = -Math.sign(mouseRatio) * MAX_SPEED * absR * absR;
                    const k = 1 - Math.exp(-SPEED_SOFT * dt);
                    speed += (targetSpeed - speed) * k;
                    centerIndex += speed * dt;
                } else {
                    let diff = Math.round(centerIndex) - centerIndex;
                    diff -= Math.round(diff / total) * total;

                    const k = 1 - Math.exp(-SNAP_SOFT * dt);
                    centerIndex += diff * k;
                    speed = 0;

                    if (Math.abs(diff) < 0.0015) {
                        centerIndex = ((Math.round(centerIndex) % total) + total) % total;
                        render();
                        stopLoop();
                        return;
                    }
                }

                centerIndex = ((centerIndex % total) + total) % total;
                render();
                rafId = requestAnimationFrame(tick);
            }

            function updatePointer(clientX, clientY) {
                // 弹窗打开时暂停轮播响应
                if (overlayEl && overlayEl.classList.contains('open')) return;

                const rect = WRAP.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const inside = x >= 0 && x <= rect.width && y >= 0 && y <= rect.height;

                if (inside) {
                    let ratio = 0;
                    if (x < SENSOR_WIDTH) {
                        ratio = -(1 - x / SENSOR_WIDTH);
                    } else if (x > rect.width - SENSOR_WIDTH) {
                        ratio = (x - (rect.width - SENSOR_WIDTH)) / SENSOR_WIDTH;
                    }

                    mouseRatio = ratio;
                    WRAP.classList.toggle('lean-left', ratio < -0.05);
                    WRAP.classList.toggle('lean-right', ratio > 0.05);

                    if (Math.abs(ratio) > 0.01) {
                        mouseActive = true;
                        startLoop();
                    } else if (mouseActive) {
                        mouseActive = false;
                        if (rafId === null) startLoop();
                    }
                } else if (mouseActive) {
                    mouseActive = false;
                    mouseRatio = 0;
                    WRAP.classList.remove('lean-left', 'lean-right');
                    if (rafId === null) startLoop();
                }
            }

            // ---- 全局指针事件（rAF 节流）----
            let pendingMoveEvent = null;
            let moveRaf = null;
            // ⭐ 当前被 JS 强制高亮的 fav-btn
            //    因为 3D 变换会让浏览器原生 :hover 命中不准，所以这里用坐标
            //    主动给鼠标下的按钮加 .is-hover 类，作为 :hover 的补充
            let currentHoverFav = null;

            function updateFavHover(e) {
                const hoveredFav = favBtnAtPoint(e.clientX, e.clientY);
                if (hoveredFav === currentHoverFav) return;
                if (currentHoverFav) currentHoverFav.classList.remove('is-hover');
                if (hoveredFav) hoveredFav.classList.add('is-hover');
                currentHoverFav = hoveredFav;
            }

            // ⭐ 当前被 JS 强制高亮的 subject-card（侧边卡片也能高亮）
            let currentHoverCard = null;

            function updateCardHover(e) {
                const hoveredCard = cardAtPoint(e.clientX, e.clientY);
                if (hoveredCard === currentHoverCard) return;
                if (currentHoverCard) currentHoverCard.classList.remove('is-hover');
                if (hoveredCard) hoveredCard.classList.add('is-hover');
                currentHoverCard = hoveredCard;
            }

            function handleGlobalPointerMove(e) {
                if (isMobile()) return;

                // ⭐ 强制更新 fav-btn hover 状态，解决 3D transform 下 hover 不生效的问题
                updateFavHover(e);

                // ⭐ 同样强制更新卡片 hover 状态，让侧边卡片也能高亮
                updateCardHover(e);

                const target = e.target;
                const onFav = favBtnAtPoint(e.clientX, e.clientY);
                const onCard = target && typeof target.closest === 'function'
                    ? target.closest('.subject-card') : null;

                const rect = WRAP.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const inside = x >= 0 && x <= rect.width && y >= 0 && y <= rect.height;

                // 只有鼠标在容器内、且落在左右边缘带，才算"旋转区"
                const inSensor = inside && (x < SENSOR_WIDTH || x > rect.width - SENSOR_WIDTH);

                // 冻结条件：
                //   1. 鼠标在星星上（坐标命中，无视遮挡）
                //   2. 鼠标在卡片上，且不在左右旋转感应带里
                const shouldFreeze = !!onFav || (!!onCard && !inSensor);

                if (shouldFreeze) {
                    if (!isOverFav) {
                        isOverFav = true;
                        pauseMotion();
                    }
                    return;
                }

                if (isOverFav) isOverFav = false;

                updatePointer(e.clientX, e.clientY);
            }

            window.addEventListener('pointermove', (e) => {
                if (isMobile()) return;
                pendingMoveEvent = e;
                if (moveRaf) return;
                moveRaf = requestAnimationFrame(() => {
                    moveRaf = null;
                    if (pendingMoveEvent) {
                        handleGlobalPointerMove(pendingMoveEvent);
                        pendingMoveEvent = null;
                    }
                });
            }, { passive: true });

            window.addEventListener('pointerdown', (e) => {
                if (isMobile()) return;
                if (isOverFav) return;
                updatePointer(e.clientX, e.clientY);
            }, { passive: true });

            window.addEventListener('pointerleave', () => {
                if (isMobile()) return;
                isOverFav = false;

                // ⭐ 清除 fav-btn 的强制 hover 状态
                if (currentHoverFav) {
                    currentHoverFav.classList.remove('is-hover');
                    currentHoverFav = null;
                }

                // ⭐ 清除卡片的强制 hover 状态
                if (currentHoverCard) {
                    currentHoverCard.classList.remove('is-hover');
                    currentHoverCard = null;
                }

                if (mouseActive) {
                    mouseActive = false;
                    mouseRatio = 0;
                    WRAP.classList.remove('lean-left', 'lean-right');
                    if (rafId === null) startLoop();
                }
            });

            // ---- 卡片点击打开详情（星星由全局委托处理，不会走到这里）----
            cards.forEach((card) => {
                card.addEventListener('click', () => {
                    openDetail(card.getAttribute('data-subject-key'));
                });
            });

            // ---- 窗口尺寸变化（防抖）----
            function handleResize() {
                if (isMobile()) {
                    stopLoop();
                    mouseActive = false;
                    speed = 0;
                    isOverFav = false;
                    WRAP.classList.remove('lean-left', 'lean-right');
                    cards.forEach(c => {
                        c.style.transform = '';
                        c.style.opacity = '';
                        c.style.visibility = '';
                        c.style.zIndex = '';
                        c.style.pointerEvents = '';
                        c._offstage = false;
                        c._isCenter = undefined;
                        c.classList.remove('is-center');
                    });
                } else {
                    computeSpacing();
                    render();
                }
            }

            let resizeTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleResize, 120);
            });

            computeSpacing();
            handleResize();
        })();

        // ========== 收藏逻辑（Supabase） ==========
        // ⭐ 复用全局客户端（由 supabase-config.js 创建）

        const viewAllBtn = document.getElementById('view-all-btn');
        const viewFavBtn = document.getElementById('view-fav-btn');
        const favoriteGrid = document.getElementById('favorite-grid');
        const emptyFav = document.getElementById('empty-favorites');
        const carouselWrap = document.getElementById('carouselWrap');

        let currentUser = null;
        const favoriteKeys = new Set();
        let currentView = 'all';   // 'all' | 'fav'

        function syncFavButtons() {
            document.querySelectorAll('.fav-btn').forEach(btn => {
                const key = btn.getAttribute('data-subject-key');
                btn.classList.toggle('active', favoriteKeys.has(key));

        }

        function renderFavorites() {
            const list = SUBJECTS.filter(s => favoriteKeys.has(s.key));
            if (!list.length) {
                favoriteGrid.classList.add('hidden');
                emptyFav.classList.remove('hidden');
                favoriteGrid.innerHTML = '';
                return;
            }
            emptyFav.classList.add('hidden');
            favoriteGrid.classList.remove('hidden');
            favoriteGrid.innerHTML = list.map(sub => `
            <div class="fav-card"
                 data-subject-key="${sub.key}"
                 style="--card-accent:${sub.color}; --card-accent-dark:${sub.dark};">
                <button class="fav-btn active" data-subject-key="${sub.key}" aria-label="取消收藏 ${sub.zh}">
                    ${STAR_SVG}
                </button>
                <div class="fav-card-icon">${sub.icon}</div>
                <h3>${sub.zh}</h3>
                <div class="fav-card-code">${sub.en} · CAIE ${sub.code}</div>

        `).join('');

            // 收藏网格卡片点击打开详情
            // （注意：星星会在全局 click 捕获阶段被拦截，不会触发到这里）
            favoriteGrid.querySelectorAll('.fav-card').forEach(card => {
                card.addEventListener('click', () => {

                });

        async function toggleFavorite(key) {
            if (!currentUser) {
                if (typeof window.duoRequireLogin === 'function') {
                    try {
                        const go = await window.duoRequireLogin('subject');
                        if (go) window.location.href = 'login.html';
                    } catch (_) {
                        window.location.href = 'login.html';
                    }
                } else {
                    window.location.href = 'login.html';
                }
                return;
            }

            const wasFav = favoriteKeys.has(key);

            // 乐观更新
            if (wasFav) favoriteKeys.delete(key);
            else favoriteKeys.add(key);
            syncFavButtons();
            if (currentView === 'fav') renderFavorites();

            try {
                if (wasFav) {
                    await window.supabaseClient
                        .from('subject_favorites')
                        .delete()
                        .eq('user_id', currentUser.id)
                        .eq('subject_key', key);
                } else {
                    await window.supabaseClient
                        .from('subject_favorites')
                        .insert([{ user_id: currentUser.id, subject_key: key }]);
                }
            } catch (err) {
                // 失败回滚
                console.warn('收藏操作失败，已回滚：', err);
                if (wasFav) favoriteKeys.add(key);
                else favoriteKeys.delete(key);
                syncFavButtons();
                if (currentView === 'fav') renderFavorites();
            }
        }

        // ============================================================
        //  ⭐ 星星点击：全局捕获阶段 + 坐标命中
        //   · 鼠标点击使用 elementsFromPoint 应对卡片遮挡
        //   · 键盘 Enter 触发时坐标是 (0,0)，回退用 e.target
        //   · 捕获阶段 + stopPropagation 阻止卡片点击打开详情
        // ============================================================
        document.addEventListener('click', async (e) => {
            let btn = null;

            if (e.clientX === 0 && e.clientY === 0 && e.target && e.target.closest) {
                // 键盘触发的 click
                btn = e.target.closest('.fav-btn');
            } else {
                // 鼠标 / 触摸触发的 click
                btn = favBtnAtPoint(e.clientX, e.clientY);
            }

            if (!btn) return;

            e.stopPropagation();
            e.preventDefault();

            const key = btn.getAttribute('data-subject-key');
            if (key) await toggleFavorite(key);
        }, true);

        // 视图切换
        viewAllBtn.addEventListener('click', () => {
            currentView = 'all';
            viewAllBtn.classList.remove('ghost');
            viewFavBtn.classList.add('ghost');
            carouselWrap.classList.remove('hidden');
            favoriteGrid.classList.add('hidden');
            emptyFav.classList.add('hidden');
            // 重新计算间距
            window.dispatchEvent(new Event('resize'));
        });

        viewFavBtn.addEventListener('click', () => {
            currentView = 'fav';
            viewFavBtn.classList.remove('ghost');
            viewAllBtn.classList.add('ghost');
            carouselWrap.classList.add('hidden');
            renderFavorites();
        });

        // ============================================================
        //  Supabase 初始化
        // ============================================================
        (async function initSupabase() {
            // ⭐ 直接复用全局客户端
            const client = window.supabaseClient;
            if (!client) {
                console.warn('Supabase 客户端未初始化，请检查 supabase-config.js');
                return;
            }

            try {
                const { data: { user } } = await client.auth.getUser();
                currentUser = user;

                if (user) {
                    const { data } = await client
                        .from('subject_favorites')
                        .select('subject_key')
                        .eq('user_id', user.id);
                    if (data) data.forEach(item => favoriteKeys.add(item.subject_key));
                }
            } catch (err) {
                console.warn('获取用户信息失败：', err);
            }

            syncFavButtons();
        })();

        // ============================================================
        //  从 bfcache 返回时温和重新同步（不再整页 reload）
        // ============================================================
        window.addEventListener('pageshow', async (event) => {
            if (!event.persisted) return;
            try {
                if (!window.supabaseClient) return;
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                currentUser = user;
                favoriteKeys.clear();
                if (user) {
                    const { data } = await window.supabaseClient
                        .from('subject_favorites')
                        .select('subject_key')
                        .eq('user_id', user.id);
                    if (data) data.forEach(item => favoriteKeys.add(item.subject_key));
                }
                syncFavButtons();
                if (currentView === 'fav') renderFavorites();
            } catch (_) { /* 忽略 */ }
        });
    </script>
