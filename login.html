<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - A-Level Guide</title>
    <meta name="description" content="登录或注册 A-Level Guide 账号" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        duo: {
                            green: '#58CC02', blue: '#1CB0F6', yellow: '#FFC800',
                            orange: '#FF9600', red: '#FF4B4B', purple: '#CE82FF',
                            pink: '#FF86D0', cyan: '#14D4F4',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        :root {
            --duo-green: #58CC02;
            --duo-green-dark: #58A700;
            --duo-green-soft: #F0F9E8;
            --duo-blue: #1CB0F6;
            --duo-yellow: #FFC800;
            --duo-red: #FF4B4B;
            --duo-red-soft: #FFF0F0;

            --text-main: #3C3C3C;
            --text-sub: #777777;
            --text-faint: #AFAFAF;
            --border-soft: #E5E5E5;
            --bg-page: #F7F7F7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            font-weight: 500;
            position: relative;
            overflow-x: hidden;
        }

        ::selection { background: rgba(88, 204, 2, 0.25); }

        /* ========== 背景光斑 ========== */
        #glow-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFFFA 40%, #FFFFFF 70%, #F5FBFF 100%);
            background-size: 300% 300%;
            animation: pageGradient 24s ease-in-out infinite;
        }
        @keyframes pageGradient {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            will-change: transform;
        }
        .glow-orb--1 { width: 520px; height: 520px; top: -160px; left: -160px;
            background: radial-gradient(circle, rgba(88, 204, 2, 0.55) 0%, rgba(88, 204, 2, 0.15) 45%, transparent 72%);
            animation: flow1 26s ease-in-out infinite; }
        .glow-orb--2 { width: 500px; height: 500px; bottom: -180px; right: -140px;
            background: radial-gradient(circle, rgba(28, 176, 246, 0.55) 0%, rgba(28, 176, 246, 0.15) 45%, transparent 72%);
            animation: flow2 30s ease-in-out infinite; animation-delay: -6s; }
        .glow-orb--3 { width: 400px; height: 400px; top: 30%; right: -100px;
            background: radial-gradient(circle, rgba(206, 130, 255, 0.5) 0%, rgba(206, 130, 255, 0.12) 45%, transparent 72%);
            animation: flow3 32s ease-in-out infinite; animation-delay: -14s; }
        .glow-orb--4 { width: 380px; height: 380px; bottom: 10%; left: -100px;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.5) 0%, rgba(255, 200, 0, 0.12) 45%, transparent 72%);
            animation: flow4 28s ease-in-out infinite; animation-delay: -4s; }
        .glow-orb--5 { width: 340px; height: 340px; top: 15%; left: 40%;
            background: radial-gradient(circle, rgba(255, 134, 208, 0.45) 0%, rgba(255, 134, 208, 0.1) 45%, transparent 72%);
            animation: flow1 24s ease-in-out infinite; animation-delay: -3s; }
        .glow-orb--6 { width: 360px; height: 360px; bottom: 20%; right: 25%;
            background: radial-gradient(circle, rgba(20, 212, 244, 0.45) 0%, rgba(20, 212, 244, 0.1) 45%, transparent 72%);
            animation: flow2 28s ease-in-out infinite; animation-delay: -16s; }

        @keyframes flow1 { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(18vw, 12vh) scale(1.1); } 50% { transform: translate(30vw, 32vh) scale(0.95); } 75% { transform: translate(8vw, 42vh) scale(1.05); } }
        @keyframes flow2 { 0%,100% { transform: translate(0,0) scale(1); } 20% { transform: translate(-18vw, -10vh) scale(1.1); } 50% { transform: translate(-35vw, -28vh) scale(0.92); } 75% { transform: translate(-12vw, -40vh) scale(1.06); } }
        @keyframes flow3 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(-15vw, 18vh) scale(1.12); } 66% { transform: translate(-22vw, 40vh) scale(0.94); } }
        @keyframes flow4 { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(15vw, -12vh) scale(1.08); } 55% { transform: translate(28vw, 5vh) scale(0.94); } }

        /* ========== 登录卡片 ========== */
        .auth-card {
            position: relative;
            z-index: 1;
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-bottom: 5px solid var(--border-soft);
            border-radius: 24px;
            padding: 2.25rem 2rem 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== Logo 徽章 ========== */
        .logo-badge {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #58CC02, #8EE000);
            box-shadow: 0 4px 0 #58A700;
            margin: 0 auto 16px;
            animation: badgeFloat 3s ease-in-out infinite;
        }
        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }
        .logo-badge svg {
            width: 32px;
            height: 32px;
            color: #FFFFFF;
        }

        /* ========== 标题 ========== */
        .auth-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* ========== 模式切换按钮 ========== */
        .mode-toggle {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            padding: 5px;
            background: #F5F5F5;
            border-radius: 999px;
        }

        .auth-mode-btn {
            flex: 1;
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--text-sub);
            transition: all 0.2s ease;
            letter-spacing: 0.03em;
            font-family: inherit;
        }

        .auth-mode-btn:hover { color: var(--text-main); }

        .auth-mode-btn.active {
            background: var(--duo-green);
            color: #FFFFFF;
            box-shadow: 0 3px 0 var(--duo-green-dark);
        }

        /* ========== 表单 ========== */
        .form-field {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 900;
            color: var(--text-sub);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 0.85rem 1.1rem;
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: var(--text-faint);
            font-weight: 500;
        }

        .input-field:focus {
            border-color: var(--duo-green);
            box-shadow: 0 0 0 4px rgba(88, 204, 2, 0.12);
        }

        .input-field.has-toggle {
            padding-right: 48px;
        }

        /* 密码可见性切换按钮 */
        .pwd-toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-faint);
            border-radius: 8px;
            transition: color 0.15s ease, background 0.15s ease;
            font-size: 1.05rem;
            line-height: 1;
            padding: 0;
        }
        .pwd-toggle-btn:hover {
            color: var(--text-main);
            background: #F5F5F5;
        }

        /* ========== 忘记密码链接 ========== */
        .forgot-link-row {
            display: flex;
            justify-content: flex-end;
            margin: -6px 0 12px;
        }

        .forgot-link {
            background: transparent;
            border: none;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            padding: 4px 2px;
            font-family: inherit;
            transition: color 0.15s ease;
            letter-spacing: 0.02em;
        }
        .forgot-link:hover { color: var(--duo-green); text-decoration: underline; }
        .forgot-link:disabled { opacity: 0.6; cursor: wait; }

        /* ========== 提交按钮 ========== */
        .btn-gold {
            width: 100%;
            padding: 0.95rem 1.2rem;
            background: var(--duo-green);
            color: #FFFFFF;
            font-weight: 800;
            font-size: 0.92rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--duo-green-dark);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
            margin-top: 8px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-gold:hover:not(:disabled) { filter: brightness(1.06); }

        .btn-gold:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        .btn-gold:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .btn-gold.loading::after {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: btnSpin 0.7s linear infinite;
        }

        @keyframes btnSpin {
            to { transform: rotate(360deg); }
        }

        /* ========== 消息提示 ========== */
        #auth-message {
            font-size: 0.85rem;
            margin-top: 16px;
            text-align: center;
            font-weight: 700;
            line-height: 1.5;
            min-height: 20px;
        }

        #auth-message.error { color: var(--duo-red); }
        #auth-message.success { color: var(--duo-green); }
        #auth-message.info { color: var(--duo-blue); }

        /* ========== 返回链接 ========== */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            text-decoration: none;
            transition: color 0.2s ease;
            justify-content: center;
            width: 100%;
        }

        .back-home:hover { color: var(--duo-green); }

        .back-home svg {
            width: 14px;
            height: 14px;
            transition: transform 0.2s ease;
        }

        .back-home:hover svg { transform: translateX(-3px); }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .auth-card {
                padding: 1.75rem 1.5rem 1.5rem;
                border-radius: 20px;
            }
            .logo-badge { width: 52px; height: 52px; border-radius: 16px; }
            .logo-badge svg { width: 28px; height: 28px; }
            .auth-title { font-size: 1.3rem; }
            .auth-subtitle { font-size: 0.85rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .glow-orb, #glow-background, .logo-badge { animation: none !important; }
        }
    </style>
</head>

<body>

    <!-- 背景层 -->
    <div id="glow-background" aria-hidden="true">
        <div class="glow-orb glow-orb--1"></div>
        <div class="glow-orb glow-orb--2"></div>
        <div class="glow-orb glow-orb--3"></div>
        <div class="glow-orb glow-orb--4"></div>
        <div class="glow-orb glow-orb--5"></div>
        <div class="glow-orb glow-orb--6"></div>
    </div>

    <!-- 登录卡片 -->
    <div class="auth-card">

        <!-- Logo -->
        <div class="logo-badge">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5"/>
            </svg>
        </div>

        <!-- 标题 -->
        <h2 class="auth-title">A-Level Guide</h2>
        <p class="auth-subtitle">登录后参与社区讨论、标记时间轴进度</p>

        <!-- 模式切换 -->
        <div class="mode-toggle">
            <button id="show-login-btn" class="auth-mode-btn active" type="button">登录</button>
            <button id="show-signup-btn" class="auth-mode-btn" type="button">注册</button>
        </div>

        <!-- 表单 -->
        <form id="auth-form" novalidate>
            <div class="form-field">
                <label class="form-label" for="auth-email">邮箱</label>
                <input type="email" id="auth-email" required autocomplete="email"
                       class="input-field" placeholder="you@example.com">
            </div>

            <div class="form-field">
                <label class="form-label" for="auth-password">密码</label>
                <div class="input-wrap">
                    <input type="password" id="auth-password" required minlength="6"
                           autocomplete="current-password"
                           class="input-field has-toggle" placeholder="至少 6 位密码">
                    <button type="button" id="toggle-password" class="pwd-toggle-btn"
                            aria-label="显示密码" title="显示密码">👁</button>
                </div>
            </div>

            <!-- 确认密码（仅注册模式显示） -->
            <div class="form-field" id="confirm-password-field" style="display:none;">
                <label class="form-label" for="auth-confirm-password">确认密码</label>
                <div class="input-wrap">
                    <input type="password" id="auth-confirm-password"
                           autocomplete="new-password"
                           class="input-field has-toggle" placeholder="再输入一次密码">
                    <button type="button" id="toggle-confirm-password" class="pwd-toggle-btn"
                            aria-label="显示密码" title="显示密码">👁</button>
                </div>
            </div>

            <!-- 忘记密码链接（仅登录模式显示） -->
            <div class="forgot-link-row" id="forgot-link-row">
                <button type="button" id="forgot-password-btn" class="forgot-link">忘记密码？</button>
            </div>

            <button type="submit" id="submit-btn" class="btn-gold">登录</button>
        </form>

        <p id="auth-message" role="status" aria-live="polite"></p>

        <a href="index.html" class="back-home">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
            </svg>
            返回首页
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // ⭐ 复用全局客户端（由 supabase-config.js 创建）
        const supabaseClient = window.supabaseClient;

        /* ============================================================
           ⭐ 安全重定向：只允许同源跳转，避免开放重定向漏洞
           ============================================================ */
        function getSafeRedirect() {
            const ref = document.referrer;
            if (!ref) return 'index.html';
            try {
                const url = new URL(ref);
                // 只允许同源
                if (url.origin === location.origin) {
                    const path = url.pathname + url.search + url.hash;
                    // 防止重定向回 login.html 自身造成循环
                    if (path.endsWith('login.html') || path.endsWith('/login')) {
                        return 'index.html';
                    }
                    return path || 'index.html';
                }
            } catch (_) { }
            return 'index.html';
        }

        /* ============================================================
           ⭐ 友好的错误信息映射
           ============================================================ */
        function friendlyAuthError(err) {
            const msg = (err && err.message ? err.message : '').toLowerCase();
            if (msg.includes('invalid login credentials')) return '邮箱或密码错误';
            if (msg.includes('email not confirmed')) return '邮箱尚未验证，请查收验证邮件（记得检查垃圾邮件）';
            if (msg.includes('user already registered')) return '该邮箱已注册，请直接登录';
            if (msg.includes('password should be at least')) return '密码至少需要 6 位';
            if (msg.includes('rate limit') || msg.includes('too many')) return '操作太频繁，请稍后再试';
            if (msg.includes('network') || msg.includes('fetch')) return '网络异常，请检查网络后重试';
            if (msg.includes('invalid email')) return '邮箱格式不正确';
            return '操作失败，请稍后重试';
        }

        /* ============================================================
           状态与元素
           ============================================================ */
        let mode = 'login';
        let submitting = false;

        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const confirmPasswordInput = document.getElementById('auth-confirm-password');
        const confirmPasswordField = document.getElementById('confirm-password-field');
        const forgotLinkRow = document.getElementById('forgot-link-row');
        const messageEl = document.getElementById('auth-message');
        const loginBtn = document.getElementById('show-login-btn');
        const signupBtn = document.getElementById('show-signup-btn');
        const submitBtn = document.getElementById('submit-btn');
        const togglePwdBtn = document.getElementById('toggle-password');
        const toggleConfirmBtn = document.getElementById('toggle-confirm-password');
        const forgotPwdBtn = document.getElementById('forgot-password-btn');

        /* ============================================================
           模式切换
           ============================================================ */
        loginBtn.addEventListener('click', () => {
            if (mode === 'login') return;
            mode = 'login';
            updateModeUI();
        });
        signupBtn.addEventListener('click', () => {
            if (mode === 'signup') return;
            mode = 'signup';
            updateModeUI();
        });

        function updateModeUI() {
            const isLogin = mode === 'login';

            loginBtn.classList.toggle('active', isLogin);
            signupBtn.classList.toggle('active', !isLogin);

            submitBtn.textContent = isLogin ? '登录' : '注册';

            // 确认密码字段只在注册模式显示
            confirmPasswordField.style.display = isLogin ? 'none' : 'block';
            if (isLogin) {
                confirmPasswordInput.value = '';
            }

            // 忘记密码链接只在登录模式显示
            forgotLinkRow.style.display = isLogin ? 'flex' : 'none';

            // 同步 autocomplete（浏览器自动填充体验）
            passwordInput.setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
            confirmPasswordInput.setAttribute('autocomplete', 'new-password');

            // 清空提示
            messageEl.textContent = '';
            messageEl.classList.remove('error', 'success', 'info');
        }

        /* ============================================================
           消息提示
           ============================================================ */
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.classList.remove('error', 'success', 'info');
            if (type) messageEl.classList.add(type);
        }

        /* ============================================================
           密码可见性切换
           ============================================================ */
        togglePwdBtn.addEventListener('click', () => {
            const isPwd = passwordInput.type === 'password';
            passwordInput.type = isPwd ? 'text' : 'password';
            togglePwdBtn.textContent = isPwd ? '🙈' : '👁';
            togglePwdBtn.setAttribute('aria-label', isPwd ? '隐藏密码' : '显示密码');
            togglePwdBtn.title = isPwd ? '隐藏密码' : '显示密码';
        });

        toggleConfirmBtn.addEventListener('click', () => {
            const isPwd = confirmPasswordInput.type === 'password';
            confirmPasswordInput.type = isPwd ? 'text' : 'password';
            toggleConfirmBtn.textContent = isPwd ? '🙈' : '👁';
            toggleConfirmBtn.setAttribute('aria-label', isPwd ? '隐藏密码' : '显示密码');
            toggleConfirmBtn.title = isPwd ? '隐藏密码' : '显示密码';
        });

        /* ============================================================
           邮箱格式校验
           ============================================================ */
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        /* ============================================================
           忘记密码
           ============================================================ */
        forgotPwdBtn.addEventListener('click', async () => {
            if (!supabaseClient) {
                showMessage('服务暂不可用，请稍后再试', 'error');
                return;
            }

            const email = emailInput.value.trim();
            if (!email || !EMAIL_RE.test(email)) {
                showMessage('请先在上方填写你的邮箱', 'error');
                emailInput.focus();
                return;
            }

            forgotPwdBtn.disabled = true;
            const originalText = forgotPwdBtn.textContent;
            forgotPwdBtn.textContent = '发送中...';

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: `${location.origin}/reset-password.html`
                });
                if (error) {
                    showMessage(friendlyAuthError(error), 'error');
                } else {
                    showMessage('密码重置链接已发送，请查收邮件（记得检查垃圾邮件）', 'success');
                }
            } catch (err) {
                showMessage(friendlyAuthError(err), 'error');
            } finally {
                forgotPwdBtn.disabled = false;
                forgotPwdBtn.textContent = originalText;
            }
        });

        /* ============================================================
           表单提交
           ============================================================ */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // ⭐ 提交节流，防止快速连点
            if (submitting) return;

            if (!supabaseClient) {
                showMessage('服务暂不可用，请稍后再试', 'error');
                return;
            }

            messageEl.textContent = '';
            messageEl.classList.remove('error', 'success', 'info');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // 前端校验
            if (!email) {
                showMessage('请输入邮箱', 'error');
                emailInput.focus();
                return;
            }
            if (!EMAIL_RE.test(email)) {
                showMessage('邮箱格式不正确', 'error');
                emailInput.focus();
                return;
            }
            if (!password) {
                showMessage('请输入密码', 'error');
                passwordInput.focus();
                return;
            }
            if (password.length < 6) {
                showMessage('密码至少需要 6 位', 'error');
                passwordInput.focus();
                return;
            }

            if (mode === 'signup') {
                const confirmPwd = confirmPasswordInput.value;
                if (password !== confirmPwd) {
                    showMessage('两次输入的密码不一致', 'error');
                    confirmPasswordInput.focus();
                    return;
                }
            }

            submitting = true;
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitBtn.textContent = mode === 'login' ? '登录中' : '注册中';

            try {
                if (mode === 'signup') {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { display_name: email.split('@')[0] }
                        }
                    });

                    if (error) {
                        showMessage(friendlyAuthError(error), 'error');
                    } else if (data.user && data.user.identities && data.user.identities.length === 0) {
                        // ⭐ 邮箱已存在：Supabase 不会报错，返回的 user.identities 为空
                        mode = 'login';
                        updateModeUI();
                        showMessage('该邮箱已注册，请直接登录或使用忘记密码', 'error');
                    } else if (data.user && !data.session) {
                        // 需要邮箱验证
                        showMessage('注册成功！验证邮件已发送，请前往邮箱确认（记得检查垃圾邮件）', 'success');
                    } else {
                        // 注册成功且直接登录
                        window.location.href = getSafeRedirect();
                    }
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                    if (error) {
                        showMessage(friendlyAuthError(error), 'error');
                    } else {
                        window.location.href = getSafeRedirect();
                    }
                }
            } catch (err) {
                showMessage(friendlyAuthError(err), 'error');
            } finally {
                submitting = false;
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                // ⭐ 根据当前 mode 恢复按钮文字，而不是恢复旧的 originalText
                submitBtn.textContent = mode === 'login' ? '登录' : '注册';
            }
        });

        /* ============================================================
           ⭐ 已登录用户自动跳转，避免重复登录
           ============================================================ */
        (async function checkAlreadyLoggedIn() {
            if (!supabaseClient) return;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    window.location.replace(getSafeRedirect());
                }
            } catch (_) { /* 忽略 */ }
        })();
    </script>
