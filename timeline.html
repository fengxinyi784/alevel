<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>升学时间轴 - A-Level Guide</title>
    <meta name="description" content="A-Level升学时间轴：纵向时间轴展示，关键节点一目了然，助你规划每一步。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        duo: {
                            green: '#58CC02', blue: '#1CB0F6', yellow: '#FFC800',
                            orange: '#FF9600', red: '#FF4B4B', purple: '#CE82FF',
                            pink: '#FF86D0', cyan: '#14D4F4',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <link rel="stylesheet" href="ai-assistant.css">

    <style>
        :root {
            --duo-green: #58CC02;
            --duo-green-dark: #58A700;
            --duo-green-soft: #F0F9E8;
            --duo-blue: #1CB0F6;
            --duo-blue-dark: #1899D6;
            --duo-orange: #FF9600;
            --duo-orange-dark: #E08600;
            --duo-purple: #CE82FF;
            --duo-purple-dark: #B36AE8;
            --duo-yellow: #FFC800;
            --duo-yellow-dark: #E0B000;

            --text-main: #3C3C3C;
            --text-sub: #777777;
            --text-faint: #AFAFAF;
            --border-soft: #E5E5E5;
            --bg-page: #F7F7F7;
            --bg-card: #FFFFFF;

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
            font-weight: 500;
        }

        ::selection {
            background: rgba(88, 204, 2, 0.25);
        }

        /* ========== 背景光斑 ========== */
        #glow-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFFFA 40%, #FFFFFF 70%, #F5FBFF 100%);
            background-size: 300% 300%;
            animation: pageGradient 24s ease-in-out infinite;
        }

        @keyframes pageGradient {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            will-change: transform;
        }

        .glow-orb--1 {
            width: 600px;
            height: 600px;
            top: -180px;
            left: -180px;
            background: radial-gradient(circle, rgba(88, 204, 2, 0.5) 0%, rgba(88, 204, 2, 0.15) 45%, transparent 72%);
            animation: flow1 28s ease-in-out infinite;
        }

        .glow-orb--2 {
            width: 560px;
            height: 560px;
            bottom: -200px;
            right: -160px;
            background: radial-gradient(circle, rgba(28, 176, 246, 0.5) 0%, rgba(28, 176, 246, 0.15) 45%, transparent 72%);
            animation: flow2 32s ease-in-out infinite;
            animation-delay: -8s;
        }

        .glow-orb--3 {
            width: 480px;
            height: 480px;
            top: 40%;
            right: -100px;
            background: radial-gradient(circle, rgba(206, 130, 255, 0.45) 0%, rgba(206, 130, 255, 0.12) 45%, transparent 72%);
            animation: flow3 34s ease-in-out infinite;
            animation-delay: -14s;
        }

        .glow-orb--4 {
            width: 460px;
            height: 460px;
            bottom: 10%;
            left: -100px;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.45) 0%, rgba(255, 200, 0, 0.12) 45%, transparent 72%);
            animation: flow4 30s ease-in-out infinite;
            animation-delay: -6s;
        }

        .glow-orb--5 {
            width: 400px;
            height: 400px;
            top: 20%;
            left: 45%;
            background: radial-gradient(circle, rgba(255, 134, 208, 0.4) 0%, rgba(255, 134, 208, 0.1) 45%, transparent 72%);
            animation: flow1 26s ease-in-out infinite;
            animation-delay: -3s;
        }

        .glow-orb--6 {
            width: 420px;
            height: 420px;
            bottom: 20%;
            right: 30%;
            background: radial-gradient(circle, rgba(20, 212, 244, 0.4) 0%, rgba(20, 212, 244, 0.1) 45%, transparent 72%);
            animation: flow2 30s ease-in-out infinite;
            animation-delay: -18s;
        }

        @keyframes flow1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(20vw, 15vh) scale(1.1);
            }

            50% {
                transform: translate(35vw, 38vh) scale(0.95);
            }

            75% {
                transform: translate(10vw, 50vh) scale(1.05);
            }
        }

        @keyframes flow2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            20% {
                transform: translate(-22vw, -12vh) scale(1.1);
            }

            50% {
                transform: translate(-42vw, -35vh) scale(0.92);
            }

            75% {
                transform: translate(-15vw, -48vh) scale(1.06);
            }
        }

        @keyframes flow3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(-18vw, 22vh) scale(1.12);
            }

            66% {
                transform: translate(-26vw, 48vh) scale(0.94);
            }
        }

        @keyframes flow4 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(18vw, -14vh) scale(1.08);
            }

            55% {
                transform: translate(32vw, 6vh) scale(0.94);
            }
        }

        #particles-layer {
            display: none !important;
        }

        /* ========== 导航栏浅色覆盖 ========== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            border-bottom: 2px solid var(--border-soft) !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
        }

        .nav-glass .text-white {
            color: var(--text-main) !important;
            text-shadow: none !important;
        }

        .nav-glass .nav-link {
            color: var(--text-sub) !important;
            font-weight: 700 !important;
        }

        .nav-glass .nav-link:hover {
            color: var(--duo-green) !important;
        }

        .nav-glass .nav-link.active {
            color: var(--duo-green) !important;
        }

        .nav-glass #mobile-menu-btn {
            border-color: var(--border-soft) !important;
        }

        .nav-glass #mobile-menu-btn svg {
            color: var(--text-main) !important;
        }

        #mobile-menu {
            background: #fff !important;
            border-top: 2px solid var(--border-soft);
        }

        #mobile-menu a {
            color: var(--text-main) !important;
            font-weight: 700 !important;
        }

        #mobile-menu a:hover,
        #mobile-menu a.nav-active {
            background: var(--duo-green-soft) !important;
            color: var(--duo-green) !important;
        }

        /* ========== 页面主区 ========== */
        main {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 64px - 82px);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 767px) {
            main {
                min-height: calc(100vh - 56px - 82px);
            }
        }

        .page-head {
            text-align: center;
            padding: 32px 16px 24px;
        }

        .page-head h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .page-head h1 .hl {
            color: var(--duo-green);
        }

        .page-head p {
            margin-top: 10px;
            font-size: 1rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* ========== 进度卡片 ========== */
        .progress-card {
            background: #fff;
            border: 2px solid var(--border-soft);
            border-bottom: 5px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 28px;
        }

        .progress-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .progress-count {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 700;
            margin-top: 3px;
        }

        .progress-percent {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--duo-green);
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .progress-track {
            background: #F0F0F0;
            border-radius: 999px;
            height: 14px;
            overflow: hidden;
            margin-top: 16px;
            border: 2px solid var(--border-soft);
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--duo-green), #8EE000);
            border-radius: 999px;
            height: 100%;
            width: 0;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 2px rgba(88, 204, 2, 0.15) inset;
        }

        .progress-groups {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        /* ---------- 分组按钮（可点击筛选） ---------- */
        .progress-group-item {
            position: relative;
            background: #FAFAFA;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition:
                transform .15s cubic-bezier(.34, 1.56, .64, 1),
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }

        .progress-group-item::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--g-accent, var(--duo-green));
            transform: scale(0);
            transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
        }

        .progress-group-item:hover {
            border-color: var(--g-accent, var(--duo-green));
            transform: translateY(-2px);
        }

        .progress-group-item:active {
            transform: translateY(1px) scale(.95);
            box-shadow: none;
        }

        .progress-group-item.active {
            background: color-mix(in srgb, var(--g-accent, var(--duo-green)) 10%, #fff);
            border-color: var(--g-accent, var(--duo-green));
            transform: translateY(-2px);
            box-shadow: 0 6px 14px -4px color-mix(in srgb, var(--g-accent, var(--duo-green)) 45%, transparent);
            animation: pgPop .45s cubic-bezier(.34, 1.56, .64, 1);
        }

        .progress-group-item.active::after {
            transform: scale(1);
        }

        .progress-group-item.active .pg-label,
        .progress-group-item.active .pg-value {
            color: var(--g-accent, var(--duo-green));
        }

        @keyframes pgPop {
            0% {
                transform: translateY(-2px) scale(1);
            }

            40% {
                transform: translateY(-2px) scale(1.08);
            }

            100% {
                transform: translateY(-2px) scale(1);
            }
        }

        .progress-group-item .pg-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 4px;
            transition: color .2s ease;
        }

        .progress-group-item .pg-value {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-main);
            transition: color .2s ease;
        }

        .progress-group-item.done .pg-value {
            color: var(--duo-green);
        }

        .progress-stage {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px dashed #EFEFEF;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .progress-stage .stage-text {
            color: var(--duo-green);
            font-weight: 900;
        }

        .progress-tip {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-faint);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .progress-login-hint {
            text-align: center;
            padding: 12px 0 4px;
        }

        .progress-login-hint p {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* ========== Duolingo 按压按钮 ========== */
        .btn-duo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--duo-green);
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--duo-green-dark);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
            user-select: none;
            text-decoration: none;
        }

        .btn-duo:hover {
            filter: brightness(1.06);
        }

        .btn-duo:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        /* ========== 时间轴分组 ========== */
        .tl-group {
            margin-bottom: 36px;
        }

        .tl-group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tl-group-badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            background: var(--accent);
            box-shadow: 0 3px 0 var(--accent-dark);
            letter-spacing: 0.02em;
        }

        .tl-group.enter .tl-group-badge {
            animation: badgePop .55s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        @keyframes badgePop {
            0% {
                transform: scale(.55) rotate(-8deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.12) rotate(3deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .tl-group-sub {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-sub);
        }

        .tl-group-count {
            margin-left: auto;
            font-size: 12px;
            font-weight: 900;
            color: var(--text-sub);
            padding: 5px 12px;
            background: #fff;
            border: 2px solid var(--border-soft);
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .tl-group-count.complete {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
        }

        .tl-group-body {
            position: relative;
        }

        .tl-group-body::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 44px;
            bottom: 44px;
            width: 2px;
            background: var(--accent);
            opacity: 0.25;
            border-radius: 2px;
        }

        /* ========== 时间轴节点 ========== */
        .tl-node {
            display: flex;
            gap: 18px;
            align-items: flex-start;
            padding-bottom: 16px;
            position: relative;
        }

        .tl-node.enter {
            animation: nodeEnter .5s cubic-bezier(.16, 1, .3, 1) both;
        }

        @keyframes nodeEnter {
            from {
                opacity: 0;
                transform: translateY(22px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tl-node:last-child {
            padding-bottom: 0;
        }

        .tl-marker {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 26px;
            position: relative;
            z-index: 1;
        }

        .tl-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 0 3px #fff;
        }

        .tl-dot svg {
            width: 14px;
            height: 14px;
            color: #fff;
            display: none;
        }

        .tl-node.done .tl-dot {
            background: var(--duo-green);
            border-color: var(--duo-green);
            transform: scale(1);
        }

        .tl-node.done .tl-dot svg {
            display: block;
        }

        .tl-node.current .tl-dot {
            background: var(--accent);
            border-color: var(--accent);
            animation: tl-pulse 2s ease-out infinite;
        }

        @keyframes tl-pulse {
            0% {
                box-shadow: 0 0 0 3px #fff, 0 0 0 3px var(--accent);
            }

            50% {
                box-shadow: 0 0 0 3px #fff, 0 0 0 12px transparent;
            }

            100% {
                box-shadow: 0 0 0 3px #fff, 0 0 0 3px var(--accent);
            }
        }

        /* ========== 节点卡片 ========== */
        .tl-card {
            flex: 1;
            min-width: 0;
            background: #fff;
            border: 2px solid var(--border-soft);
            border-bottom: 4px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 18px 20px 16px;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.12s ease;
            position: relative;
        }

        .tl-card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }

        .tl-card:active {
            transform: translateY(1px);
            border-bottom-width: 2px;
        }

        .tl-card::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 16px;
            bottom: 16px;
            width: 4px;
            border-radius: 2px;
            background: var(--accent);
            opacity: 0.6;
        }

        .tl-node.done .tl-card {
            background: #FAFFFA;
            border-color: rgba(88, 204, 2, 0.35);
        }

        .tl-node.done .tl-card::before {
            background: var(--duo-green);
            opacity: 1;
        }

        .tl-node.current .tl-card {
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        .tl-time {
            font-size: 11px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .tl-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.35;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }

        .tl-node.done .tl-title {
            color: #58A700;
        }

        .tl-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tl-tag {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .tl-tag.tag-important {
            background: #FFF4E6;
            color: #E08600;
            border: 1.5px solid rgba(255, 150, 0, 0.3);
        }

        .tl-tag.tag-exam {
            background: #E6F6FE;
            color: #1899D6;
            border: 1.5px solid rgba(28, 176, 246, 0.3);
        }

        .tl-tag.tag-application {
            background: #F9EFFF;
            color: #B36AE8;
            border: 1.5px solid rgba(206, 130, 255, 0.3);
        }

        .tl-tag.tag-preparation {
            background: #F0F9E8;
            color: #58A700;
            border: 1.5px solid rgba(88, 204, 2, 0.3);
        }

        .tl-summary {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-sub);
            font-weight: 500;
        }

        .tl-card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .tl-btn-complete {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            border: 2px solid var(--border-soft);
            background: #fff;
            color: var(--text-sub);
            transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
            box-shadow: 0 2px 0 var(--border-soft);
            font-family: inherit;
        }

        .tl-btn-complete:hover {
            border-color: var(--duo-green);
            color: var(--duo-green);
        }

        .tl-btn-complete:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 var(--border-soft);
        }

        .tl-btn-complete.done {
            background: var(--duo-green);
            border-color: var(--duo-green);
            color: #fff;
            box-shadow: 0 2px 0 var(--duo-green-dark);
        }

        .tl-btn-complete.done:hover {
            filter: brightness(1.06);
            color: #fff;
        }

        .tl-btn-complete.pending {
            opacity: 0.6;
            cursor: wait;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-panel {
            background: #fff;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            width: 100%;
            max-width: 520px;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15);
            max-height: 80vh;
            overflow-y: auto;
            outline: none;
        }

        .modal-overlay.open .modal-panel {
            transform: translateY(0) scale(1);
        }

        .modal-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #F5F5F5;
            border: 2px solid var(--border-soft);
            color: var(--text-sub);
            font-size: 1.4rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .modal-close-btn:hover {
            background: var(--duo-green-soft);
            border-color: var(--duo-green);
            color: var(--duo-green);
        }

        .modal-close-btn:focus-visible {
            outline: 3px solid rgba(88, 204, 2, 0.5);
            outline-offset: 2px;
        }

        /* ========== 骨架屏 ========== */
        .skeleton {
            background: linear-gradient(90deg, #F0F0F0 25%, #E5E5E5 50%, #F0F0F0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* ========== 页脚 ========== */
        footer {
            position: relative;
            z-index: 1;
            padding: 30px 16px;
            text-align: center;
            border-top: 2px solid var(--border-soft);
            background: #fff;
            color: var(--text-faint);
            font-size: 13px;
            font-weight: 600;
            margin-top: auto;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .page-head {
                padding: 20px 16px 18px;
            }

            .progress-card {
                padding: 18px;
            }

            .progress-percent {
                font-size: 2rem;
            }

            .progress-groups {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .tl-group-badge {
                font-size: 12px;
                padding: 6px 12px;
            }

            .tl-group-sub {
                font-size: 13px;
            }

            .tl-group-count {
                font-size: 11px;
                padding: 4px 10px;
            }

            .tl-node {
                gap: 12px;
            }

            .tl-marker {
                width: 26px;
                height: 26px;
                margin-top: 22px;
            }

            .tl-dot {
                width: 22px;
                height: 22px;
                border-width: 3px;
            }

            .tl-dot svg {
                width: 12px;
                height: 12px;
            }

            .tl-group-body::before {
                left: 12px;
            }

            .tl-card {
                padding: 14px 16px 12px;
            }

            .tl-title {
                font-size: 0.98rem;
            }

            .tl-summary {
                font-size: 0.8rem;
            }

            .btn-duo {
                padding: 10px 20px;
                font-size: 13px;
            }

            .modal-panel {
                padding: 1.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .glow-orb,
            #glow-background {
                animation: none !important;
            }

            .tl-node.current .tl-dot {
                animation: none !important;
            }

            .tl-node.enter,
            .tl-group.enter .tl-group-badge,
            .progress-group-item.active {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- 页面主区 -->
    <main>

    <!-- 详情模态框 -->
    <div id="detail-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-panel" id="modal-panel" tabindex="-1">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // ⭐ 复用全局客户端（由 supabase-config.js 创建）
        const supabaseTimeline = window.supabaseClient;

        let currentUser = null;
        let completedNodes = new Set();
        let activeFilter = null;

        /* ============================================================
           ⭐ duo* 函数存在性保护
           ============================================================ */
        async function requireLogin(type) {
            if (typeof window.duoRequireLogin === 'function') {
                try { return await window.duoRequireLogin(type); }
                catch (_) { return true; }
            }
            return true;
        }

        function showError(message, title = '出错了') {
            if (typeof window.duoAlert === 'function') {
                try { window.duoAlert(message, { type: 'error', title }); return; } catch (_) { }
            }
            alert(message);
        }

        /* ============================================================
           分组配置（只保留展示信息，节点通过 group 字段关联）
           ============================================================ */
        const GROUPS = [
            { id: 'y12', badge: 'Year 12', sub: '打基础', color: '#1CB0F6', dark: '#1899D6' },
            { id: 'apply', badge: '申请季', sub: '递交材料', color: '#FF9600', dark: '#E08600' },
            { id: 'y13', badge: '放榜季', sub: '结果与行前', color: '#58CC02', dark: '#58A700' }
        ];

        /* ============================================================
           时间轴数据（每个节点带 group 字段）
           ============================================================ */
        const timelineData = [
            { id: 1, group: 'y12', time: 'Year 12 · 9月', title: '确定A-Level科目组合', summary: '结合专业方向选 3-4 门课', tags: [{ text: '选课', class: 'tag-important' }, { text: '规划', class: 'tag-preparation' }], details: '与老师、学长学姐充分沟通，确保科目组合符合目标院校要求。常见的组合是数学 + 进阶数学 + 物理/化学/经济，但要根据目标专业做调整。', link: 'strategy.html', linkText: '查看交流社区' },
            { id: 2, group: 'y12', time: 'Year 12 · 10月', title: '开始AS课程学习', summary: '适应节奏，制定计划', tags: [{ text: '学习', class: 'tag-preparation' }], details: '扎实掌握 AS 基础，同时积累个人陈述素材。建议建立错题本和公式手册，为后续复习做准备。', link: '#', linkText: '' },
            { id: 3, group: 'y12', time: 'Year 12 · 1月', title: 'AS模拟考试', summary: '检验成果，调整策略', tags: [{ text: '考试', class: 'tag-exam' }], details: '分析薄弱环节，调整下半学期学习重点。模考成绩不能决定一切，但能帮你发现知识盲区。', link: '#', linkText: '' },
            { id: 4, group: 'y12', time: 'Year 12 · 5-6月', title: 'AS正式考试', summary: '全力备考，保持心态', tags: [{ text: '考试', class: 'tag-exam' }, { text: '重要', class: 'tag-important' }], details: 'AS 成绩影响预测成绩。注意历年真题，合理安排复习。CAIE 一年有 2-3 次考试机会，5-6 月是最主要的一次。', link: '#', linkText: '' },
            { id: 5, group: 'y12', time: 'Year 12 · 暑假', title: '背景提升', summary: '夏校/实习/科研', tags: [{ text: '提升', class: 'tag-preparation' }], details: '参加高质量活动，丰富个人陈述素材。可以选择与目标专业相关的夏校、线上课程、科研项目或志愿者工作。', link: '#', linkText: '' },
            { id: 6, group: 'apply', time: 'Year 13 · 9月', title: 'UCAS开放注册', summary: '填写申请，选志愿', tags: [{ text: '申请', class: 'tag-application' }, { text: '重要', class: 'tag-important' }], details: '确定 5 个志愿，牛津剑桥只能二选一。注意第五志愿是保底选择，要选一个录取要求明显低于前四的学校。', link: 'universities.html', linkText: '浏览热门院校' },
            { id: 7, group: 'apply', time: 'Year 13 · 10月15日', title: '牛剑及医学类申请截止', summary: '提交UCAS+入学考试', tags: [{ text: '截止', class: 'tag-important' }], details: '完成 BMAT、LNAT、MAT 等入学考试。牛津剑桥的申请截止日固定在 10 月 15 日，比大部分学校早 3 个月。', link: '#', linkText: '' },
            { id: 8, group: 'apply', time: 'Year 13 · 1月15日', title: '大部分本科申请截止', summary: '常规申请截止', tags: [{ text: '截止', class: 'tag-important' }], details: '确保所有材料已上传且信息准确。这是大部分学校（非牛剑）的申请截止日，错过只能等下一年。', link: '#', linkText: '' },
            { id: 9, group: 'apply', time: 'Year 13 · 2-5月', title: '大学面试/附加考试', summary: '准备面试与加试', tags: [{ text: '面试', class: 'tag-preparation' }], details: '了解面试形式，进行模拟练习。牛剑面试通常在 12 月，其他学校的面试可能持续到 4 月。', link: '#', linkText: '' },
            { id: 10, group: 'apply', time: 'Year 13 · 5月', title: '回复Offer', summary: '确定Firm/Insurance', tags: [{ text: '决策', class: 'tag-important' }], details: '仔细比较 Offer 条件，结合自身情况选择。Firm 是第一志愿，Insurance 是保底，两者的条件都要看清。', link: '#', linkText: '' },
            { id: 11, group: 'y13', time: 'Year 13 · 8月', title: 'A-Level放榜', summary: '确认录取状态', tags: [{ text: '成绩', class: 'tag-exam' }, { text: '关键', class: 'tag-important' }], details: '若未达 Firm 但达 Insurance 会自动进入；否则可走 Clearing。放榜日通常在 8 月中旬，记得关注邮件。', link: '#', linkText: '' },
            { id: 12, group: 'y13', time: '8-9月', title: '行前准备', summary: '签证/住宿/机票', tags: [{ text: '行前', class: 'tag-preparation' }], details: '尽早申请签证，关注大学新生指南。Tier 4 学生签证通常需要 3 周审批，建议 7 月就开始准备。', link: '#', linkText: '' }
        ];

        /* ============================================================
           工具函数
           ============================================================ */
        function groupNodes(groupId) {
            return timelineData.filter(n => n.group === groupId);
        }

        function countGroupDone(groupId) {
            return groupNodes(groupId).filter(n => completedNodes.has(n.id)).length;
        }

        /* ============================================================
           骨架屏
           ============================================================ */
        function showSkeleton() {
            const progressSection = document.getElementById('progress-section');
            const container = document.getElementById('timeline-container');

            progressSection.innerHTML = `
                <div class="progress-card">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="skeleton" style="width:120px;height:20px;margin-bottom:8px;"></div>
                            <div class="skeleton" style="width:180px;height:14px;"></div>
                        </div>
                        <div class="skeleton" style="width:70px;height:40px;"></div>
                    </div>
                    <div class="skeleton" style="width:100%;height:14px;margin-top:16px;border-radius:999px;"></div>
                    <div class="progress-groups">
                        ${GROUPS.map(() => `<div class="skeleton" style="height:56px;"></div>`).join('')}
                    </div>
                </div>`;

            let html = '';
            GROUPS.forEach((group) => {
                html += `<div class="tl-group">
                    <div class="tl-group-header">
                        <div class="skeleton" style="width:100px;height:32px;border-radius:999px;"></div>
                        <div class="skeleton" style="width:60px;height:16px;"></div>
                    </div>
                    <div class="tl-group-body">
                        ${[1, 2].map(() => `
                            <div class="tl-node">
                                <div class="tl-marker"><div class="tl-dot" style="border-color:#E5E5E5;"></div></div>
                                <div class="tl-card" style="cursor:default;">
                                    <div class="skeleton" style="width:80px;height:12px;margin-bottom:8px;"></div>
                                    <div class="skeleton" style="width:70%;height:18px;margin-bottom:10px;"></div>
                                    <div class="skeleton" style="width:100%;height:14px;"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        /* ============================================================
           渲染进度概览
           ============================================================ */
        function renderProgress() {
            const section = document.getElementById('progress-section');
            if (!section) return;

            if (!currentUser) {
                section.innerHTML = `
                    <div class="progress-card">
                        <div class="progress-login-hint">
                            <p>登录后即可标记节点完成，实时追踪你的升学进度</p>
                            <a href="login.html" class="btn-duo">前往登录</a>
                        </div>
                    </div>`;
                return;
            }

            const total = timelineData.length;
            const done = completedNodes.size;
            const pct = Math.round(done / total * 100);

            const firstIncomplete = timelineData.find(n => !completedNodes.has(n.id));
            const stageText = firstIncomplete
                ? `${firstIncomplete.time} · ${firstIncomplete.title}`
                : '全部节点已完成，太棒了！';

            section.innerHTML = `
                <div class="progress-card">
                    <div class="flex items-start justify-between gap-4">
                        <div>
                            <div class="progress-title">我的进度</div>
                            <div class="progress-count" id="progress-count-text">已完成 ${done} / ${total} 个关键节点</div>
                        </div>
                        <div class="progress-percent" id="progress-percent-text">${pct}<span style="font-size:1.2rem;">%</span></div>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill-bar" style="width:${pct}%"></div>
                    </div>
                    <div class="progress-groups">
                        ${GROUPS.map(g => {
                            const gTotal = groupNodes(g.id).length;
                            const gDone = countGroupDone(g.id);
                            const complete = gDone === gTotal && gTotal > 0;
                            const isActive = activeFilter === g.id;
                            return `
                                <div class="progress-group-item ${complete ? 'done' : ''} ${isActive ? 'active' : ''}"
                                     data-group-id="${g.id}"
                                     role="button"
                                     tabindex="0"
                                     aria-pressed="${isActive}"
                                     title="点击筛选：${g.badge}"
                                     style="--g-accent:${g.color};">
                                    <span class="pg-label">${g.badge}</span>
                                    <div class="pg-value" data-group-value="${g.id}">${gDone} / ${gTotal}</div>
                                </div>`;
                        }).join('')}
                    </div>
                    <div class="progress-stage">
                        当前阶段：<span class="stage-text" id="progress-stage-text">${stageText}</span>
                    </div>
                    <div class="progress-tip">
                        点击上方分组卡片可筛选下方时间轴，再点一次恢复全部
                    </div>
                </div>`;
        }

        /* ============================================================
           ⭐ 局部更新：只更新进度卡片的数字、进度条、分组标签
              不重建整个 progress-section，避免闪烁
           ============================================================ */
        function updateProgressNumbers() {
            if (!currentUser) return;
            const section = document.getElementById('progress-section');
            if (!section) return;

            const total = timelineData.length;
            const done = completedNodes.size;
            const pct = Math.round(done / total * 100);

            const countText = document.getElementById('progress-count-text');
            if (countText) countText.textContent = `已完成 ${done} / ${total} 个关键节点`;

            const percentText = document.getElementById('progress-percent-text');
            if (percentText) percentText.innerHTML = `${pct}<span style="font-size:1.2rem;">%</span>`;

            const fillBar = document.getElementById('progress-fill-bar');
            if (fillBar) fillBar.style.width = pct + '%';

            GROUPS.forEach(g => {
                const gTotal = groupNodes(g.id).length;
                const gDone = countGroupDone(g.id);
                const complete = gDone === gTotal && gTotal > 0;

                const valueEl = section.querySelector(`[data-group-value="${g.id}"]`);
                if (valueEl) valueEl.textContent = `${gDone} / ${gTotal}`;

                const itemEl = section.querySelector(`.progress-group-item[data-group-id="${g.id}"]`);
                if (itemEl) itemEl.classList.toggle('done', complete);
            });

            const firstIncomplete = timelineData.find(n => !completedNodes.has(n.id));
            const stageText = firstIncomplete
                ? `${firstIncomplete.time} · ${firstIncomplete.title}`
                : '全部节点已完成，太棒了！';
            const stageEl = document.getElementById('progress-stage-text');
            if (stageEl) stageEl.textContent = stageText;
        }

        /* ============================================================
           渲染时间轴
           ============================================================ */
        function renderTimeline(opts = {}) {
            const animate = opts.animate !== false;
            const container = document.getElementById('timeline-container');
            if (!container) return;

            const firstIncomplete = timelineData.find(n => !completedNodes.has(n.id));
            const currentId = firstIncomplete ? firstIncomplete.id : null;

            const groupsToRender = activeFilter
                ? GROUPS.filter(g => g.id === activeFilter)
                : GROUPS;

            let html = '';
            groupsToRender.forEach((group) => {
                const nodes = groupNodes(group.id);
                const groupDone = countGroupDone(group.id);
                const allDone = groupDone === nodes.length && nodes.length > 0;

                html += `
                <section class="tl-group${animate ? ' enter' : ''}"
                         data-group="${group.id}"
                         style="--accent:${group.color};--accent-dark:${group.dark};">
                    <header class="tl-group-header">
                        <span class="tl-group-badge">${group.badge}</span>
                        <span class="tl-group-sub">${group.sub}</span>
                        <span class="tl-group-count ${allDone ? 'complete' : ''}"
                              data-group-count="${group.id}">${groupDone} / ${nodes.length}</span>
                    </header>
                    <div class="tl-group-body">
                        ${nodes.map((node, ni) =>
                            renderNode(node, currentId, animate ? ni : -1)
                        ).join('')}
                    </div>
                </section>`;
            });

            container.innerHTML = html;
        }

        function renderNode(node, currentId, animIndex = -1) {
            const isDone = completedNodes.has(node.id);
            const isCurrent = node.id === currentId && !isDone;
            const animate = animIndex >= 0;

            const cls = `tl-node${isDone ? ' done' : ''}${isCurrent ? ' current' : ''}${animate ? ' enter' : ''}`;
            const delayStyle = animate ? ` style="animation-delay:${animIndex * 70}ms"` : '';

            return `
            <div class="${cls}" data-id="${node.id}"${delayStyle}>
                <div class="tl-marker">
                    <div class="tl-dot">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                </div>
                <div class="tl-card" data-action="open-detail" data-node-id="${node.id}">
                    <div class="tl-time">${node.time}</div>
                    <h3 class="tl-title">${node.title}</h3>
                    <div class="tl-tags">
                        ${node.tags.map(t => `<span class="tl-tag ${t.class}">${t.text}</span>`).join('')}
                    </div>
                    <p class="tl-summary">${node.summary}</p>
                    <div class="tl-card-footer">
                        <button class="tl-btn-complete${isDone ? ' done' : ''}"
                                data-action="toggle-complete"
                                data-node-id="${node.id}">
                            ${isDone ? '✓ 已完成' : '标记完成'}
                        </button>
                    </div>
                </div>
            </div>`;
        }

        /* ============================================================
           ⭐ 局部更新单个节点（不重建整个时间轴）
           ============================================================ */
        function updateNodeUI(nodeId) {
            const nodeEl = document.querySelector(`.tl-node[data-id="${nodeId}"]`);
            if (!nodeEl) return;

            const isDone = completedNodes.has(nodeId);
            nodeEl.classList.toggle('done', isDone);

            // 更新当前节点脉冲（重新计算 current）
            const firstIncomplete = timelineData.find(n => !completedNodes.has(n.id));
            const currentId = firstIncomplete ? firstIncomplete.id : null;
            document.querySelectorAll('.tl-node.current').forEach(el => {
                if (Number(el.dataset.id) !== currentId) el.classList.remove('current');
            });
            if (currentId !== null) {
                const curEl = document.querySelector(`.tl-node[data-id="${currentId}"]`);
                if (curEl && !completedNodes.has(currentId)) curEl.classList.add('current');
            }

            // 更新按钮
            const btn = nodeEl.querySelector('.tl-btn-complete');
            if (btn) {
                btn.classList.toggle('done', isDone);
                btn.textContent = isDone ? '✓ 已完成' : '标记完成';
            }

            // 更新所在分组的计数
            const groupId = timelineData.find(n => n.id === nodeId)?.group;
            if (groupId) {
                const nodes = groupNodes(groupId);
                const gDone = countGroupDone(groupId);
                const countEl = document.querySelector(`[data-group-count="${groupId}"]`);
                if (countEl) {
                    countEl.textContent = `${gDone} / ${nodes.length}`;
                    countEl.classList.toggle('complete', gDone === nodes.length && nodes.length > 0);
                }
            }
        }

        /* ============================================================
           加载用户进度
           ============================================================ */
        async function loadUserProgress() {
            if (!currentUser) return;
            const { data, error } = await supabaseTimeline
                .from('timeline_progress')
                .select('node_id')
                .eq('user_id', currentUser.id);
            if (!error && data) {
                completedNodes = new Set(data.map(p => p.node_id));
            }
        }

        /* ============================================================
           ⭐ 切换完成状态：
             · 双击防抖（pendingToggles）
             · 乐观更新 + 失败回滚
             · 局部更新 DOM
           ============================================================ */
        const pendingToggles = new Set();

        async function toggleComplete(nodeId) {
            if (!currentUser) {
                const go = await requireLogin('timeline');
                if (go) window.location.href = 'login.html';
                return;
            }
            if (pendingToggles.has(nodeId)) return;
            pendingToggles.add(nodeId);

            const nodeEl = document.querySelector(`.tl-node[data-id="${nodeId}"]`);
            const btn = nodeEl?.querySelector('.tl-btn-complete');
            if (btn) btn.classList.add('pending');

            const wasDone = completedNodes.has(nodeId);

            // 乐观更新
            if (wasDone) completedNodes.delete(nodeId);
            else completedNodes.add(nodeId);
            updateNodeUI(nodeId);
            updateProgressNumbers();

            try {
                if (wasDone) {
                    const { error } = await supabaseTimeline
                        .from('timeline_progress')
                        .delete()
                        .eq('user_id', currentUser.id)
                        .eq('node_id', nodeId);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseTimeline
                        .from('timeline_progress')
                        .insert([{ user_id: currentUser.id, node_id: nodeId, completed: true }]);
                    if (error) throw error;
                }
            } catch (err) {
                console.warn('保存进度失败，已回滚：', err);
                if (wasDone) completedNodes.add(nodeId);
                else completedNodes.delete(nodeId);
                updateNodeUI(nodeId);
                updateProgressNumbers();
                showError('保存失败：' + err.message, '保存失败');
            } finally {
                pendingToggles.delete(nodeId);
                if (btn) btn.classList.remove('pending');
            }
        }

        /* ============================================================
           分组筛选
           ============================================================ */
        function applyGroupFilter(groupId) {
            activeFilter = (activeFilter === groupId) ? null : groupId;
            renderProgress();
            renderTimeline({ animate: true });

            const container = document.getElementById('timeline-container');
            if (container) {
                const y = container.getBoundingClientRect().top + window.pageYOffset - 90;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        (function bindProgressFilters() {
            const section = document.getElementById('progress-section');
            if (!section) return;

            section.addEventListener('click', (e) => {
                const item = e.target.closest('.progress-group-item');
                if (!item) return;
                const gid = item.getAttribute('data-group-id');
                if (gid) applyGroupFilter(gid);
            });

            section.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                const item = e.target.closest('.progress-group-item');
                if (!item) return;
                e.preventDefault();
                const gid = item.getAttribute('data-group-id');
                if (gid) applyGroupFilter(gid);
            });
        })();

        /* ============================================================
           ⭐ 时间轴事件委托（替代内联 onclick）
           ============================================================ */
        (function bindTimelineEvents() {
            const container = document.getElementById('timeline-container');
            if (!container) return;

            container.addEventListener('click', (e) => {
                const toggleBtn = e.target.closest('[data-action="toggle-complete"]');
                if (toggleBtn) {
                    e.stopPropagation();
                    const nodeId = Number(toggleBtn.dataset.nodeId);
                    if (!isNaN(nodeId)) toggleComplete(nodeId);
                    return;
                }
                const card = e.target.closest('[data-action="open-detail"]');
                if (card) {
                    const nodeId = Number(card.dataset.nodeId);
                    if (!isNaN(nodeId)) openDetail(nodeId);
                }
            });
        })();

        /* ============================================================
           ⭐ 详情模态框（含焦点管理和遮罩误触修复）
           ============================================================ */
        const modalEl = document.getElementById('detail-modal');
        const modalPanel = document.getElementById('modal-panel');
        let lastFocusedBeforeModal = null;
        let bodyOverflowBefore = '';
        let overlayMouseDownTarget = null;

        function openDetail(id) {
            const node = timelineData.find(n => n.id === id);
            if (!node) return;

            document.getElementById('modal-title').textContent = node.title;
            document.getElementById('modal-time').textContent = node.time;
            document.getElementById('modal-tags').innerHTML = node.tags.map(t =>
                `<span class="tl-tag ${t.class}">${t.text}</span>`
            ).join('');
            document.getElementById('modal-details').textContent = node.details;
            document.getElementById('modal-link').innerHTML = (node.link && node.link !== '#')
                ? `<a href="${node.link}" class="btn-duo" style="text-decoration:none;">${node.linkText} →</a>`
                : '';

            lastFocusedBeforeModal = document.activeElement;
            bodyOverflowBefore = document.body.style.overflow;

            modalEl.classList.add('open');
            document.body.style.overflow = 'hidden';

            // 等动画开始时把焦点移入弹窗
            requestAnimationFrame(() => {
                document.getElementById('modal-close').focus();
            });
        }

        function closeDetail() {
            modalEl.classList.remove('open');
            document.body.style.overflow = bodyOverflowBefore;

            if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === 'function') {
                lastFocusedBeforeModal.focus();
            }
            lastFocusedBeforeModal = null;
        }

        document.getElementById('modal-close').addEventListener('click', closeDetail);

        /* 遮罩误触修复：mousedown 和 mouseup 都落在遮罩上才关闭 */
        modalEl.addEventListener('mousedown', (e) => { overlayMouseDownTarget = e.target; });
        modalEl.addEventListener('mouseup', (e) => {
            if (e.target === modalEl && overlayMouseDownTarget === modalEl) {
                closeDetail();
            }
            overlayMouseDownTarget = null;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalEl.classList.contains('open')) {
                closeDetail();
            }
        });

        /* Tab 键陷阱：焦点限制在弹窗内 */
        modalEl.addEventListener('keydown', (e) => {
            if (e.key !== 'Tab') return;
            const focusables = modalPanel.querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            );
            if (!focusables.length) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        });

        /* ============================================================
           初始化
           ============================================================ */
        async function init() {
            showSkeleton();

            // ⭐ 复用全局客户端，仍需检查是否加载成功
            if (!supabaseTimeline) {
                console.error('Supabase 客户端未初始化，请检查 supabase-config.js');
                renderProgress();
                renderTimeline({ animate: true });
                return;
            }

            const { data: { user } } = await supabaseTimeline.auth.getUser();
            currentUser = user;
            if (user) {
                await loadUserProgress();
            }

            renderProgress();
            renderTimeline({ animate: true });
        }

        init();
    </script>

    <script src="nav.js"></script>
    <script src="ai-assistant.js"></script>
