<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 - A-Level Guide</title>
    <meta name="description" content="为A-Level学生和家长提供专业的科目指南、交流社区与升学时间轴规划，助力英国名校申请。" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        duo: {
                            green: '#58CC02', blue: '#1CB0F6', yellow: '#FFC800',
                            orange: '#FF9600', red: '#FF4B4B', purple: '#CE82FF',
                            pink: '#FF86D0', cyan: '#14D4F4',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="ai-assistant.css">

    <style>
        :root {
            --duo-green: #58CC02;
            --duo-green-dark: #58A700;
            --duo-blue: #1CB0F6;
            --duo-yellow: #FFC800;
            --duo-orange: #FF9600;
            --duo-purple: #CE82FF;

            --text-main: #3C3C3C;
            --text-sub: #777777;
            --text-faint: #AFAFAF;
            --border-soft: #E5E5E5;
            --bg-page: #F7F7F7;

            --nav-h: 64px;
        }

        /* ========== 全局 ========== */
        body {
            background-color: var(--bg-page) !important;
            color: var(--text-main) !important;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important;
            font-weight: 500;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        ::selection { background: rgba(88, 204, 2, 0.25); }

        /* ========== 流动光晕背景 ========== */
        #glow-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFFFA 40%, #FFFFFF 70%, #F5FBFF 100%);
            background-size: 300% 300%;
            animation: pageGradient 24s ease-in-out infinite;
        }

        @keyframes pageGradient {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(72px);
            opacity: 0.9;
            mix-blend-mode: normal;
            will-change: transform, opacity;
        }

        .glow-orb--1 {
            width: 700px; height: 700px;
            background: radial-gradient(circle at 40% 40%,
                rgba(88, 204, 2, 0.95) 0%, rgba(88, 204, 2, 0.75) 38%,
                rgba(88, 204, 2, 0.35) 65%, rgba(88, 204, 2, 0.12) 80%, transparent 92%);
            top: -200px; left: -200px;
            animation: flow1 26s ease-in-out infinite;
        }
        @keyframes flow1 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
            25%      { transform: translate(10vw, 6vh) scale(1.08); opacity: 1; }
            55%      { transform: translate(4vw, 15vh) scale(0.94); opacity: 0.85; }
            80%      { transform: translate(14vw, 4vh) scale(1.05); opacity: 0.95; }
        }

        .glow-orb--2 {
            width: 660px; height: 660px;
            background: radial-gradient(circle at 60% 60%,
                rgba(28, 176, 246, 0.95) 0%, rgba(28, 176, 246, 0.75) 38%,
                rgba(28, 176, 246, 0.35) 65%, rgba(28, 176, 246, 0.12) 80%, transparent 92%);
            bottom: -220px; right: -180px;
            animation: flow2 30s ease-in-out infinite;
            animation-delay: -6s;
        }
        @keyframes flow2 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
            20%      { transform: translate(-12vw, -8vh) scale(1.1); opacity: 1; }
            50%      { transform: translate(-5vw, -16vh) scale(0.94); opacity: 0.85; }
            75%      { transform: translate(-15vw, -4vh) scale(1.06); opacity: 1; }
        }

        .glow-orb--3 {
            width: 600px; height: 600px;
            background: radial-gradient(circle at 40% 60%,
                rgba(206, 130, 255, 0.95) 0%, rgba(206, 130, 255, 0.72) 38%,
                rgba(206, 130, 255, 0.34) 65%, rgba(206, 130, 255, 0.12) 80%, transparent 92%);
            top: -140px; right: -140px;
            animation: flow3 34s ease-in-out infinite;
            animation-delay: -12s;
        }
        @keyframes flow3 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
            30%      { transform: translate(-9vw, 12vh) scale(1.1); opacity: 1; }
            60%      { transform: translate(-16vw, 5vh) scale(0.95); opacity: 0.85; }
            85%      { transform: translate(-4vw, 16vh) scale(1.05); opacity: 0.95; }
        }

        .glow-orb--4 {
            width: 560px; height: 560px;
            background: radial-gradient(circle at 50% 50%,
                rgba(255, 200, 0, 0.95) 0%, rgba(255, 200, 0, 0.72) 38%,
                rgba(255, 200, 0, 0.34) 65%, rgba(255, 200, 0, 0.12) 80%, transparent 92%);
            top: 35%; left: -120px;
            animation: flow4 28s ease-in-out infinite;
            animation-delay: -4s;
        }
        @keyframes flow4 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
            25%      { transform: translate(9vw, -14vh) scale(1.12); opacity: 1; }
            55%      { transform: translate(15vw, -3vh) scale(0.94); opacity: 0.85; }
            80%      { transform: translate(4vw, 11vh) scale(1.06); opacity: 0.95; }
        }

        .glow-orb--5 {
            width: 520px; height: 520px;
            background: radial-gradient(circle at center,
                rgba(255, 134, 208, 0.95) 0%, rgba(255, 134, 208, 0.70) 38%,
                rgba(255, 134, 208, 0.32) 65%, rgba(255, 134, 208, 0.12) 80%, transparent 92%);
            top: 55%; left: 45%;
            animation: flow5 32s ease-in-out infinite;
            animation-delay: -16s;
        }
        @keyframes flow5 {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0.85; }
            33%      { transform: translate(-44%, -58%) scale(1.1) rotate(120deg); opacity: 1; }
            66%      { transform: translate(-56%, -42%) scale(0.92) rotate(240deg); opacity: 0.9; }
        }

        .glow-orb--6 {
            width: 560px; height: 560px;
            background: radial-gradient(circle at center,
                rgba(20, 212, 244, 0.95) 0%, rgba(20, 212, 244, 0.70) 38%,
                rgba(20, 212, 244, 0.32) 65%, rgba(20, 212, 244, 0.12) 80%, transparent 92%);
            bottom: 5%; right: 10%;
            animation: flow6 30s ease-in-out infinite;
            animation-delay: -20s;
        }
        @keyframes flow6 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.85; }
            35%      { transform: translate(-9vw, -8vh) scale(1.08); opacity: 1; }
            70%      { transform: translate(6vw, -14vh) scale(0.94); opacity: 0.9; }
        }

        #glow-background::before { display: none !important; }
        #particles-layer { display: none !important; }

        /* ========== 导航栏 ========== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(16px) saturate(1.6) !important;
            -webkit-backdrop-filter: blur(16px) saturate(1.6) !important;
            border-bottom: 2px solid var(--border-soft) !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
            flex-shrink: 0;
        }
        .nav-glass .text-white { color: var(--text-main) !important; text-shadow: none !important; }
        .nav-glass .nav-link { color: var(--text-sub) !important; font-weight: 700 !important; }
        .nav-glass .nav-link:hover { color: var(--duo-green) !important; }
        .nav-glass .nav-link.active { color: var(--duo-green) !important; }
        .nav-glass #mobile-menu-btn { border-color: var(--border-soft) !important; }
        .nav-glass #mobile-menu-btn svg { color: var(--text-main) !important; }
        #mobile-menu { background: #fff !important; border-top: 2px solid var(--border-soft); }
        #mobile-menu a { color: var(--text-main) !important; font-weight: 700 !important; }
        #mobile-menu a:hover, #mobile-menu a.nav-active {
            background: #F0F9E8 !important; color: var(--duo-green) !important;
        }

        /* ========== Hero ========== */
        main.hero {
            position: relative;
            z-index: 3;
            flex: 1 0 auto;
            min-height: calc(100vh - var(--nav-h));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        main.hero .hero-content {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
        }

        main.hero .hero-title {
            font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
            font-size: clamp(2.2rem, 5.4vw, 4rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.028em;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            text-shadow: none !important;
        }

        main.hero .hero-title .accent {
            background: none !important;
            -webkit-text-fill-color: var(--text-main) !important;
            color: var(--text-main) !important;
            filter: none !important;
            -webkit-background-clip: initial !important;
            background-clip: initial !important;
        }

        /* ========== 绿色标题遮罩层 ========== */
        main.hero .hero-title.hero-title-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            margin-bottom: 0;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 100ms linear;

            --mask-x: 50%;
            --mask-y: 50%;
            --mask-r: 0px;

            -webkit-mask-image: radial-gradient(circle var(--mask-r) at var(--mask-x) var(--mask-y),
                #000 0%, #000 92%, transparent 100%);
            mask-image: radial-gradient(circle var(--mask-r) at var(--mask-x) var(--mask-y),
                #000 0%, #000 92%, transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            will-change: mask-image, -webkit-mask-image, opacity;
        }

        main.hero .hero-title.hero-title-mask.is-active {
            opacity: 1;
        }

        /* 遮罩层内所有文字 → 页面主色绿色（含 accent） */
        main.hero .hero-title.hero-title-mask,
        main.hero .hero-title.hero-title-mask .accent,
        main.hero .hero-title.hero-title-mask .accent * {
            color: var(--duo-green) !important;
            -webkit-text-fill-color: var(--duo-green) !important;
            background: none !important;
            -webkit-background-clip: initial !important;
            background-clip: initial !important;
        }

        /* ========== 悬停圆形（纯白，位于文字下方） ========== */
        .hover-circle {
            position: fixed;
            width: 90px;
            height: 90px;
            margin-left: -45px;
            margin-top: -45px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            /* 淡阴影让白色圆在浅色底上仍然可见 */
            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(0, 0, 0, 0.04);
            transform: scale(0.15);
            transform-origin: center center;
            opacity: 0;
            pointer-events: none;
            z-index: 2;               /* 在文字层之下 */
            will-change: transform, background-color, opacity;
        }

        .hover-circle.anim-in {
            animation: circleIn 550ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes circleIn {
            0%   { transform: scale(0.15); background-color: rgba(255, 255, 255, 0.10); opacity: 0; }
            35%  { opacity: 1; }
            100% { transform: scale(1);    background-color: #FFFFFF;                    opacity: 1; }
        }

        .hover-circle.stable {
            transform: scale(1);
            background-color: #FFFFFF;
            opacity: 1;
        }

        .hover-circle.anim-out {
            animation: circleOut 550ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes circleOut {
            0%   { transform: scale(1);    background-color: #FFFFFF;                    opacity: 1; }
            100% { transform: scale(0.15); background-color: rgba(255, 255, 255, 0.10); opacity: 0; }
        }

        main.hero .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 600;
            line-height: 1.8;
            margin: 0 auto;
            max-width: 620px;
            text-shadow: none !important;
        }

        /* ========== 页脚 ========== */
        .footer {
            position: relative;
            z-index: 3;
            flex-shrink: 0;
            padding: 34px 16px;
            text-align: center;
            border-top: 2px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-faint);
            font-size: 13px;
            font-weight: 600;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 767px) { :root { --nav-h: 56px; } }
        @media (max-width: 480px) {
            main.hero .hero-title { font-size: 1.9rem; }
            main.hero .hero-subtitle { font-size: 0.95rem; }
            .glow-orb { filter: blur(60px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .glow-orb, #glow-background { animation: none !important; }
        }
    </style>
</head>

<body>

    <script>
        (function () {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            document.addEventListener('DOMContentLoaded', function () {
                var heroTitle = document.querySelector('.hero-title');
                if (!heroTitle) return;

                /* 1. 克隆标题，生成绿色遮罩层 */
                var maskTitle = heroTitle.cloneNode(true);
                maskTitle.classList.add('hero-title-mask');
                heroTitle.parentNode.insertBefore(maskTitle, heroTitle.nextSibling);

                /* 2. 状态 */
                var trackedCircle = null;
                var isLeaving = false;
                var rafId = null;

                /* 3. 更新遮罩圆形的位置/半径 */
                function updateMask(circle) {
                    if (!circle) return;
                    var cRect = circle.getBoundingClientRect();
                    var size = cRect.width;
                    var cx = cRect.left + cRect.width / 2;
                    var cy = cRect.top + cRect.height / 2;

                    var mRect = maskTitle.getBoundingClientRect();
                    var mx = cx - mRect.left;
                    var my = cy - mRect.top;

                    maskTitle.style.setProperty('--mask-x', mx + 'px');
                    maskTitle.style.setProperty('--mask-y', my + 'px');
                    maskTitle.style.setProperty('--mask-r', (size / 2) + 'px');
                }

                function loop() {
                    rafId = requestAnimationFrame(loop);
                    if (trackedCircle) updateMask(trackedCircle);
                }

                function startLoop() {
                    if (rafId) return;
                    loop();
                }

                function stopLoop() {
                    if (rafId) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }
                    maskTitle.classList.remove('is-active');
                    maskTitle.style.setProperty('--mask-r', '0px');
                }

                /* 4. 进入 */
                function handleEnter(e) {
                    if (trackedCircle && isLeaving) {
                        if (trackedCircle.parentNode) trackedCircle.parentNode.removeChild(trackedCircle);
                        trackedCircle = null;
                        isLeaving = false;
                    }
                    if (trackedCircle) return;

                    var circle = document.createElement('div');
                    circle.className = 'hover-circle anim-in';
                    circle.style.left = e.clientX + 'px';
                    circle.style.top  = e.clientY + 'px';
                    document.body.appendChild(circle);
                    trackedCircle = circle;

                    maskTitle.classList.add('is-active');
                    updateMask(circle);
                    startLoop();

                    circle.addEventListener('animationend', function (ev) {
                        if (ev.animationName !== 'circleIn') return;
                        circle.classList.remove('anim-in');
                        circle.classList.add('stable');
                    });
                }

                /* 5. 移动 */
                function handleMove(e) {
                    if (!trackedCircle) return;
                    trackedCircle.style.left = e.clientX + 'px';
                    trackedCircle.style.top  = e.clientY + 'px';
                }

                /* 6. 离开 */
                function handleLeave() {
                    if (!trackedCircle || isLeaving) return;
                    isLeaving = true;
                    var circle = trackedCircle;

                    circle.classList.remove('anim-in', 'stable');
                    circle.classList.add('anim-out');

                    circle.addEventListener('animationend', function (ev) {
                        if (ev.animationName !== 'circleOut') return;
                        if (circle.parentNode) circle.parentNode.removeChild(circle);
                        if (trackedCircle === circle) {
                            trackedCircle = null;
                            isLeaving = false;
                            stopLoop();
                        }
                    });
                }

                heroTitle.addEventListener('mouseenter', handleEnter);
                heroTitle.addEventListener('mousemove', handleMove);
                heroTitle.addEventListener('mouseleave', handleLeave);

                maskTitle.classList.remove('is-active');
            });
        })();
    </script>
