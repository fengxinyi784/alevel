<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F7F7F7">
    <title>个人主页 - A-Level Guide</title>
    <meta name="description" content="A-Level Guide 用户个人主页，查看作品与资料。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        duo: {
                            green: '#58CC02', blue: '#1CB0F6', yellow: '#FFC800',
                            orange: '#FF9600', red: '#FF4B4B', purple: '#CE82FF',
                            pink: '#FF86D0', cyan: '#14D4F4',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <link rel="stylesheet" href="ai-assistant.css">

    <style>
        :root {
            --duo-green: #58CC02;
            --duo-green-dark: #58A700;
            --duo-green-soft: #F0F9E8;
            --duo-blue: #1CB0F6;
            --duo-yellow: #FFC800;
            --duo-red: #FF4B4B;
            --duo-red-dark: #C73636;

            --text-main: #3C3C3C;
            --text-sub: #777777;
            --text-faint: #AFAFAF;
            --border-soft: #E5E5E5;
            --bg-page: #F7F7F7;
            --bg-card: #FFFFFF;

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            line-height: 1.6;
            font-weight: 500;
            display: flex;
            flex-direction: column;
        }

        ::selection {
            background: rgba(88, 204, 2, 0.25);
        }

        /* ========== Tailwind 深色类名覆写 ========== */
        .text-white {
            color: var(--text-main) !important;
        }

        .text-white\/60 {
            color: var(--text-sub) !important;
        }

        .text-white\/70 {
            color: var(--text-sub) !important;
        }

        .text-white\/50 {
            color: var(--text-faint) !important;
        }

        .text-gray-400 {
            color: var(--text-sub) !important;
        }

        .text-gray-500 {
            color: #909090 !important;
        }

        .text-red-400 {
            color: var(--duo-red) !important;
        }

        .text-gold {
            color: var(--duo-green) !important;
        }

        .bg-gray-700 {
            background: #E5E5E5 !important;
        }

        .bg-gray-800 {
            background: #F0F0F0 !important;
        }

        .bg-gold {
            background: var(--duo-green) !important;
        }

        .border-gold\/40 {
            border-color: rgba(88, 204, 2, 0.4) !important;
        }

        .border-gold\/30 {
            border-color: rgba(88, 204, 2, 0.3) !important;
        }

        .border-gold\/25 {
            border-color: rgba(88, 204, 2, 0.25) !important;
        }

        .bg-gold .text-white,
        .btn-duo .text-white {
            color: #fff !important;
        }

        /* ========== 背景光斑 ========== */
        #glow-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFFFA 40%, #FFFFFF 70%, #F5FBFF 100%);
            background-size: 300% 300%;
            animation: pageGradient 24s ease-in-out infinite;
        }

        @keyframes pageGradient {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            will-change: transform;
        }

        .glow-orb--1 {
            width: 600px;
            height: 600px;
            top: -180px;
            left: -180px;
            background: radial-gradient(circle, rgba(88, 204, 2, 0.5) 0%, rgba(88, 204, 2, 0.15) 45%, transparent 72%);
            animation: flow1 28s ease-in-out infinite;
        }

        .glow-orb--2 {
            width: 560px;
            height: 560px;
            bottom: -200px;
            right: -160px;
            background: radial-gradient(circle, rgba(28, 176, 246, 0.5) 0%, rgba(28, 176, 246, 0.15) 45%, transparent 72%);
            animation: flow2 32s ease-in-out infinite;
            animation-delay: -8s;
        }

        .glow-orb--3 {
            width: 480px;
            height: 480px;
            top: 40%;
            right: -100px;
            background: radial-gradient(circle, rgba(206, 130, 255, 0.45) 0%, rgba(206, 130, 255, 0.12) 45%, transparent 72%);
            animation: flow3 34s ease-in-out infinite;
            animation-delay: -14s;
        }

        .glow-orb--4 {
            width: 460px;
            height: 460px;
            bottom: 10%;
            left: -100px;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.45) 0%, rgba(255, 200, 0, 0.12) 45%, transparent 72%);
            animation: flow4 30s ease-in-out infinite;
            animation-delay: -6s;
        }

        .glow-orb--5 {
            width: 400px;
            height: 400px;
            top: 20%;
            left: 45%;
            background: radial-gradient(circle, rgba(255, 134, 208, 0.4) 0%, rgba(255, 134, 208, 0.1) 45%, transparent 72%);
            animation: flow1 26s ease-in-out infinite;
            animation-delay: -3s;
        }

        .glow-orb--6 {
            width: 420px;
            height: 420px;
            bottom: 20%;
            right: 30%;
            background: radial-gradient(circle, rgba(20, 212, 244, 0.4) 0%, rgba(20, 212, 244, 0.1) 45%, transparent 72%);
            animation: flow2 30s ease-in-out infinite;
            animation-delay: -18s;
        }

        @keyframes flow1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(20vw, 15vh) scale(1.1);
            }

            50% {
                transform: translate(35vw, 38vh) scale(0.95);
            }

            75% {
                transform: translate(10vw, 50vh) scale(1.05);
            }
        }

        @keyframes flow2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            20% {
                transform: translate(-22vw, -12vh) scale(1.1);
            }

            50% {
                transform: translate(-42vw, -35vh) scale(0.92);
            }

            75% {
                transform: translate(-15vw, -48vh) scale(1.06);
            }
        }

        @keyframes flow3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(-18vw, 22vh) scale(1.12);
            }

            66% {
                transform: translate(-26vw, 48vh) scale(0.94);
            }
        }

        @keyframes flow4 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(18vw, -14vh) scale(1.08);
            }

            55% {
                transform: translate(32vw, 6vh) scale(0.94);
            }
        }

        #particles-layer {
            display: none !important;
        }

        /* ========== 导航栏浅色覆盖 ========== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            border-bottom: 2px solid var(--border-soft) !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
        }

        .nav-glass .text-white {
            color: var(--text-main) !important;
            text-shadow: none !important;
        }

        .nav-glass .nav-link {
            color: var(--text-sub) !important;
            font-weight: 700 !important;
        }

        .nav-glass .nav-link:hover {
            color: var(--duo-green) !important;
        }

        .nav-glass .nav-link.active {
            color: var(--duo-green) !important;
        }

        .nav-glass #mobile-menu-btn {
            border-color: var(--border-soft) !important;
        }

        .nav-glass #mobile-menu-btn svg {
            color: var(--text-main) !important;
        }

        #mobile-menu {
            background: #fff !important;
            border-top: 2px solid var(--border-soft);
        }

        #mobile-menu a {
            color: var(--text-main) !important;
            font-weight: 700 !important;
        }

        #mobile-menu a:hover,
        #mobile-menu a.nav-active {
            background: var(--duo-green-soft) !important;
            color: var(--duo-green) !important;
        }

        /* ========== 页面主区 ========== */
        main {
            position: relative;
            z-index: 1;
            flex: 1 0 auto;
            width: 100%;
        }

        /* ========== 贴纸卡片 ========== */
        .profile-card {
            background: var(--bg-card);
            border: 2px solid var(--border-soft);
            border-bottom-width: 5px;
            border-radius: var(--radius-lg);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            position: relative;
        }

        .profile-card:hover {
            border-color: rgba(88, 204, 2, 0.4);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.06);
        }

        /* ========== 背景封面 ========== */
        .profile-cover {
            height: 240px;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: transform var(--transition-smooth, 0.35s ease);
            cursor: pointer;
            background-color: #E5E5E5;
        }

        .profile-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.05) 0%,
                    rgba(0, 0, 0, 0.1) 40%,
                    rgba(255, 255, 255, 0.55) 85%,
                    #FFFFFF 100%);
            pointer-events: none;
        }

        .profile-cover .cover-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.35s ease;
            background: rgba(0, 0, 0, 0.25);
        }

        .profile-cover:hover .cover-overlay {
            opacity: 1;
        }

        .cover-overlay span {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 0.55rem 1.3rem;
            border-radius: 999px;
            border: 2px solid var(--duo-green);
            color: var(--duo-green);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            transform: translateY(8px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 3px 0 var(--duo-green-dark);
        }

        .profile-cover:hover .cover-overlay span {
            transform: translateY(0);
        }

        /* ========== 头像 ========== */
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 5px solid #FFFFFF;
            box-shadow: 0 0 0 3px var(--duo-green), 0 6px 20px rgba(0, 0, 0, 0.12);
            background: linear-gradient(135deg, #58CC02 0%, #58A700 100%);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
        }

        .profile-avatar:hover {
            transform: scale(1.08);
            box-shadow: 0 0 0 3px var(--duo-green), 0 10px 30px rgba(88, 204, 2, 0.35);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ========== 用户名和简介 ========== */
        .profile-username {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: var(--text-main);
            transition: color 0.15s ease;
            position: relative;
            display: inline-block;
            cursor: pointer;
            word-break: break-word;
        }

        .profile-username:hover {
            color: var(--duo-green);
        }

        .profile-bio {
            font-size: 0.92rem;
            color: var(--text-sub);
            font-weight: 600;
            transition: color 0.15s ease;
            cursor: pointer;
            word-break: break-word;
        }

        .profile-bio:hover {
            color: var(--duo-green);
        }

        /* ========== 统计数字 ========== */
        .stat-item {
            cursor: pointer;
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            transition: all 0.15s ease;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 2px solid var(--border-soft);
            background: #FFFFFF;
            color: var(--text-sub);
            font-weight: 700;
        }

        .stat-item:hover {
            background: var(--duo-green-soft);
            border-color: var(--duo-green);
            color: var(--duo-green);
        }

        .stat-item .stat-number {
            font-weight: 900;
            font-size: 1rem;
            color: var(--duo-green);
        }

        /* ============================================================
           关注 / 私信按钮
             · 形状共用：同样 padding、圆角、字号、3D 阴影高度
             · 未关注：绿底白字（强调可点击）
             · 已关注：浅灰底 + 灰字 + 灰边 + 灰影（弱化状态）
             · 私信：白底绿边绿字（保持原样）
           ============================================================ */
        .follow-btn,
        .dm-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.65rem 1.4rem;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease,
                background 0.15s ease, color 0.15s ease,
                border-color 0.15s ease, filter 0.15s ease;
            white-space: nowrap;
            font-family: inherit;
            border: 2px solid transparent;
        }

        /* ---- 未关注状态（默认）：绿底白字 ---- */
        .follow-btn {
            background: var(--duo-green);
            color: #FFFFFF;
            border-color: var(--duo-green);
            box-shadow: 0 4px 0 var(--duo-green-dark);
        }

        .follow-btn:hover {
            filter: brightness(1.06);
        }

        .follow-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        /* ---- 已关注状态：浅灰底灰边灰字（形状与未关注一致，只换色） ---- */
        .follow-btn.is-following {
            background: #F0F0F0;
            color: var(--text-sub);
            border-color: var(--border-soft);
            box-shadow: 0 4px 0 var(--border-soft);
        }

        .follow-btn.is-following:hover {
            background: #E8E8E8;
            color: var(--text-main);
            filter: none;
        }

        .follow-btn.is-following:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--border-soft);
        }

        /* ---- 私信按钮：白底绿边绿字（保持不变） ---- */
        .dm-btn {
            background: #FFFFFF;
            color: var(--duo-green);
            border-color: var(--duo-green);
            box-shadow: 0 4px 0 var(--duo-green);
        }

        .dm-btn:hover {
            background: var(--duo-green-soft);
            filter: brightness(1.02);
        }

        .dm-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green);
        }

        /* 关注 + 私信按钮的组合容器 */
        .profile-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ========== 收藏标签 ========== */
        .favorite-tag {
            padding: 0.5rem 1.1rem;
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: 999px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 800;
            transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.02em;
        }

        .favorite-tag:hover {
            background: var(--duo-green-soft);
            border-color: var(--duo-green);
            color: var(--duo-green);
            transform: translateY(-2px);
        }

        /* ========== 作品卡片 ========== */
        .post-item {
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-bottom-width: 4px;
            border-radius: var(--radius-md);
            padding: 1.1rem 1.3rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .post-item::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 14px;
            bottom: 14px;
            width: 4px;
            background: var(--duo-green);
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .post-item:hover {
            border-color: rgba(88, 204, 2, 0.5);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }

        .post-item:hover::before {
            opacity: 1;
        }

        .post-item h4 {
            font-weight: 900;
            font-size: 1.02rem;
            color: var(--text-main);
            transition: color 0.15s ease;
            letter-spacing: -0.01em;
            word-break: break-word;
        }

        .post-item:hover h4 {
            color: var(--duo-green);
        }

        .post-item .post-content {
            color: var(--text-sub);
            font-size: 0.88rem;
            margin-top: 0.35rem;
            line-height: 1.65;
            font-weight: 500;
            word-break: break-word;
        }

        .post-item .post-time {
            color: var(--text-faint);
            font-size: 0.75rem;
            margin-top: 0.6rem;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 700;
        }

        .post-item .post-time::before {
            content: '🕐';
            font-size: 0.7rem;
        }

        /* ========== 分区标题 ========== */
        .section-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1.05rem;
            background: var(--duo-green);
            border-radius: 2px;
        }

        /* ========== 模态框 ========== */
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: modalBackdropFade 0.25s ease-out;
        }

        @keyframes modalBackdropFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 1.8rem;
            max-width: 440px;
            width: 92%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15);
            animation: modalBoxIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 85vh;
            overflow-y: auto;
            outline: none;
        }

        @keyframes modalBoxIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box h3 {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            margin-bottom: 1.2rem;
            color: var(--text-main);
        }

        .modal-input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            font-family: inherit;
        }

        .modal-input:focus {
            border-color: var(--duo-green);
            box-shadow: 0 0 0 4px rgba(88, 204, 2, 0.12);
        }

        .modal-input::placeholder {
            color: var(--text-faint);
            font-weight: 500;
        }

        /* ========== 模态按钮 ========== */
        .modal-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.4rem;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease, color 0.15s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .modal-btn.cancel {
            background: #FFFFFF;
            color: var(--text-sub);
            border: 2px solid var(--border-soft);
            box-shadow: 0 4px 0 var(--border-soft);
        }

        .modal-btn.cancel:hover {
            color: var(--text-main);
        }

        .modal-btn.cancel:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--border-soft);
        }

        .modal-btn.save {
            background: var(--duo-green);
            color: #FFFFFF;
            box-shadow: 0 4px 0 var(--duo-green-dark);
        }

        .modal-btn.save:hover {
            filter: brightness(1.06);
        }

        .modal-btn.save:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        /* ========== Emoji 选择按钮 ========== */
        .avatar-emoji-btn {
            font-size: 1.4rem;
            padding: 0.4rem;
            border-radius: 10px;
            background: #FAFAFA;
            border: 2px solid var(--border-soft);
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1;
        }

        .avatar-emoji-btn:hover {
            background: var(--duo-green-soft);
            border-color: rgba(88, 204, 2, 0.5);
            transform: scale(1.1);
        }

        .avatar-emoji-btn.emoji-selected {
            background: var(--duo-green);
            border-color: var(--duo-green);
            box-shadow: 0 3px 0 var(--duo-green-dark);
            transform: scale(1.08);
        }

        /* ========== 关注列表模态框 ========== */
        .follow-list-container {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: modalBackdropFade 0.25s ease-out;
        }

        .follow-list-box {
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            max-width: 420px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15);
            animation: modalBoxIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
        }

        .follow-list-box h3 {
            font-size: 1.1rem !important;
            font-weight: 900;
            color: var(--text-main) !important;
            -webkit-text-fill-color: var(--text-main) !important;
            background: none !important;
        }

        .follow-list-box #close-follow-modal {
            color: var(--text-faint) !important;
        }

        .follow-list-box #close-follow-modal:hover {
            color: var(--text-main) !important;
        }

        .follow-user-item {
            background: #FAFAFA;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .follow-user-item:hover {
            background: var(--duo-green-soft);
            border-color: rgba(88, 204, 2, 0.5);
            transform: translateX(4px);
        }

        .follow-user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            box-shadow: 0 0 0 2px rgba(88, 204, 2, 0.2);
            background: linear-gradient(135deg, #58CC02, #58A700);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .follow-user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .follow-user-name {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: color 0.15s ease;
            word-break: break-word;
        }

        .follow-user-item:hover .follow-user-name {
            color: var(--duo-green);
        }

        /* ========== 登录提示卡片 ========== */
        .login-prompt-card {
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-bottom-width: 5px;
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            animation: modalBoxIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .login-prompt-card .lock-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 1rem;
            animation: lockPulse 2s ease-in-out infinite;
        }

        @keyframes lockPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.85;
            }
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 2rem;
            background: var(--duo-green);
            color: #FFFFFF;
            font-weight: 800;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 4px 0 var(--duo-green-dark);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
        }

        .login-btn:hover {
            filter: brightness(1.06);
        }

        .login-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--duo-green-dark);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            color: var(--text-faint);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 0.5rem 0;
        }

        /* ========== 页脚 ========== */
        footer {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            padding: 30px 16px;
            text-align: center;
            border-top: 2px solid var(--border-soft);
            background: #fff;
            color: var(--text-faint);
            font-size: 13px;
            font-weight: 600;
        }

        /* ========== 加载动画 ========== */
        @keyframes spin-slow {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 1rem;
        }

        .loading-spinner .spinner-ring {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(88, 204, 2, 0.2);
            border-top-color: var(--duo-green);
            border-radius: 50%;
            animation: spin-slow 1s linear infinite;
        }

        .loading-spinner .loading-text {
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        @keyframes pulse-text {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .fade-in-up {
            animation: fade-in-up 0.5s ease-out both;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .profile-cover {
                height: 200px;
            }

            .profile-avatar {
                width: 74px;
                height: 74px;
                border-width: 4px;
                font-size: 1.8rem;
            }

            .profile-username {
                font-size: 1.3rem;
            }

            .modal-box {
                padding: 1.25rem;
            }

            .post-item {
                padding: 1rem 1.1rem;
            }
        }

        @media (max-width: 480px) {
            main {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }

            .profile-cover {
                height: 170px;
            }

            .profile-avatar {
                width: 64px;
                height: 64px;
                border-width: 3px;
                font-size: 1.5rem;
            }

            .profile-username {
                font-size: 1.15rem;
            }

            .follow-btn,
            .dm-btn {
                padding: 0.55rem 1.1rem;
                font-size: 0.78rem;
            }

            .profile-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .glow-orb,
            #glow-background {
                animation: none !important;
            }

            .login-prompt-card .lock-icon {
                animation: none !important;
            }
        }
    </style>
</head>

    <!-- 页面主体 -->
    <main class="w-full px-6 sm:px-10 lg:px-16 py-8 md:py-12">

    </main>

    <!-- 页脚 -->
    <footer>© 2026 A-Level Guide · 专注 A-Level 升学规划与选课指导</footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        /* ============ Supabase（复用全局客户端） ============ */
        const supabaseClient = window.supabaseClient;

        const subjectNameMap = {
            'Mathematics': '数学', 'Further Mathematics': '进阶数学', 'Physics': '物理',
            'Chemistry': '化学', 'Biology': '生物', 'Economics': '经济学',
            'Accounting': '会计学', 'Business': '商务', 'Psychology': '心理学',
            'Computer Science': '计算机科学'
        };
        const universityNameMap = {
            'Oxford': '牛津大学', 'Cambridge': '剑桥大学', 'Imperial': '帝国理工学院',
            'LSE': '伦敦政治经济学院', 'UCL': '伦敦大学学院', 'Edinburgh': '爱丁堡大学',
            'Manchester': '曼彻斯特大学', 'KCL': '伦敦国王学院', 'Warwick': '华威大学',
            'Bristol': '布里斯托大学', 'Durham': '杜伦大学', 'Birmingham': '伯明翰大学',
            'Nottingham': '诺丁汉大学', 'Sheffield': '谢菲尔德大学',
            'StAndrews': '圣安德鲁斯大学', 'Glasgow': '格拉斯哥大学'
        };

        const DEFAULT_COVER = 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=2070&q=80';
        const POSTS_PAGE_SIZE = 20;

        const profileApp = document.getElementById('profile-app');
        let currentUser = null;
        let currentProfile = null;
        let targetProfileUserId = null;
        let targetProfile = null;
        let uploadedAvatarFile = null;
        let uploadedBgFile = null;
        let selectedEmoji = null;

        function getQueryParam(param) {
            return new URLSearchParams(window.location.search).get(param);
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function safeUrl(url, fallback = '') {
            if (!url) return fallback;
            const s = String(url).trim();
            if (/^https?:\/\//i.test(s)) return escapeHtml(s);
            if (/^(\/|\.\/|\.\.\/)/.test(s)) return escapeHtml(s);
            return fallback;
        }

        async function requireLogin(type) {
            if (typeof window.duoRequireLogin === 'function') {
                try { return await window.duoRequireLogin(type); }
                catch (_) { return true; }
            }
            return true;
        }

        function showAlert(message, opts = {}) {
            if (typeof window.duoAlert === 'function') {
                try { window.duoAlert(message, opts); return; } catch (_) { }
            }
            alert(message);
        }

        /* ============ 文件处理 ============ */
        function handleAvatarFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showAlert('请选择图片文件', { type: 'warn', title: '格式不对' });
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                showAlert('图片不能超过 5MB', { type: 'warn', title: '图片太大了' });
                return;
            }
            uploadedAvatarFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('avatar-preview');
                if (preview) preview.innerHTML =
                    `<img src="${e.target.result}" class="w-full h-full object-cover" alt="" />`;
            };
            reader.readAsDataURL(file);
        }

        function handleBgFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showAlert('请选择图片文件', { type: 'warn', title: '格式不对' });
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                showAlert('图片不能超过 5MB', { type: 'warn', title: '图片太大了' });
                return;
            }
            uploadedBgFile = file;
        }

        /* ============ 初始化 ============ */
        async function initProfilePage() {
            profileApp.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner-ring"></div>
                    <span class="loading-text">正在加载</span>
                </div>`;

            if (!supabaseClient) {
                profileApp.innerHTML = `<p class="text-center text-red-400 py-12">服务暂不可用，请刷新重试</p>`;
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();
            currentUser = user;
            if (!user) { renderLoginView(); return; }

            const { data: profile, error } = await supabaseClient
                .from('profiles').select('*').eq('id', user.id).single();

            if (profile) {
                currentProfile = profile;
            } else {
                if (error && error.code !== 'PGRST116') {
                    console.error('加载当前用户资料失败:', error);
                }
                const { data: newProfile, error: insertError } = await supabaseClient
                    .from('profiles')
                    .upsert([{ id: user.id, username: user.email.split('@')[0], avatar_emoji: '🙂' }])
                    .select().single();
                if (insertError) {
                    console.error('创建用户资料失败:', insertError);
                    currentProfile = { id: user.id, username: user.email.split('@')[0], avatar_emoji: '🙂' };
                } else { currentProfile = newProfile; }
            }

            const userIdParam = getQueryParam('user_id');
            targetProfileUserId = userIdParam || user.id;
            await loadTargetProfile();
            renderProfilePage();
        }

        async function loadTargetProfile() {
            if (!targetProfileUserId) return;
            const { data: profile, error } = await supabaseClient
                .from('profiles').select('*').eq('id', targetProfileUserId).single();
            if (error) {
                console.error('加载目标用户资料失败:', error);
                targetProfile = null;
            } else { targetProfile = profile; }
        }

        function renderLoginView() {
            profileApp.innerHTML = `
                <div class="login-prompt-card max-w-md mx-auto">
                    <span class="lock-icon">🔐</span>
                    <h2 class="text-xl font-bold text-white mb-2" style="color:#3C3C3C;">请先登录</h2>
                    <p class="text-sm text-white/60 mb-6">登录后即可查看和编辑个人主页</p>
                    <a href="login.html" class="login-btn">前往登录</a>
                </div>`;
        }

        /* ============================================================
           个人主页渲染
           ============================================================ */
        async function renderProfilePage() {
            if (!targetProfile) {
                profileApp.innerHTML = `<p class="text-center text-red-400 py-12">用户不存在或加载失败</p>`;
                return;
            }

            const isSelf = currentUser?.id === targetProfile.id;
            const userId = targetProfile.id;

            const [followingRes, followerRes] = await Promise.all([
                supabaseClient.from('follows').select('*', { count: 'exact', head: true }).eq('follower_id', userId),
                supabaseClient.from('follows').select('*', { count: 'exact', head: true }).eq('following_id', userId)
            ]);
            const followingCount = followingRes.count || 0;
            const followerCount = followerRes.count || 0;

            let isFollowing = false;
            if (currentUser && currentUser.id !== userId) {
                const { data: follow } = await supabaseClient
                    .from('follows').select('*')
                    .eq('follower_id', currentUser.id).eq('following_id', userId).maybeSingle();
                isFollowing = !!follow;
            }

            const { data: posts, error: postsError } = await supabaseClient
                .from('posts').select('*').eq('user_id', userId)
                .order('created_at', { ascending: false })
                .limit(POSTS_PAGE_SIZE);
            if (postsError) console.error('加载作品失败:', postsError);
            const safePosts = posts || [];

            const coverUrl = safeUrl(targetProfile.bg_image_url, DEFAULT_COVER) || DEFAULT_COVER;
            const avatarUrl = safeUrl(targetProfile.avatar_url);
            const displayName = escapeHtml(targetProfile.username || '未设置');
            const displayBio = escapeHtml(targetProfile.bio || '这个人很懒，什么都没写~');
            const avatarAlt = escapeHtml(targetProfile.username || '用户') + ' 的头像';

            profileApp.innerHTML = `
            <div class="profile-card mb-6">
                <div class="profile-cover" id="profile-background"
                     style="background-image: url('${coverUrl}');">
                    ${isSelf ? `
                    <div class="cover-overlay">
                        <span>📷 点击更换背景</span>
                    </div>` : ''}
                </div>
                <div class="px-6 pb-6 -mt-12 relative z-10">
                    <div class="flex items-end justify-between flex-wrap gap-4">
                        <div class="flex items-end gap-4">
                            <div class="profile-avatar" id="profile-avatar">
                                ${avatarUrl
                    ? `<img src="${avatarUrl}" alt="${avatarAlt}" onerror="this.style.display='none'; this.parentElement.textContent='🙂';" />`
                    : escapeHtml(targetProfile.avatar_emoji || '🙂')}
                            </div>
                            <div class="pb-1">
                                <h2 class="profile-username" id="profile-username">${displayName}</h2>
                                <p class="profile-bio mt-1" id="profile-bio">${displayBio}</p>
                            </div>
                        </div>
                        ${currentUser && currentUser.id !== userId ? `
                            <div class="profile-actions">
                                <button id="follow-btn" class="follow-btn${isFollowing ? ' is-following' : ''}">
                                    ${isFollowing ? '✓ 已关注' : '+ 关注'}
                                </button>
                                <button id="dm-btn" class="dm-btn" title="给 TA 发私信" type="button">
                                    💬 私信
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="flex gap-3 mt-5 text-sm">
                        <span class="stat-item" id="following-count">关注 <span class="stat-number">${followingCount}</span></span>
                        <span class="stat-item" id="follower-count">粉丝 <span class="stat-number">${followerCount}</span></span>
                    </div>
                </div>
            </div>

            ${isSelf ? `
            <div class="profile-card p-6 mb-6">
                <h3 class="section-title">收藏的科目</h3>
                <div id="favorite-subjects-list" class="flex flex-wrap gap-2">
                    <p class="empty-state">加载中...</p>
                </div>
            </div>
            <div class="profile-card p-6 mb-6">
                <h3 class="section-title">收藏的院校</h3>
                <div id="favorite-universities-list" class="flex flex-wrap gap-2">
                    <p class="empty-state">加载中...</p>
                </div>
            </div>
            ` : ''}

            <h3 class="section-title">${isSelf ? '我的作品' : 'TA 的作品'}</h3>
            <div id="profile-posts">
                ${safePosts.length > 0 ? safePosts.map(post => `
                    <div class="post-item" data-post-id="${post.id}">
                        <h4>${escapeHtml(post.title)}</h4>
                        <p class="post-content line-clamp-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${escapeHtml(post.content)}</p>
                        <p class="post-time">${new Date(post.created_at).toLocaleString('zh-CN')}</p>
                    </div>
                `).join('') : '<p class="empty-state">暂无作品</p>'}
            </div>

            ${isSelf ? `
            <!-- 编辑资料模态框 -->
            <div id="profile-editor-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop"
                 role="dialog" aria-modal="true" aria-labelledby="profile-editor-title">
                <div class="modal-box" tabindex="-1">
                    <h3 id="profile-editor-title">编辑资料</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm mb-2" style="color:#777;font-weight:700;">头像</label>
                            <div class="flex items-center gap-3 mb-3">
                                <div id="avatar-preview" class="w-16 h-16 rounded-full flex items-center justify-center overflow-hidden"
                                     style="border:2px solid #E5E5E5;background:linear-gradient(135deg,#58CC02,#58A700);font-size:1.8rem;">
                                    ${avatarUrl
                        ? `<img src="${avatarUrl}" class="w-full h-full object-cover" alt="" />`
                        : escapeHtml(targetProfile.avatar_emoji || '🙂')}
                                </div>
                                <button type="button" class="modal-btn cancel" id="avatar-upload-btn">上传图片</button>
                                <input type="file" id="avatar-file-input" accept="image/*" class="hidden">
                            </div>
                            <div class="flex gap-2 flex-wrap">
                                ${['🙂', '😎', '🤓', '👩‍🎓', '👨‍🎓', '🐱', '🐶', '🦊', '🌟', '🎓'].map(emoji => `
                                    <button type="button" class="avatar-emoji-btn" data-emoji="${emoji}">${emoji}</button>
                                `).join('')}
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm mb-1.5" style="color:#777;font-weight:700;">用户名</label>
                            <input type="text" id="edit-username" class="modal-input" maxlength="30" value="${displayName}">
                        </div>
                        <div>
                            <label class="block text-sm mb-1.5" style="color:#777;font-weight:700;">个人简介</label>
                            <textarea id="edit-bio" rows="3" class="modal-input" maxlength="200" style="resize:vertical;">${displayBio}</textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" id="editor-cancel-btn" class="modal-btn cancel">取消</button>
                            <button type="button" id="editor-save-btn" class="modal-btn save">保存</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 更换背景模态框 -->
            <div id="background-editor-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop"
                 role="dialog" aria-modal="true" aria-labelledby="bg-editor-title">
                <div class="modal-box" tabindex="-1">
                    <h3 id="bg-editor-title">更换背景</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm mb-2" style="color:#777;font-weight:700;">背景图片</label>
                            <div class="flex items-center gap-3">
                                <button type="button" class="modal-btn cancel" id="bg-upload-btn">上传图片</button>
                                <input type="file" id="bg-file-input" accept="image/*" class="hidden">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm mb-1.5" style="color:#777;font-weight:700;">或输入图片 URL</label>
                            <input type="text" id="edit-bg-url" class="modal-input"
                                   placeholder="输入图片链接..." value="${escapeHtml(targetProfile.bg_image_url || '')}">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" id="bg-cancel-btn" class="modal-btn cancel">取消</button>
                            <button type="button" id="bg-save-btn" class="modal-btn save">保存</button>
                        </div>
                    </div>
                </div>
            </div>
            ` : ''}
            `;

            if (isSelf) {
                loadFavoriteSubjects(userId);
                loadFavoriteUniversities(userId);
            }

            bindProfileActions(isSelf, userId, isFollowing);
        }

        async function loadFavoriteSubjects(uid) {
            const container = document.getElementById('favorite-subjects-list');
            if (!container) return;
            const { data, error } = await supabaseClient
                .from('subject_favorites').select('subject_key').eq('user_id', uid);
            if (error) { container.innerHTML = '<p class="text-red-400">加载失败</p>'; return; }
            if (!data || data.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无收藏科目</p>';
                return;
            }
            container.innerHTML = data.map(item => {
                const chineseName = subjectNameMap[item.subject_key] || item.subject_key;
                return `<a href="subjects.html" class="favorite-tag">${escapeHtml(chineseName)}</a>`;
            }).join('');
        }

        async function loadFavoriteUniversities(uid) {
            const container = document.getElementById('favorite-universities-list');
            if (!container) return;
            const { data, error } = await supabaseClient
                .from('university_favorites').select('university_key').eq('user_id', uid);
            if (error) { container.innerHTML = '<p class="text-red-400">加载失败</p>'; return; }
            if (!data || data.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无收藏院校</p>';
                return;
            }
            container.innerHTML = data.map(item => {
                const chineseName = universityNameMap[item.university_key] || item.university_key;
                return `<a href="universities.html" class="favorite-tag">${escapeHtml(chineseName)}</a>`;
            }).join('');
        }

        function bindProfileActions(isSelf, userId, isFollowing) {
            if (isSelf) {
                document.getElementById('profile-avatar')?.addEventListener('click', () => openProfileEditor('avatar'));
                document.getElementById('profile-username')?.addEventListener('click', () => openProfileEditor('username'));
                document.getElementById('profile-bio')?.addEventListener('click', () => openProfileEditor('bio'));
                document.getElementById('profile-background')?.addEventListener('click', openBackgroundEditor);

                document.getElementById('avatar-upload-btn')?.addEventListener('click', () => {
                    document.getElementById('avatar-file-input').click();
                });
                document.getElementById('avatar-file-input')?.addEventListener('change', handleAvatarFileSelect);
                document.querySelectorAll('#profile-editor-modal .avatar-emoji-btn').forEach(btn => {
                    btn.addEventListener('click', () => selectEmoji(btn));
                });
                document.getElementById('editor-cancel-btn')?.addEventListener('click', closeProfileEditor);
                document.getElementById('editor-save-btn')?.addEventListener('click', saveProfileEdit);

                document.getElementById('bg-upload-btn')?.addEventListener('click', () => {
                    document.getElementById('bg-file-input').click();
                });
                document.getElementById('bg-file-input')?.addEventListener('change', handleBgFileSelect);
                document.getElementById('bg-cancel-btn')?.addEventListener('click', closeBackgroundEditor);
                document.getElementById('bg-save-btn')?.addEventListener('click', saveBackgroundEdit);
            } else {
                document.getElementById('follow-btn')?.addEventListener('click', () => toggleFollow(userId));
                document.getElementById('dm-btn')?.addEventListener('click', () => {
                    if (!currentUser) { window.location.href = 'login.html'; return; }
                    if (currentUser.id === userId) return;
                    window.location.href = `messages.html?user_id=${userId}`;
                });
            }

            document.getElementById('following-count')?.addEventListener('click', () => renderFollowList(userId, 'following'));
            document.getElementById('follower-count')?.addEventListener('click', () => renderFollowList(userId, 'followers'));

            document.querySelectorAll('[data-post-id]').forEach(item => {
                item.addEventListener('click', () => {
                    const postId = item.getAttribute('data-post-id');
                    window.location.href = `strategy.html?post_id=${postId}`;
                });
            });

            profileApp.classList.remove('fade-in-up');
            void profileApp.offsetWidth;
            profileApp.classList.add('fade-in-up');
        }

        /* ============ 编辑资料 ============ */
        function selectEmoji(btn) {
            document.querySelectorAll('#profile-editor-modal .avatar-emoji-btn')
                .forEach(b => b.classList.remove('emoji-selected'));
            btn.classList.add('emoji-selected');
            selectedEmoji = btn.getAttribute('data-emoji');
        }

        let lastFocusedBeforeEditor = null;
        let bodyOverflowBeforeEditor = '';

        function openProfileEditor(field) {
            const modal = document.getElementById('profile-editor-modal');
            if (!modal) return;

            selectedEmoji = targetProfile.avatar_emoji || '🙂';
            const curEmoji = selectedEmoji;
            modal.querySelectorAll('.avatar-emoji-btn').forEach(btn => {
                btn.classList.toggle('emoji-selected', btn.getAttribute('data-emoji') === curEmoji);
            });

            document.getElementById('edit-username').value = targetProfile.username || '';
            document.getElementById('edit-bio').value = targetProfile.bio || '';

            lastFocusedBeforeEditor = document.activeElement;
            bodyOverflowBeforeEditor = document.body.style.overflow;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';

            requestAnimationFrame(() => {
                if (field === 'username') document.getElementById('edit-username').focus();
                else if (field === 'bio') document.getElementById('edit-bio').focus();
                else modal.querySelector('.modal-box')?.focus();
            });
        }

        function closeProfileEditor() {
            const modal = document.getElementById('profile-editor-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = bodyOverflowBeforeEditor;

            uploadedAvatarFile = null;
            const input = document.getElementById('avatar-file-input');
            if (input) input.value = '';

            if (lastFocusedBeforeEditor && lastFocusedBeforeEditor.focus) {
                lastFocusedBeforeEditor.focus();
            }
            lastFocusedBeforeEditor = null;
        }

        async function saveProfileEdit() {
            const modal = document.getElementById('profile-editor-modal');
            if (!modal) return;

            const newEmoji = selectedEmoji || targetProfile.avatar_emoji || '🙂';
            const newUsername = document.getElementById('edit-username').value.trim();
            const newBio = document.getElementById('edit-bio').value.trim();

            if (!newUsername) {
                showAlert('用户名不能为空', { type: 'warn', title: '还差一点' });
                return;
            }
            if (newUsername.length > 30) {
                showAlert('用户名不能超过 30 个字符', { type: 'warn', title: '太长了' });
                return;
            }

            let avatarUrl = targetProfile.avatar_url || null;

            if (uploadedAvatarFile) {
                const fileExt = (uploadedAvatarFile.name.split('.').pop() || 'jpg').toLowerCase();
                const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabaseClient.storage
                    .from('avatars').upload(fileName, uploadedAvatarFile, { upsert: true });
                if (uploadError) {
                    showAlert('头像上传失败：' + uploadError.message, { type: 'error', title: '上传失败' });
                    return;
                }
                const { data: publicURL } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                avatarUrl = publicURL.publicUrl;
            }

            const { error } = await supabaseClient
                .from('profiles')
                .update({ avatar_emoji: newEmoji, username: newUsername, bio: newBio, avatar_url: avatarUrl })
                .eq('id', currentUser.id);

            if (error) {
                showAlert('保存失败：' + error.message, { type: 'error', title: '保存失败' });
            } else {
                targetProfile.avatar_emoji = newEmoji;
                targetProfile.username = newUsername;
                targetProfile.bio = newBio;
                targetProfile.avatar_url = avatarUrl;
                currentProfile.avatar_emoji = newEmoji;
                currentProfile.username = newUsername;
                currentProfile.bio = newBio;
                currentProfile.avatar_url = avatarUrl;

                closeProfileEditor();
                renderProfilePage();
            }
        }

        /* ============ 背景编辑 ============ */
        let lastFocusedBeforeBg = null;
        let bodyOverflowBeforeBg = '';

        function openBackgroundEditor() {
            const modal = document.getElementById('background-editor-modal');
            if (!modal) return;
            document.getElementById('edit-bg-url').value = targetProfile.bg_image_url || '';

            lastFocusedBeforeBg = document.activeElement;
            bodyOverflowBeforeBg = document.body.style.overflow;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';

            requestAnimationFrame(() => {
                modal.querySelector('.modal-box')?.focus();
            });
        }

        function closeBackgroundEditor() {
            const modal = document.getElementById('background-editor-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = bodyOverflowBeforeBg;

            uploadedBgFile = null;
            const input = document.getElementById('bg-file-input');
            if (input) input.value = '';

            if (lastFocusedBeforeBg && lastFocusedBeforeBg.focus) {
                lastFocusedBeforeBg.focus();
            }
            lastFocusedBeforeBg = null;
        }

        async function saveBackgroundEdit() {
            const bgUrlInput = document.getElementById('edit-bg-url');
            let bgUrl = bgUrlInput.value.trim();

            if (uploadedBgFile) {
                const fileExt = (uploadedBgFile.name.split('.').pop() || 'jpg').toLowerCase();
                const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabaseClient.storage
                    .from('covers').upload(fileName, uploadedBgFile, { upsert: true });
                if (uploadError) {
                    showAlert('背景上传失败：' + uploadError.message, { type: 'error', title: '上传失败' });
                    return;
                }
                const { data: publicURL } = supabaseClient.storage.from('covers').getPublicUrl(fileName);
                bgUrl = publicURL.publicUrl;
            }

            const { error } = await supabaseClient
                .from('profiles').update({ bg_image_url: bgUrl }).eq('id', currentUser.id);

            if (error) {
                showAlert('保存失败：' + error.message, { type: 'error', title: '保存失败' });
            } else {
                targetProfile.bg_image_url = bgUrl;
                currentProfile.bg_image_url = bgUrl;
                closeBackgroundEditor();
                renderProfilePage();
            }
        }

        /* ============================================================
           ⭐ 关注 / 取关：切换 is-following 类，颜色灰/绿切换
           ============================================================ */
        async function toggleFollow(userId) {
            if (!currentUser) {
                const go = await requireLogin('follow');
                if (go) window.location.href = 'login.html';
                return;
            }
            if (currentUser.id === userId) return;

            const btn = document.getElementById('follow-btn');
            if (!btn || btn.dataset.pending === '1') return;
            btn.dataset.pending = '1';

            try {
                const { data: existing } = await supabaseClient
                    .from('follows').select('*')
                    .eq('follower_id', currentUser.id).eq('following_id', userId).maybeSingle();

                const followerCountEl = document.querySelector('#follower-count .stat-number');

                if (existing) {
                    /* 取消关注 → 移除 is-following（回到绿底白字） */
                    const { error } = await supabaseClient.from('follows').delete()
                        .eq('follower_id', currentUser.id).eq('following_id', userId);
                    if (error) throw error;
                    btn.textContent = '+ 关注';
                    btn.classList.remove('is-following');
                    if (followerCountEl) {
                        followerCountEl.textContent = String(Math.max(0, Number(followerCountEl.textContent) - 1));
                    }
                } else {
                    /* 关注 → 加上 is-following（切到灰底灰边灰字） */
                    const { error: insErr } = await supabaseClient.from('follows')
                        .insert([{ follower_id: currentUser.id, following_id: userId }]);
                    if (insErr) throw insErr;
                    supabaseClient.from('notifications')
                        .insert([{ user_id: userId, type: 'follow', actor_id: currentUser.id }])
                        .then(() => { }, () => { });
                    btn.textContent = '✓ 已关注';
                    btn.classList.add('is-following');
                    if (followerCountEl) {
                        followerCountEl.textContent = String(Number(followerCountEl.textContent) + 1);
                    }
                }
            } catch (err) {
                console.error('关注操作失败:', err);
                showAlert('操作失败：' + err.message, { type: 'error', title: '出错了' });
            } finally {
                btn.dataset.pending = '0';
            }
        }

        /* ============ 关注 / 粉丝列表 ============ */
        let lastFocusedBeforeList = null;
        let bodyOverflowBeforeList = '';

        async function renderFollowList(userId, type) {
            if (document.querySelector('.follow-list-container')) return;

            const listContainer = document.createElement('div');
            listContainer.className = 'fixed inset-0 z-50 flex items-center justify-center follow-list-container';
            listContainer.setAttribute('role', 'dialog');
            listContainer.setAttribute('aria-modal', 'true');
            listContainer.innerHTML = `
                <div class="follow-list-box" tabindex="-1">
                    <div class="flex justify-between items-center mb-4">
                        <h3>${type === 'following' ? '关注的人' : '粉丝'}</h3>
                        <button id="close-follow-modal" class="text-white/50 hover:text-white text-2xl leading-none transition"
                                aria-label="关闭" style="color:#AFAFAF; background:transparent; border:none; cursor:pointer;">&times;</button>
                    </div>
                    <div id="follow-list-content">
                        <p class="empty-state">加载中...</p>
                    </div>
                </div>`;

            lastFocusedBeforeList = document.activeElement;
            bodyOverflowBeforeList = document.body.style.overflow;

            document.body.appendChild(listContainer);
            document.body.style.overflow = 'hidden';

            const modalContent = listContainer.querySelector('#follow-list-content');
            const closeBtn = listContainer.querySelector('#close-follow-modal');

            const closeFn = () => {
                listContainer.remove();
                document.body.style.overflow = bodyOverflowBeforeList;
                if (lastFocusedBeforeList && lastFocusedBeforeList.focus) lastFocusedBeforeList.focus();
                lastFocusedBeforeList = null;
                document.removeEventListener('keydown', escHandler);
            };
            const escHandler = (e) => { if (e.key === 'Escape') closeFn(); };

            closeBtn.addEventListener('click', closeFn);
            listContainer.addEventListener('click', (e) => {
                if (e.target === listContainer) closeFn();
            });
            document.addEventListener('keydown', escHandler);
            requestAnimationFrame(() => listContainer.querySelector('.follow-list-box')?.focus());

            let userIds = [];
            if (type === 'following') {
                const { data, error } = await supabaseClient.from('follows')
                    .select('following_id').eq('follower_id', userId);
                if (error) { modalContent.innerHTML = `<p class="text-red-400">加载失败：${escapeHtml(error.message)}</p>`; return; }
                userIds = data.map(item => item.following_id);
            } else {
                const { data, error } = await supabaseClient.from('follows')
                    .select('follower_id').eq('following_id', userId);
                if (error) { modalContent.innerHTML = `<p class="text-red-400">加载失败：${escapeHtml(error.message)}</p>`; return; }
                userIds = data.map(item => item.follower_id);
            }

            if (!userIds || userIds.length === 0) {
                modalContent.innerHTML = `<p class="empty-state">暂无${type === 'following' ? '关注' : '粉丝'}</p>`;
                return;
            }

            const { data: profiles, error: profilesError } = await supabaseClient
                .from('profiles').select('id, username, avatar_emoji, avatar_url').in('id', userIds);
            if (profilesError) {
                modalContent.innerHTML = `<p class="text-red-400">加载失败：${escapeHtml(profilesError.message)}</p>`;
                return;
            }

            modalContent.innerHTML = profiles.map(user => {
                const name = escapeHtml(user.username || '未设置');
                const avatarUrl = safeUrl(user.avatar_url);
                return `
                <div class="follow-user-item" data-user-id="${user.id}">
                    <div class="follow-user-avatar">
                        ${avatarUrl
                        ? `<img src="${avatarUrl}" alt="${name} 的头像" onerror="this.style.display='none'; this.parentElement.textContent='🙂';" />`
                        : escapeHtml(user.avatar_emoji || '🙂')}
                    </div>
                    <span class="follow-user-name">${name}</span>
                </div>`;
            }).join('');

            modalContent.querySelectorAll('[data-user-id]').forEach(el => {
                el.addEventListener('click', () => {
                    const targetId = el.getAttribute('data-user-id');
                    closeFn();
                    window.location.href = `profile.html?user_id=${targetId}`;
                });
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            closeProfileEditor();
            closeBackgroundEditor();
        });

        initProfilePage();
    </script>

    <script src="nav.js"></script>
    <script src="ai-assistant.js"></script>
</body>

</html>
